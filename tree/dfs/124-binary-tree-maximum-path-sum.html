<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Tree Maximum Path Sum | DFS Stack Frames</title>
    <meta name="description"
        content="Interactive dry-run visualization of the Binary Tree Maximum Path Sum problem using DFS and stack frame tracking.">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../core/engine.css">
    <style>
        /* TREE VIZ */
        .tree-container {
            width: 100%;
            min-height: 280px;
            position: relative;
            display: flex;
            justify-content: center;
            padding-top: 20px;
        }

        .tree-node {
            position: absolute;
            width: 40px;
            height: 40px;
            background: white;
            border: 2px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            z-index: 2;
            transition: all 0.5s ease;
            transform: translate(-50%, -50%);
        }

        .tree-node.active {
            border-color: var(--accent);
            background: var(--accent-light);
            color: var(--accent);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
            transform: translate(-50%, -50%) scale(1.1);
        }

        .tree-node.visited {
            border-color: var(--emerald);
            color: var(--emerald);
            background: var(--emerald-bg);
        }

        .tree-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: visible;
        }

        .tree-edge {
            stroke: var(--border);
            stroke-width: 2px;
            transition: stroke 0.3s, x1 0.5s ease, y1 0.5s ease, x2 0.5s ease, y2 0.5s ease;
        }

        .tree-edge.active {
            stroke: var(--accent);
            stroke-width: 3px;
        }

        /* STACK FRAMES */
        .stack-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            padding-left: 10px;
        }

        .stack-frame {
            display: grid;
            grid-template-columns: 80px 1fr 1fr;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg2);
            border: 1px dashed var(--border);
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            transition: all 0.3s;
        }

        .stack-frame.active {
            background: var(--accent-light);
            border: 1px solid var(--accent);
            color: var(--accent);
            box-shadow: var(--shadow-sm);
            transform: translateX(5px);
        }

        .stack-frame.returning {
            background: var(--pink-bg);
            border: 1px solid var(--pink);
            transform: translateX(-5px);
        }

        /* SVG for arrows linking frames */
        .stack-arrows {
            position: absolute;
            top: 0;
            left: -20px;
            width: 30px;
            height: 100%;
            pointer-events: none;
            overflow: visible;
        }

        .stack-arrow-path {
            fill: none;
            stroke-width: 2px;
            stroke-dasharray: 4;
            animation: dashDraw 0.4s linear forwards;
        }

        .stack-arrow-path.call {
            stroke: var(--accent);
        }

        .stack-arrow-path.return {
            stroke: var(--pink);
        }

        @keyframes dashDraw {
            from {
                stroke-dashoffset: 20;
            }

            to {
                stroke-dashoffset: 0;
            }
        }

        .frame-node {
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .frame-node::before {
            content: "Node";
            font-size: 9px;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        .frame-var {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .frame-var span.lbl {
            font-size: 9px;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .frame-var span.val {
            font-weight: 600;
            color: var(--text);
        }

        .active .frame-var span.val {
            color: var(--accent);
        }

        .active .frame-var span.lbl {
            color: rgba(79, 70, 229, 0.6);
        }

        .step-text {
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-secondary);
        }

        .step-text .hl-accent {
            color: var(--accent);
            font-weight: 600;
        }

        .step-text .hl-emerald {
            color: var(--emerald);
            font-weight: 600;
        }

        .step-text .hl-orange {
            color: var(--orange);
            font-weight: 600;
        }

        .step-text .hl-pink {
            color: var(--pink);
            font-weight: 600;
        }

        .global-max {
            background: var(--orange-bg);
            border: 1px solid var(--orange);
            color: var(--orange);
            padding: 10px 16px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .global-max span.label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--orange);
            opacity: 0.8;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body>
    <script src="../../core/engine.js"></script>
    <script>
        const CODE_LINES = [
            { tokens: [{ t: 'kw', v: 'class' }, { t: 'tp', v: ' Solution' }, { t: 'br', v: ' {' }] },
            { tokens: [{ t: '', v: '' }] },
            { tokens: [{ t: 'kw', v: '    public int' }, { t: 'fn', v: ' maxPathSum' }, { t: 'br', v: '(' }, { t: 'tp', v: 'TreeNode' }, { t: '', v: ' root' }, { t: 'br', v: ') {' }] },
            { tokens: [{ t: 'tp', v: '        int' }, { t: 'br', v: '[]' }, { t: '', v: ' maxi ' }, { t: 'op', v: '=' }, { t: 'kw', v: ' new int' }, { t: 'br', v: '[1];' }] },
            { tokens: [{ t: '', v: '        maxi' }, { t: 'br', v: '[0]' }, { t: 'op', v: '=' }, { t: 'tp', v: 'Integer' }, { t: 'op', v: '.' }, { t: '', v: 'MIN_VALUE;' }] },
            { tokens: [{ t: 'tp', v: '        int' }, { t: '', v: ' help' }, { t: 'op', v: '=' }, { t: 'fn', v: 'helper' }, { t: 'br', v: '(' }, { t: '', v: 'root,maxi' }, { t: 'br', v: ');' }] },
            { tokens: [{ t: 'ret', v: '        return' }, { t: '', v: ' maxi' }, { t: 'br', v: '[0];' }] },
            { tokens: [{ t: 'br', v: '    }' }] },
            { tokens: [{ t: '', v: '' }] },
            { tokens: [{ t: 'kw', v: '    private int' }, { t: 'fn', v: ' helper' }, { t: 'br', v: '(' }, { t: 'tp', v: 'TreeNode' }, { t: '', v: ' root,' }, { t: 'tp', v: 'int' }, { t: 'br', v: '[]' }, { t: '', v: ' maxi' }, { t: 'br', v: '){' }] },
            { tokens: [{ t: 'kw', v: '        if' }, { t: 'br', v: '(' }, { t: '', v: 'root' }, { t: 'op', v: '==' }, { t: 'kw', v: 'null' }, { t: 'br', v: ')' }, { t: 'ret', v: ' return' }, { t: 'num', v: ' 0;' }] },
            { tokens: [{ t: 'tp', v: '        int' }, { t: '', v: ' leftSum' }, { t: 'op', v: '=' }, { t: 'tp', v: 'Math' }, { t: 'op', v: '.' }, { t: 'fn', v: 'max' }, { t: 'br', v: '(' }, { t: 'num', v: '0' }, { t: 'op', v: ',' }, { t: 'fn', v: 'helper' }, { t: 'br', v: '(' }, { t: '', v: 'root.left,maxi' }, { t: 'br', v: '));' }] },
            { tokens: [{ t: 'tp', v: '        int' }, { t: '', v: ' rightSum' }, { t: 'op', v: '=' }, { t: 'tp', v: 'Math' }, { t: 'op', v: '.' }, { t: 'fn', v: 'max' }, { t: 'br', v: '(' }, { t: 'num', v: '0' }, { t: 'op', v: ',' }, { t: 'fn', v: 'helper' }, { t: 'br', v: '(' }, { t: '', v: 'root.right,maxi' }, { t: 'br', v: '));' }] },
            { tokens: [{ t: '', v: '        maxi' }, { t: 'br', v: '[0]' }, { t: 'op', v: '=' }, { t: 'tp', v: 'Math' }, { t: 'op', v: '.' }, { t: 'fn', v: 'max' }, { t: 'br', v: '(' }, { t: '', v: 'maxi' }, { t: 'br', v: '[0]' }, { t: 'op', v: ',' }, { t: '', v: 'leftSum' }, { t: 'op', v: '+' }, { t: '', v: 'rightSum' }, { t: 'op', v: '+' }, { t: '', v: 'root.val' }, { t: 'br', v: ');' }] },
            { tokens: [{ t: 'ret', v: '        return ' }, { t: 'tp', v: 'Math' }, { t: 'op', v: '.' }, { t: 'fn', v: 'max' }, { t: 'br', v: '(' }, { t: '', v: 'leftSum' }, { t: 'op', v: ',' }, { t: '', v: 'rightSum' }, { t: 'br', v: ')' }, { t: 'op', v: '+' }, { t: '', v: 'root.val' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'br', v: '    }' }] },
            { tokens: [{ t: 'br', v: '}' }] }
        ];

        function clone(obj) { return typeof structuredClone === 'function' ? structuredClone(obj) : JSON.parse(JSON.stringify(obj)); }

        // --- Tree Parsing and Graph Data Structure ---
        function buildTree(arr) {
            if (!arr.length || arr[0] === 'null' || arr[0] === '') return null;
            const root = { id: 0, val: Number.parseInt(arr[0]), left: null, right: null };
            const queue = [root];
            let i = 1; let idC = 1;
            while (i < arr.length && queue.length) {
                const curr = queue.shift();
                if (i < arr.length && arr[i] !== "null" && arr[i] !== null && arr[i] !== undefined && arr[i].trim() !== '') {
                    curr.left = { id: idC++, val: Number.parseInt(arr[i]), left: null, right: null };
                    queue.push(curr.left);
                } i++;
                if (i < arr.length && arr[i] !== "null" && arr[i] !== null && arr[i] !== undefined && arr[i].trim() !== '') {
                    curr.right = { id: idC++, val: Number.parseInt(arr[i]), left: null, right: null };
                    queue.push(curr.right);
                } i++;
            }
            return root;
        }

        function extractTreeState(root) {
            const nodes = [];
            const edges = [];

            function traverseAndPosition(node, left, right, y, depth) {
                if (!node) return;
                const x = (left + right) / 2;
                nodes.push({ id: node.id, val: node.val, x, y, depth });

                if (node.left) {
                    edges.push({ source: node.id, target: node.left.id, type: 'left' });
                    traverseAndPosition(node.left, left, x, y + 60, depth + 1);
                }
                if (node.right) {
                    edges.push({ source: node.id, target: node.right.id, type: 'right' });
                    traverseAndPosition(node.right, x, right, y + 60, depth + 1);
                }
            }

            traverseAndPosition(root, 0, 600, 30, 0); // 600 default width
            return { nodes, edges };
        }

        function generateTrace(initialRoot) {
            const steps = [];
            let callStack = [];
            let nextFrameId = 1;
            const visitedIds = new Set();
            let maxi = Number.MIN_SAFE_INTEGER;
            const CONST_MIN_INT = "-2147483648 (MIN)";

            // Extract initially to reuse visual bounds
            const treeVisualState = extractTreeState(initialRoot);

            // Initial call to maxPathSum
            steps.push({
                codeLine: 2,
                desc: `Call <span class="hl-accent">public int maxPathSum(root)</span>`,
                activeNode: initialRoot ? initialRoot.id : -1,
                stack: [],
                visited: [],
                treeVisualState: treeVisualState,
                maxiVal: '?'
            });

            steps.push({
                codeLine: 4,
                desc: `Initialize global <span class="hl-orange">maxi[0]</span> to Integer.MIN_VALUE`,
                activeNode: initialRoot ? initialRoot.id : -1,
                stack: [],
                visited: [],
                treeVisualState: treeVisualState,
                maxiVal: CONST_MIN_INT
            });

            function dfs(node) {
                const frameId = nextFrameId++;
                const nval = node ? node.val : 'null';
                const nid = node ? node.id : -1;

                const frameState = { id: frameId, nodeVal: nval, nodeId: nid, leftSum: '?', rightSum: '?', isReturning: false, isComplete: false };
                callStack.push(frameState);

                steps.push({
                    codeLine: 9,
                    desc: `Call <span class="hl-accent">helper(${nval}, maxi)</span>`,
                    activeNode: nid,
                    stack: clone(callStack),
                    visited: Array.from(visitedIds),
                    arrowType: 'call',
                    treeVisualState,
                    maxiVal: maxi === Number.MIN_SAFE_INTEGER ? CONST_MIN_INT : maxi
                });

                if (node) visitedIds.add(nid);

                if (!node) {
                    steps.push({ codeLine: 10, desc: `root is null! <span class="hl-accent">Return 0</span>.`, activeNode: nid, stack: clone(callStack), visited: Array.from(visitedIds), treeVisualState, maxiVal: maxi === Number.MIN_SAFE_INTEGER ? CONST_MIN_INT : maxi });

                    frameState.isReturning = true;
                    frameState.isComplete = true;
                    steps.push({ codeLine: 10, desc: `<span class="hl-accent">Return 0</span> to caller.`, activeNode: nid, stack: clone(callStack), visited: Array.from(visitedIds), arrowType: 'return', treeVisualState, maxiVal: maxi === Number.MIN_SAFE_INTEGER ? CONST_MIN_INT : maxi });
                    callStack.pop();
                    return 0;
                }

                steps.push({ codeLine: 10, desc: `Node ${nval} is not null. Proceed.`, activeNode: nid, stack: clone(callStack), visited: Array.from(visitedIds), treeVisualState, maxiVal: maxi === Number.MIN_SAFE_INTEGER ? CONST_MIN_INT : maxi });

                steps.push({ codeLine: 11, desc: `Call helper on left child, taking Math.max(0, ...)`, activeNode: nid, stack: clone(callStack), visited: Array.from(visitedIds), treeVisualState, maxiVal: maxi === Number.MIN_SAFE_INTEGER ? CONST_MIN_INT : maxi });
                const rawLeft = dfs(node.left);
                const leftSum = Math.max(0, rawLeft);
                frameState.leftSum = leftSum;
                frameState.isReturning = false;

                steps.push({ codeLine: 11, desc: `<span class="hl-orange">leftSum</span> = Math.max(0, ${rawLeft}) = <span class="hl-orange">${leftSum}</span>`, activeNode: nid, stack: clone(callStack), visited: Array.from(visitedIds), treeVisualState, maxiVal: maxi === Number.MIN_SAFE_INTEGER ? CONST_MIN_INT : maxi });

                steps.push({ codeLine: 12, desc: `Call helper on right child, taking Math.max(0, ...)`, activeNode: nid, stack: clone(callStack), visited: Array.from(visitedIds), treeVisualState, maxiVal: maxi === Number.MIN_SAFE_INTEGER ? CONST_MIN_INT : maxi });
                const rawRight = dfs(node.right);
                const rightSum = Math.max(0, rawRight);
                frameState.rightSum = rightSum;
                frameState.isReturning = false;

                steps.push({ codeLine: 12, desc: `<span class="hl-orange">rightSum</span> = Math.max(0, ${rawRight}) = <span class="hl-orange">${rightSum}</span>`, activeNode: nid, stack: clone(callStack), visited: Array.from(visitedIds), treeVisualState, maxiVal: maxi === Number.MIN_SAFE_INTEGER ? CONST_MIN_INT : maxi });

                const newPathSum = leftSum + rightSum + node.val;
                steps.push({ codeLine: 13, desc: `Current triangle sum: leftSum (${leftSum}) + rightSum (${rightSum}) + root.val (${node.val}) = <span class="hl-accent">${newPathSum}</span>`, activeNode: nid, stack: clone(callStack), visited: Array.from(visitedIds), treeVisualState, maxiVal: maxi === Number.MIN_SAFE_INTEGER ? CONST_MIN_INT : maxi });

                let oldMaxi = maxi;
                maxi = Math.max(maxi, newPathSum);

                steps.push({ codeLine: 13, desc: `<span class="hl-orange">maxi[0]</span> updated to Math.max(${oldMaxi === Number.MIN_SAFE_INTEGER ? CONST_MIN_INT : oldMaxi}, ${newPathSum}) = <span class="hl-orange">${maxi}</span>`, activeNode: nid, stack: clone(callStack), visited: Array.from(visitedIds), treeVisualState, maxiVal: maxi });

                const returnVal = Math.max(leftSum, rightSum) + node.val;
                frameState.isReturning = true;
                frameState.isComplete = true;

                steps.push({ codeLine: 14, desc: `Return Math.max(${leftSum}, ${rightSum}) + ${node.val} = <span class="hl-accent">${returnVal}</span> to caller.`, activeNode: nid, stack: clone(callStack), visited: Array.from(visitedIds), arrowType: 'return', treeVisualState, maxiVal: maxi });

                callStack.pop();
                return returnVal;
            }

            if (initialRoot) {
                dfs(initialRoot);
            }

            steps.push({ codeLine: 6, desc: `helper() returns. maxi is <span class="hl-orange">${maxi}</span>`, activeNode: -1, stack: [], visited: Array.from(visitedIds), treeVisualState, maxiVal: maxi });
            steps.push({ codeLine: null, desc: `Execution complete. The maximum path sum is <span class="hl-orange">${maxi}</span>.`, activeNode: -1, stack: [], visited: Array.from(visitedIds), treeVisualState, maxiVal: maxi });
            return steps;
        }

        const engine = new VizEngine({
            title: "Binary Tree Maximum Path Sum",
            badge: "Max Path Sum",
            tag: "Tree / DFS",
            codeLines: CODE_LINES,
            inputs: [
                { id: "inputArr", label: "Input (Level Order)", default: "-10,9,20,null,null,15,7", width: "220px" }
            ],
            onRun: () => {
                const v = document.getElementById('inputArr').value.trim();
                const arr = v.split(',').map(s => s.trim());
                if (!arr || arr.length === 0 || arr[0] === "") return [];
                const root = buildTree(arr);
                return generateTrace(root);
            },
            onRenderStep: (step, container, eng) => {
                // MAXI TRACKER
                if (step.maxiVal !== undefined && step.maxiVal !== '?') {
                    container.innerHTML += `<div class="global-max"><span class="label">Global maxi[0]</span><span>${step.maxiVal}</span></div>`;
                }

                // TREE VISUALIZATION
                const ts = step.treeVisualState;
                let treeHtml = `<div class="tree-container">`;
                let svgHtml = '<svg class="tree-svg" xmlns="http://www.w3.org/2000/svg">';

                if (ts && ts.edges) {
                    ts.edges.forEach(e => {
                        const sourceNode = ts.nodes.find(n => n.id === e.source);
                        const targetNode = ts.nodes.find(n => n.id === e.target);
                        const isAct = (step.activeNode === sourceNode.id || step.activeNode === targetNode.id) ? ' active' : '';
                        svgHtml += `<line x1="${sourceNode.x}" y1="${sourceNode.y}" x2="${targetNode.x}" y2="${targetNode.y}" class="tree-edge${isAct}" />`;
                    });
                }
                svgHtml += '</svg>';
                treeHtml += svgHtml;

                if (ts && ts.nodes) {
                    ts.nodes.forEach(n => {
                        const isAct = step.activeNode === n.id;
                        const isVis = step.visited && step.visited.includes(n.id);
                        let cls = `tree-node`;
                        if (isAct) cls += ` active`;
                        else if (isVis) cls += ` visited`;
                        treeHtml += `<div class="${cls}" style="left:${n.x}px; top:${n.y}px;">${n.val}</div>`;
                    });
                }
                treeHtml += `</div>`;

                container.innerHTML += eng.createZoomableCard('tree_zoom', '🌲 Binary Tree Structure', treeHtml, '280px');

                // STACK VISUALIZATION
                let stackHtml = `<div class="stack-container">`;
                if (!step.stack.length) {
                    stackHtml += '<div style="font-size: 13px; color: var(--text-dim); text-align: center; padding: 10px;">Stack is empty</div>';
                } else {
                    const reversedStack = [...step.stack].reverse();
                    reversedStack.forEach((f, idx) => {
                        const actCls = (idx === 0 && !f.isReturning) ? ' active' : '';
                        const retCls = f.isReturning ? ' returning' : '';
                        stackHtml += `
                            <div class="stack-frame${actCls}${retCls}" id="frame-${f.id}">
                                <div class="frame-node">${f.nodeVal === 'null' ? 'null' : f.nodeVal}</div>
                                <div class="frame-var"><span class="lbl">leftSum</span><span class="val ${f.leftSum !== '?' ? 'hl-orange' : ''}">${f.leftSum}</span></div>
                                <div class="frame-var"><span class="lbl">rightSum</span><span class="val ${f.rightSum !== '?' ? 'hl-orange' : ''}">${f.rightSum}</span></div>
                            </div>
                        `;
                    });

                    if (step.arrowType && step.stack.length > 1) {
                        stackHtml += `
                        <svg class="stack-arrows" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <marker id="arrowhead-call" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                                    <polygon points="0 0, 6 3, 0 6" fill="var(--accent)" />
                                </marker>
                                <marker id="arrowhead-return" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                                    <polygon points="0 0, 6 3, 0 6" fill="var(--pink)" />
                                </marker>
                            </defs>`;
                        if (step.arrowType === 'call') {
                            stackHtml += `<path d="M 20 60 Q 5 40 20 20" class="stack-arrow-path call" marker-end="url(#arrowhead-call)" />`;
                        } else if (step.arrowType === 'return') {
                            stackHtml += `<path d="M 20 20 Q 5 40 20 60" class="stack-arrow-path return" marker-end="url(#arrowhead-return)" />`;
                        }
                        stackHtml += `</svg>`;
                    }
                }
                stackHtml += `</div>`;

                container.innerHTML += eng.createSimpleCard('📚 Call Stack (DFS Frames)', stackHtml);
                container.innerHTML += eng.createSimpleCard('💡 Current Operation', `<div class="step-text">${step.desc}</div>`);
            }
        });

        engine.init();
    </script>
</body>

</html>
