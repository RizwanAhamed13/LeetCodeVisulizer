<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LC #104 — Maximum Depth of Binary Tree | DFS Stack Frames</title>
    <meta name="description"
        content="Interactive dry-run visualization of LeetCode #104 Maximum Depth of Binary Tree using DFS and stack frame tracking.">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../core/engine.css">
    <style>
        /* TREE VIZ */
        .tree-container {
            width: 100%;
            min-height: 280px;
            position: relative;
            display: flex;
            justify-content: center;
            padding-top: 20px;
        }

        .tree-node {
            position: absolute;
            width: 40px;
            height: 40px;
            background: white;
            border: 2px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            z-index: 2;
            transition: all 0.3s;
            transform: translate(-50%, -50%);
        }

        .tree-node.active {
            border-color: var(--accent);
            background: var(--accent-light);
            color: var(--accent);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
            transform: translate(-50%, -50%) scale(1.1);
        }

        .tree-node.visited {
            border-color: var(--emerald);
            color: var(--emerald);
            background: var(--emerald-bg);
        }

        .tree-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: visible;
        }

        .tree-edge {
            stroke: var(--border);
            stroke-width: 2px;
            transition: stroke 0.3s;
        }

        .tree-edge.active {
            stroke: var(--accent);
            stroke-width: 3px;
        }

        /* STACK FRAMES */
        .stack-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            padding-left: 10px;
        }

        .stack-frame {
            display: grid;
            grid-template-columns: 80px 1fr 1fr 1fr;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg2);
            border: 1px dashed var(--border);
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            transition: all 0.3s;
        }

        .stack-frame.active {
            background: var(--accent-light);
            border: 1px solid var(--accent);
            color: var(--accent);
            box-shadow: var(--shadow-sm);
            transform: translateX(5px);
        }

        .stack-frame.returning {
            background: var(--pink-bg);
            border: 1px solid var(--pink);
            transform: translateX(-5px);
        }

        /* SVG for arrows linking frames */
        .stack-arrows {
            position: absolute;
            top: 0;
            left: -20px;
            width: 30px;
            height: 100%;
            pointer-events: none;
            overflow: visible;
        }

        .stack-arrow-path {
            fill: none;
            stroke-width: 2px;
            stroke-dasharray: 4;
            animation: dashDraw 0.4s linear forwards;
        }

        .stack-arrow-path.call {
            stroke: var(--accent);
        }

        .stack-arrow-path.return {
            stroke: var(--pink);
        }

        @keyframes dashDraw {
            from {
                stroke-dashoffset: 20;
            }

            to {
                stroke-dashoffset: 0;
            }
        }

        .frame-node {
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .frame-node::before {
            content: "Node";
            font-size: 9px;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        .frame-var {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .frame-var span.lbl {
            font-size: 9px;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .frame-var span.val {
            font-weight: 600;
            color: var(--text);
        }

        .active .frame-var span.val {
            color: var(--accent);
        }

        .active .frame-var span.lbl {
            color: rgba(79, 70, 229, 0.6);
        }

        .step-text {
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-secondary);
        }

        .step-text .hl-accent {
            color: var(--accent);
            font-weight: 600;
        }

        .step-text .hl-emerald {
            color: var(--emerald);
            font-weight: 600;
        }

        .step-text .hl-pink {
            color: var(--pink);
            font-weight: 600;
        }
    </style>
</head>

<body>
    <script src="../../core/engine.js"></script>
    <script>
        const CODE_LINES = [
            { tokens: [{ t: 'kw', v: 'class' }, { t: 'tp', v: ' Solution' }, { t: 'br', v: ' {' }] },
            { tokens: [{ t: 'kw', v: '    public static' }, { t: 'tp', v: ' int' }, { t: 'fn', v: ' maxDepth' }, { t: 'br', v: '(' }, { t: 'tp', v: 'Node' }, { t: '', v: ' root' }, { t: 'br', v: ') {' }] },
            { tokens: [{ t: 'kw', v: '        if' }, { t: 'br', v: '(' }, { t: '', v: 'root' }, { t: 'op', v: '==' }, { t: 'kw', v: 'null' }, { t: 'br', v: ')' }, { t: 'ret', v: ' return' }, { t: 'num', v: ' 0' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'tp', v: '        int' }, { t: '', v: ' height1' }, { t: 'op', v: ' = ' }, { t: 'fn', v: 'maxDepth' }, { t: 'br', v: '(' }, { t: '', v: 'root.left' }, { t: 'br', v: ')' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'tp', v: '        int' }, { t: '', v: ' height2' }, { t: 'op', v: ' = ' }, { t: 'fn', v: 'maxDepth' }, { t: 'br', v: '(' }, { t: '', v: 'root.right' }, { t: 'br', v: ')' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'ret', v: '        return' }, { t: 'tp', v: ' Math' }, { t: 'op', v: '.' }, { t: 'fn', v: 'max' }, { t: 'br', v: '(' }, { t: '', v: 'height1' }, { t: 'op', v: ',' }, { t: '', v: 'height2' }, { t: 'br', v: ')' }, { t: 'op', v: '+' }, { t: 'num', v: '1' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'br', v: '    }' }] },
            { tokens: [{ t: 'br', v: '}' }] },
        ];

        function clone(obj) { return typeof structuredClone === 'function' ? structuredClone(obj) : JSON.parse(JSON.stringify(obj)); }

        // --- Tree Parsing and Positions ---
        let treeNodes = [];
        function buildTree(arr) {
            treeNodes = [];
            if (!arr.length || arr[0] === 'null' || arr[0] === '') return null;
            const root = { id: 0, val: arr[0], left: null, right: null, x: 0, y: 0 };
            treeNodes.push(root);
            const queue = [root];
            let i = 1; let idC = 1;
            while (i < arr.length && queue.length) {
                const curr = queue.shift();
                if (i < arr.length && arr[i] !== "null" && arr[i] !== null && arr[i] !== undefined && arr[i].trim() !== '') {
                    curr.left = { id: idC++, val: arr[i], left: null, right: null };
                    treeNodes.push(curr.left);
                    queue.push(curr.left);
                } i++;
                if (i < arr.length && arr[i] !== "null" && arr[i] !== null && arr[i] !== undefined && arr[i].trim() !== '') {
                    curr.right = { id: idC++, val: arr[i], left: null, right: null };
                    treeNodes.push(curr.right);
                    queue.push(curr.right);
                } i++;
            }
            return root;
        }

        function assignPositions(node, left, right, y, depth) {
            if (!node) return;
            node.x = (left + right) / 2; node.y = y;
            assignPositions(node.left, left, node.x, y + 60, depth + 1);
            assignPositions(node.right, node.x, right, y + 60, depth + 1);
        }

        function generateTrace(rootNode) {
            const steps = [];
            const callStack = [];
            let nextFrameId = 1;
            const visitedIds = new Set();

            function dfs(node) {
                const frameId = nextFrameId++;
                const nval = node ? node.val : 'null';
                const nid = node ? node.id : -1;
                callStack.push({ id: frameId, nodeVal: nval, nodeId: nid, h1: '?', h2: '?', ret: '?', isReturning: false });

                steps.push({ codeLine: 1, desc: `Call maxDepth(Node ${nval})`, activeNode: nid, stack: clone(callStack), visited: Array.from(visitedIds), arrowType: 'call' });
                if (node) visitedIds.add(nid);

                if (!node) {
                    steps.push({ codeLine: 2, desc: `root is null! Return 0.`, activeNode: nid, stack: clone(callStack), visited: Array.from(visitedIds) });
                    callStack[callStack.length - 1].ret = 0;
                    callStack[callStack.length - 1].isReturning = true;
                    steps.push({ codeLine: 2, desc: `<span class="hl-accent">Return 0</span> to caller.`, activeNode: nid, stack: clone(callStack), visited: Array.from(visitedIds), arrowType: 'return' });
                    callStack.pop();
                    return 0;
                }

                steps.push({ codeLine: 2, desc: `Node ${nval} is not null. Proceed.`, activeNode: nid, stack: clone(callStack), visited: Array.from(visitedIds) });

                steps.push({ codeLine: 3, desc: `Call maxDepth consistently to the left child.`, activeNode: nid, stack: clone(callStack), visited: Array.from(visitedIds) });
                const h1 = dfs(node.left);

                callStack[callStack.length - 1].h1 = h1;
                callStack[callStack.length - 1].isReturning = false;
                steps.push({ codeLine: 3, desc: `Left child returned <span class="hl-accent">${h1}</span>. Therefore, <span class="hl-emerald">height1 = ${h1}</span> for Node ${nval}.`, activeNode: nid, stack: clone(callStack), visited: Array.from(visitedIds) });

                steps.push({ codeLine: 4, desc: `Call maxDepth on the right child.`, activeNode: nid, stack: clone(callStack), visited: Array.from(visitedIds) });
                const h2 = dfs(node.right);

                callStack[callStack.length - 1].h2 = h2;
                callStack[callStack.length - 1].isReturning = false;
                steps.push({ codeLine: 4, desc: `Right child returned <span class="hl-accent">${h2}</span>. Therefore, <span class="hl-emerald">height2 = ${h2}</span> for Node ${nval}.`, activeNode: nid, stack: clone(callStack), visited: Array.from(visitedIds) });

                const ret = Math.max(h1, h2) + 1;
                callStack[callStack.length - 1].ret = ret;
                callStack[callStack.length - 1].isReturning = true;
                steps.push({ codeLine: 5, desc: `Math.max(${h1}, ${h2}) + 1 = <strong>${ret}</strong>.<br><span class="hl-accent">Return ${ret}</span> up the chain.`, activeNode: nid, stack: clone(callStack), visited: Array.from(visitedIds), arrowType: 'return' });

                callStack.pop();
                return ret;
            }

            if (rootNode) dfs(rootNode);
            steps.push({ codeLine: null, desc: `Execution complete. Final tree depth is returned to the main process.`, activeNode: -1, stack: [], visited: Array.from(visitedIds) });
            return steps;
        }

        const engine = new VizEngine({
            title: "Maximum Depth of Binary Tree",
            badge: "LC #104",
            tag: "Tree / DFS",
            codeLines: CODE_LINES,
            inputs: [
                { id: "inputArr", label: "Input (Level Order)", default: "3,9,20,null,null,15,7", width: "220px" }
            ],
            onRun: () => {
                const v = document.getElementById('inputArr').value.trim();
                const arr = v.split(',').map(s => s.trim());
                if (!arr || arr.length === 0 || arr[0] === "") return [];
                const root = buildTree(arr);
                if (root) assignPositions(root, 0, 600, 30, 0);
                return generateTrace(root);
            },
            onRenderStep: (step, container, eng) => {
                // TREE VISUALIZATION
                let treeHtml = `<div class="tree-container">`;
                let svgHtml = '<svg class="tree-svg">';
                treeNodes.forEach(n => {
                    if (n.left) svgHtml += `<line x1="${n.x}" y1="${n.y}" x2="${n.left.x}" y2="${n.left.y}" class="tree-edge ${step.activeNode === n.left.id || step.activeNode === n.id ? 'active' : ''}" />`;
                    if (n.right) svgHtml += `<line x1="${n.x}" y1="${n.y}" x2="${n.right.x}" y2="${n.right.y}" class="tree-edge ${step.activeNode === n.right.id || step.activeNode === n.id ? 'active' : ''}" />`;
                });
                svgHtml += '</svg>';
                treeHtml += svgHtml;

                // Draw Nodes
                treeNodes.forEach(n => {
                    const isAct = step.activeNode === n.id;
                    const isVis = step.visited && step.visited.includes(n.id);
                    treeHtml += `<div class="tree-node ${isAct ? 'active' : ''} ${!isAct && isVis ? 'visited' : ''}" style="left:${n.x}px; top:${n.y}px;">${n.val}</div>`;
                });
                treeHtml += `</div>`;

                container.innerHTML += eng.createZoomableCard('tree_zoom', '🌲 Binary Tree Traversal', treeHtml, '280px');

                // STACK VISUALIZATION
                let stackHtml = `<div class="stack-container">`;
                if (!step.stack.length) {
                    stackHtml += '<div style="font-size: 13px; color: var(--text-dim); text-align: center; padding: 10px;">Stack is empty</div>';
                } else {
                    const reversedStack = [...step.stack].reverse();
                    reversedStack.forEach((f, idx) => {
                        const actCls = (idx === 0 && !f.isReturning) ? ' active' : '';
                        const retCls = f.isReturning ? ' returning' : '';
                        stackHtml += `
                            <div class="stack-frame${actCls}${retCls}" id="frame-${f.id}">
                                <div class="frame-node">${f.nodeVal === 'null' ? 'null' : f.nodeVal}</div>
                                <div class="frame-var"><span class="lbl">height1</span><span class="val">${f.h1}</span></div>
                                <div class="frame-var"><span class="lbl">height2</span><span class="val">${f.h2}</span></div>
                                <div class="frame-var"><span class="lbl">Return</span><span class="val hl-pink">${f.ret}</span></div>
                            </div>
                        `;
                    });

                    if (step.arrowType && step.stack.length > 1) {
                        stackHtml += `
                        <svg class="stack-arrows">
                            <defs>
                                <marker id="arrowhead-call" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                                    <polygon points="0 0, 6 3, 0 6" fill="var(--accent)" />
                                </marker>
                                <marker id="arrowhead-return" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                                    <polygon points="0 0, 6 3, 0 6" fill="var(--pink)" />
                                </marker>
                            </defs>`;
                        if (step.arrowType === 'call') {
                            stackHtml += `<path d="M 20 60 Q 5 40 20 20" class="stack-arrow-path call" marker-end="url(#arrowhead-call)" />`;
                        } else if (step.arrowType === 'return') {
                            stackHtml += `<path d="M 20 20 Q 5 40 20 60" class="stack-arrow-path return" marker-end="url(#arrowhead-return)" />`;
                        }
                        stackHtml += `</svg>`;
                    }
                }
                stackHtml += `</div>`;

                container.innerHTML += eng.createSimpleCard('📚 Call Stack (DFS Frames)', stackHtml);
                container.innerHTML += eng.createSimpleCard('💡 Current Operation', `<div class="step-text">${step.desc}</div>`);
            }
        });

        engine.init();
    </script>
</body>

</html>
