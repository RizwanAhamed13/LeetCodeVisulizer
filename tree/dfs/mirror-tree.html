<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirror Tree (Invert Binary Tree) | DFS Stack Frames</title>
    <meta name="description"
        content="Interactive dry-run visualization of the Mirror Tree problem using DFS and stack frame tracking.">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #ffffff;
            --bg2: #f8f9fc;
            --bg3: #f1f3f8;
            --card-bg: #ffffff;
            --code-bg: #fafbfe;
            --border: #e2e5ef;
            --text: #1a1d2e;
            --text-secondary: #4a5068;
            --text-dim: #8891a8;
            --accent: #4f46e5;
            --accent-light: #ede9fe;
            --accent2: #7c3aed;
            --emerald: #059669;
            --emerald-bg: #ecfdf5;
            --orange: #ea580c;
            --orange-bg: #fff7ed;
            --pink: #db2777;
            --cyan: #0891b2;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
            --highlight-line: rgba(79, 70, 229, 0.06);
            --radius: 14px;
            --radius-sm: 10px;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg2);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* HEADER & CONTROLS */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--bg2);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all .2s;
        }

        .back-btn:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        .header .badge {
            background: var(--accent);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .header h1 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
        }

        .header .tag {
            margin-left: auto;
            font-size: 12px;
            color: var(--accent);
            background: var(--accent-light);
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .controls-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 24px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group label {
            font-size: 12px;
            color: var(--text-dim);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .6px;
        }

        .input-group input[type="text"] {
            background: var(--bg2);
            border: 1.5px solid var(--border);
            color: var(--accent);
            padding: 8px 14px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            width: 320px;
            outline: none;
            transition: border-color .2s;
        }

        .input-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.08);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            border-radius: 8px;
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
        }

        .btn-run {
            background: var(--accent);
            color: #fff;
        }

        .btn-run:hover {
            background: var(--accent2);
            box-shadow: var(--shadow-md);
        }

        .playback {
            display: flex;
            align-items: center;
            gap: 2px;
            margin-left: 8px;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 3px;
        }

        .playback button {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 14px;
            cursor: pointer;
            border-radius: 6px;
            transition: all .15s;
        }

        .playback button:hover,
        .playback button.active {
            background: var(--accent-light);
            color: var(--accent);
        }

        .speed-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 6px;
        }

        .speed-group label {
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 500;
        }

        .speed-slider {
            -webkit-appearance: none;
            width: 72px;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            outline: none;
        }

        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(79, 70, 229, 0.3);
        }

        .step-info {
            margin-left: auto;
            font-size: 13px;
            color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
        }

        .step-info span {
            color: var(--accent);
            font-weight: 600;
        }

        /* MAIN LAYOUT */
        .main {
            display: grid;
            grid-template-columns: 460px 1fr;
            height: calc(100vh - 106px);
        }

        /* CODE PANEL */
        .code-panel {
            background: var(--code-bg);
            border-right: 1px solid var(--border);
            overflow-y: auto;
        }

        .code-panel::-webkit-scrollbar {
            width: 5px;
        }

        .code-panel::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .code-title {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: rgba(250, 251, 254, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-dim);
            font-weight: 600;
        }

        .code-title .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .dot-red {
            background: #ff5f56;
        }

        .dot-yellow {
            background: #ffbd2e;
        }

        .dot-green {
            background: #27c93f;
        }

        .code-lines {
            padding: 12px 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            line-height: 1.85;
        }

        .code-line {
            display: flex;
            padding: 0 16px 0 0;
            transition: background .2s;
            position: relative;
        }

        .code-line.active {
            background: var(--highlight-line);
            border-left: 3px solid var(--accent);
        }

        .code-line.active .line-num {
            color: var(--accent);
        }

        .line-num {
            display: inline-block;
            width: 42px;
            text-align: right;
            padding-right: 16px;
            color: #c8cdd8;
            user-select: none;
            flex-shrink: 0;
            font-size: 11px;
        }

        .line-content {
            white-space: pre;
            color: var(--text);
        }

        .kw {
            color: #8b5cf6;
            font-weight: 500;
        }

        .tp {
            color: #0891b2;
        }

        .fn {
            color: #2563eb;
        }

        .str {
            color: #059669;
        }

        .num {
            color: #ea580c;
        }

        .op {
            color: #64748b;
        }

        .br {
            color: #94a3b8;
        }

        .ret {
            color: #dc2626;
            font-weight: 500;
        }

        /* VIZ PANEL */
        .viz-panel {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 24px;
            gap: 20px;
            background: var(--bg2);
        }

        .viz-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px;
            box-shadow: var(--shadow-sm);
        }

        .section-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            gap: 14px;
            padding: 40px;
        }

        .welcome-icon {
            font-size: 56px;
            margin-bottom: 4px;
        }

        .welcome h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
        }

        .welcome p {
            color: var(--text-secondary);
            font-size: 14px;
            max-width: 380px;
            line-height: 1.6;
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: fadeSlideIn .3s ease forwards;
        }

        /* TREE VIZ */
        .tree-container {
            width: 100%;
            min-height: 280px;
            position: relative;
            display: flex;
            justify-content: center;
            padding-top: 20px;
        }

        .tree-node {
            position: absolute;
            width: 40px;
            height: 40px;
            background: white;
            border: 2px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            z-index: 2;
            transition: all 0.5s ease;
            transform: translate(-50%, -50%);
        }

        /* Node movement animations based on swap */
        .tree-node.active {
            border-color: var(--accent);
            background: var(--accent-light);
            color: var(--accent);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
            transform: translate(-50%, -50%) scale(1.1);
        }

        .tree-node.visited {
            border-color: var(--emerald);
            color: var(--emerald);
            background: var(--emerald-bg);
        }

        .tree-node.swapping {
            border-color: var(--orange);
            color: var(--orange);
            background: var(--orange-bg);
            z-index: 10;
        }

        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: visible;
        }

        .tree-edge {
            stroke: var(--border);
            stroke-width: 2px;
            transition: stroke 0.3s, x1 0.5s ease, y1 0.5s ease, x2 0.5s ease, y2 0.5s ease;
        }

        .tree-edge.active {
            stroke: var(--accent);
            stroke-width: 3px;
        }

        .tree-edge.swapping {
            stroke: var(--orange);
            stroke-width: 3px;
        }

        /* STACK FRAMES */
        .stack-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stack-frame {
            display: grid;
            grid-template-columns: 80px 1fr 1fr 1fr;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg2);
            border: 1px dashed var(--border);
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            transition: all 0.3s;
        }

        .stack-frame.active {
            background: var(--accent-light);
            border: 1px solid var(--accent);
            color: var(--accent);
            box-shadow: var(--shadow-sm);
            transform: translateX(5px);
        }

        .stack-frame.returning {
            background: var(--pink-light, #fce7f3);
            border: 1px solid var(--pink);
            transform: translateX(-5px);
        }

        .stack-arrows {
            position: absolute;
            top: 0;
            left: -30px;
            width: 30px;
            height: 100%;
            pointer-events: none;
            overflow: visible;
        }

        .stack-arrow-path {
            fill: none;
            stroke-width: 2px;
            stroke-dasharray: 4;
            animation: dashDraw 0.4s linear forwards;
        }

        .stack-arrow-path.call {
            stroke: var(--accent);
        }

        .stack-arrow-path.return {
            stroke: var(--pink);
        }

        @keyframes dashDraw {
            from {
                stroke-dashoffset: 20;
            }

            to {
                stroke-dashoffset: 0;
            }
        }

        .frame-node {
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .frame-node::before {
            content: "Node";
            font-size: 9px;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        .frame-var {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .frame-var span.lbl {
            font-size: 9px;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .frame-var span.val {
            font-weight: 600;
            color: var(--text);
        }

        .active .frame-var span.val {
            color: var(--accent);
        }

        .active .frame-var span.lbl {
            color: rgba(79, 70, 229, 0.6);
        }

        .step-text {
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-secondary);
        }

        .step-text .hl-accent {
            color: var(--accent);
            font-weight: 600;
        }

        .step-text .hl-emerald {
            color: var(--emerald);
            font-weight: 600;
        }

        .step-text .hl-orange {
            color: var(--orange);
            font-weight: 600;
        }

        .step-text .hl-pink {
            color: var(--pink);
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="header">
        <a href="../../index.html" class="back-btn">← Home</a>
        <span class="badge">Mirror Tree</span>
        <h1>Invert Binary Tree</h1>
        <span class="tag">Tree / DFS</span>
    </div>

    <div class="controls-bar">
        <div class="input-group">
            <label for="inputArr">Input (Level Order)</label>
            <input type="text" id="inputArr" value="4,2,7,1,3,6,9" placeholder="e.g. 4,2,7,1,3,6,9">
        </div>
        <button class="btn btn-run" onclick="runVisualization()">▶ Run</button>
        <div class="playback">
            <button onclick="goToStart()" title="First step">⏮</button>
            <button onclick="prevStep()" title="Previous">◀</button>
            <button id="playPauseBtn" onclick="togglePlay()" title="Play / Pause">▶</button>
            <button onclick="nextStep()" title="Next">▶</button>
            <button onclick="goToEnd()" title="Last step">⏭</button>
        </div>
        <div class="speed-group">
            <label for="speedSlider">Speed</label>
            <input type="range" class="speed-slider" id="speedSlider" min="200" max="2500" value="1000" step="100">
        </div>
        <div class="step-info">Step <span id="stepCurrent">0</span> / <span id="stepTotal">0</span></div>
    </div>

    <div class="main">
        <div class="code-panel">
            <div class="code-title"><span class="dot dot-red"></span><span class="dot dot-yellow"></span><span
                    class="dot dot-green"></span>Solution.java</div>
            <div class="code-lines" id="codeLines"></div>
        </div>
        <div class="viz-panel" id="vizPanel">
            <div class="welcome" id="welcomeState">
                <div class="welcome-icon">🌲</div>
                <h2>Mirror Tree Visualizer</h2>
                <p>Enter a comma-separated level-order array and click <strong>Run</strong> to watch the unrolling of
                    the recursive stack frames and the tree node swapping.</p>
            </div>
        </div>
    </div>

    <script>
        const CODE_LINES = [
            { tokens: [{ t: 'cm', v: '/*' }] },
            { tokens: [{ t: 'cm', v: 'class Node {' }] },
            { tokens: [{ t: 'cm', v: '    int data;' }] },
            { tokens: [{ t: 'cm', v: '    Node left, right;' }] },
            { tokens: [{ t: 'cm', v: '    Node(int item) {' }] },
            { tokens: [{ t: 'cm', v: '        data = item;' }] },
            { tokens: [{ t: 'cm', v: '        left = right = null;' }] },
            { tokens: [{ t: 'cm', v: '    }' }] },
            { tokens: [{ t: 'cm', v: '}' }] },
            { tokens: [{ t: 'cm', v: '*/' }] },
            { tokens: [{ t: '', v: '' }] },
            { tokens: [{ t: 'kw', v: 'class' }, { t: 'tp', v: ' Solution' }, { t: 'br', v: ' {' }] },
            { tokens: [{ t: 'kw', v: '    void' }, { t: 'fn', v: ' mirror' }, { t: 'br', v: '(' }, { t: 'tp', v: 'Node' }, { t: '', v: ' root' }, { t: 'br', v: ') {' }] },
            { tokens: [{ t: 'kw', v: '        if' }, { t: 'br', v: '(' }, { t: '', v: 'root' }, { t: 'op', v: '==' }, { t: 'kw', v: 'null' }, { t: 'br', v: ')' }, { t: 'ret', v: ' return' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'fn', v: '        mirror' }, { t: 'br', v: '(' }, { t: '', v: 'root.left' }, { t: 'br', v: ')' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'fn', v: '        mirror' }, { t: 'br', v: '(' }, { t: '', v: 'root.right' }, { t: 'br', v: ')' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'tp', v: '        Node' }, { t: '', v: ' temp' }, { t: 'op', v: ' = ' }, { t: '', v: 'root.left' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: '', v: '        root.left' }, { t: 'op', v: ' = ' }, { t: '', v: 'root.right' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: '', v: '        root.right' }, { t: 'op', v: ' = ' }, { t: '', v: 'temp' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'br', v: '    }' }] },
            { tokens: [{ t: 'br', v: '}' }] },
        ];

        function renderCode() {
            const c = document.getElementById('codeLines'); c.innerHTML = '';
            CODE_LINES.forEach((line, i) => {
                const div = document.createElement('div'); div.className = 'code-line'; div.id = `cl-${i}`;
                const num = document.createElement('span'); num.className = 'line-num'; num.textContent = i + 1; div.appendChild(num);
                const content = document.createElement('span'); content.className = 'line-content';
                content.innerHTML = line.tokens.length ? line.tokens.map(t => t.t ? `<span class="${t.t}">${t.v}</span>` : t.v).join('') : '&nbsp;';
                div.appendChild(content); c.appendChild(div);
            });
        }
        function highlightLine(idx) {
            document.querySelectorAll('.code-line.active').forEach(e => e.classList.remove('active'));
            if (idx !== null && idx >= 0) { const el = document.getElementById(`cl-${idx}`); if (el) { el.classList.add('active'); el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } }
        }

        function clone(obj) { return typeof structuredClone === 'function' ? structuredClone(obj) : JSON.parse(JSON.stringify(obj)); }

        // --- Tree Parsing and Graph Data Structure ---
        function buildTree(arr) {
            if (!arr.length || arr[0] === 'null' || arr[0] === '') return null;
            const root = { id: 0, val: arr[0], left: null, right: null };
            const queue = [root];
            let i = 1; let idC = 1;
            while (i < arr.length && queue.length) {
                const curr = queue.shift();
                if (i < arr.length && arr[i] !== "null" && arr[i] !== null && arr[i] !== undefined && arr[i].trim() !== '') {
                    curr.left = { id: idC++, val: arr[i], left: null, right: null };
                    queue.push(curr.left);
                } i++;
                if (i < arr.length && arr[i] !== "null" && arr[i] !== null && arr[i] !== undefined && arr[i].trim() !== '') {
                    curr.right = { id: idC++, val: arr[i], left: null, right: null };
                    queue.push(curr.right);
                } i++;
            }
            return root;
        }

        // We build a list of edges linking parent to child. During swaps, the *visual* link updates.
        function extractTreeState(root) {
            const nodes = [];
            const edges = [];

            function traverseAndPosition(node, left, right, y, depth) {
                if (!node) return;
                const x = (left + right) / 2;
                nodes.push({ id: node.id, val: node.val, x, y, depth });

                if (node.left) {
                    edges.push({ source: node.id, target: node.left.id, type: 'left' });
                    traverseAndPosition(node.left, left, x, y + 60, depth + 1);
                }
                if (node.right) {
                    edges.push({ source: node.id, target: node.right.id, type: 'right' });
                    traverseAndPosition(node.right, x, right, y + 60, depth + 1);
                }
            }

            traverseAndPosition(root, 0, 600, 30, 0); // 600 default width
            return { nodes, edges };
        }

        // Deep clone logic for the raw tree so we can step through and modify it
        function cloneTree(node) {
            if (!node) return null;
            return {
                id: node.id,
                val: node.val,
                left: cloneTree(node.left),
                right: cloneTree(node.right)
            };
        }

        function generateTrace(initialRoot) {
            const steps = [];
            let callStack = [];
            let nextFrameId = 1;
            const visitedIds = new Set();

            // We use a clone to do the simulation
            let simulationRoot = cloneTree(initialRoot);

            function dfs(node) {
                const frameId = nextFrameId++;
                const nval = node ? node.val : 'null';
                const nid = node ? node.id : -1;

                // Read current left/right to show in frame initially
                const initLeft = node && node.left ? node.left.val : 'null';
                const initRight = node && node.right ? node.right.val : 'null';

                const frameState = { id: frameId, nodeVal: nval, nodeId: nid, temp: '?', lVal: initLeft, rVal: initRight, isReturning: false, isComplete: false };
                callStack.push(frameState);

                steps.push({
                    codeLine: 12,
                    desc: `Call mirror(Node ${nval})`,
                    activeNode: nid,
                    stack: clone(callStack),
                    visited: Array.from(visitedIds),
                    arrowType: 'call',
                    treeVisualState: extractTreeState(simulationRoot)
                });

                if (node) visitedIds.add(nid);

                if (!node) {
                    steps.push({
                        codeLine: 13,
                        desc: `root is null! Return from function.`,
                        activeNode: nid,
                        stack: clone(callStack),
                        visited: Array.from(visitedIds),
                        treeVisualState: extractTreeState(simulationRoot)
                    });

                    frameState.isReturning = true;
                    frameState.isComplete = true;
                    steps.push({
                        codeLine: 13,
                        desc: `<span class="hl-accent">Return</span> to caller.`,
                        activeNode: nid,
                        stack: clone(callStack),
                        visited: Array.from(visitedIds),
                        arrowType: 'return',
                        treeVisualState: extractTreeState(simulationRoot)
                    });
                    callStack.pop();
                    return;
                }

                steps.push({ codeLine: 13, desc: `Node ${nval} is not null. Proceed.`, activeNode: nid, stack: clone(callStack), visited: Array.from(visitedIds), treeVisualState: extractTreeState(simulationRoot) });

                // Recursively call left
                steps.push({ codeLine: 14, desc: `Call mirror() on the left child.`, activeNode: nid, stack: clone(callStack), visited: Array.from(visitedIds), treeVisualState: extractTreeState(simulationRoot) });
                dfs(node.left);

                frameState.isReturning = false; // reset after sub-call completes

                // Recursively call right
                steps.push({ codeLine: 15, desc: `Call mirror() on the right child.`, activeNode: nid, stack: clone(callStack), visited: Array.from(visitedIds), treeVisualState: extractTreeState(simulationRoot) });
                dfs(node.right);

                frameState.isReturning = false;

                // Post order action: swapping!
                steps.push({
                    codeLine: 16,
                    desc: `Start swap: <span class="hl-orange">Node temp = root.left;</span> (temp is now Node ${initLeft})`,
                    activeNode: nid,
                    stack: clone(callStack),
                    visited: Array.from(visitedIds),
                    treeVisualState: extractTreeState(simulationRoot),
                    swappingNodeId: nid
                });
                frameState.temp = initLeft;

                // Re-capture state post-temp
                steps.push({
                    codeLine: 17,
                    desc: `<span class="hl-orange">root.left = root.right;</span> (left child becomes ${initRight})`,
                    activeNode: nid,
                    stack: clone(callStack),
                    visited: Array.from(visitedIds),
                    treeVisualState: extractTreeState(simulationRoot),
                    swappingNodeId: nid
                });

                // Actually simulate the swap down in the JS object graph now
                const simulatedTemp = node.left;
                node.left = node.right;
                frameState.lVal = initRight; // update frame info!

                steps.push({
                    codeLine: 18,
                    desc: `<span class="hl-orange">root.right = temp;</span> (right child becomes ${initLeft})`,
                    activeNode: nid,
                    stack: clone(callStack),
                    visited: Array.from(visitedIds),
                    treeVisualState: extractTreeState(simulationRoot),
                    swappingNodeId: nid
                });

                node.right = simulatedTemp;
                frameState.rVal = initLeft; // update frame info!

                // Final representation of this swap visually moving nodes
                steps.push({
                    codeLine: 18,
                    desc: `Visual bounds updating. Swap complete for Node ${nval}.`,
                    activeNode: nid,
                    stack: clone(callStack),
                    visited: Array.from(visitedIds),
                    treeVisualState: extractTreeState(simulationRoot), // Now with new nodes
                    swappingNodeId: nid
                });

                frameState.isReturning = true;
                frameState.isComplete = true;
                steps.push({
                    codeLine: 19,
                    desc: `End of function for Node ${nval}. Returning to caller.`,
                    activeNode: nid,
                    stack: clone(callStack),
                    visited: Array.from(visitedIds),
                    arrowType: 'return',
                    treeVisualState: extractTreeState(simulationRoot)
                });

                callStack.pop();
            }

            if (simulationRoot) dfs(simulationRoot);

            steps.push({
                codeLine: null,
                desc: `Execution complete. The binary tree has been mirrored.`,
                activeNode: -1,
                stack: [],
                visited: Array.from(visitedIds),
                treeVisualState: extractTreeState(simulationRoot)
            });
            return steps;
        }

        let steps = [], currentStep = 0, isPlaying = false, playInterval = null;

        function runVisualization() {
            const v = document.getElementById('inputArr').value.trim();
            const arr = v.split(',').map(s => s.trim());
            const root = buildTree(arr);
            steps = generateTrace(root);
            currentStep = 0; stopPlay();
            document.getElementById('welcomeState').style.display = 'none';
            renderStep();
        }

        function renderStep() {
            if (!steps.length) return;
            const step = steps[currentStep];
            document.getElementById('stepCurrent').textContent = currentStep + 1; document.getElementById('stepTotal').textContent = steps.length;
            highlightLine(step.codeLine);

            const panel = document.getElementById('vizPanel');
            panel.querySelectorAll('.viz-content').forEach(e => e.remove());
            const wrap = document.createElement('div'); wrap.className = 'viz-content animate-in';

            // TREE VISUALIZATION
            const tc = document.createElement('div'); tc.className = 'viz-card';
            tc.innerHTML = '<div class="section-label">🌲 Binary Tree Structure</div>';
            const tv = document.createElement('div'); tv.className = 'tree-container';

            const ts = step.treeVisualState;

            // Draw SVG EDges
            let svgHtml = '<svg>';
            if (ts && ts.edges) {
                ts.edges.forEach(e => {
                    const sourceNode = ts.nodes.find(n => n.id === e.source);
                    const targetNode = ts.nodes.find(n => n.id === e.target);
                    // Determine if edge should be highlighted as active or swapping
                    let extraClass = '';
                    if (step.activeNode === sourceNode.id || step.activeNode === targetNode.id) extraClass = 'active';
                    if (step.swappingNodeId === sourceNode.id || step.swappingNodeId === targetNode.id) extraClass = 'swapping active';

                    svgHtml += `<line x1="${sourceNode.x}" y1="${sourceNode.y}" x2="${targetNode.x}" y2="${targetNode.y}" class="tree-edge ${extraClass}" />`;
                });
            }
            svgHtml += '</svg>';
            tv.innerHTML += svgHtml;

            // Draw Nodes
            if (ts && ts.nodes) {
                ts.nodes.forEach(n => {
                    const isAct = step.activeNode === n.id;
                    const isVis = step.visited && step.visited.includes(n.id);
                    const isSwap = step.swappingNodeId === n.id;
                    const nd = document.createElement('div');

                    let cls = `tree-node`;
                    if (isSwap) cls += ` swapping active`;
                    else if (isAct) cls += ` active`;
                    else if (isVis) cls += ` visited`;

                    nd.className = cls;
                    nd.style.left = `${n.x}px`; nd.style.top = `${n.y}px`;
                    nd.textContent = n.val;
                    tv.appendChild(nd);
                });
            }
            tc.appendChild(tv); wrap.appendChild(tc);

            // STACK VISUALIZATION
            const sc = document.createElement('div'); sc.className = 'viz-card';
            sc.innerHTML = '<div class="section-label">📚 Call Stack (DFS Frames)</div>';
            const sv = document.createElement('div');
            sv.className = 'stack-container';
            sv.style.position = 'relative'; // important for absolute arrows

            if (!step.stack.length) {
                sv.innerHTML = '<div style="font-size: 13px; color: var(--text-dim); text-align: center; padding: 10px;">Stack is empty</div>';
            } else {
                // reverse simply to show latest frame at top, keeping track to draw arrows
                const reversedStack = [...step.stack].reverse();

                reversedStack.forEach((f, idx) => {
                    const fd = document.createElement('div');
                    fd.className = `stack-frame ${idx === 0 && !f.isReturning ? 'active' : ''} ${f.isReturning ? 'returning' : ''}`;
                    fd.id = `frame-${f.id}`;
                    fd.innerHTML = `
                        <div class="frame-node">${f.nodeVal}</div>
                        <div class="frame-var"><span class="lbl">temp</span><span class="val ${f.temp !== '?' ? 'hl-orange' : ''}">${f.temp}</span></div>
                        <div class="frame-var"><span class="lbl">root.left</span><span class="val">${f.lVal}</span></div>
                        <div class="frame-var"><span class="lbl">root.right</span><span class="val">${f.rVal}</span></div>
                    `;
                    sv.appendChild(fd);
                });

                // Draw arrows if there's a recent push / pop
                if (step.arrowType && step.stack.length > 1) {
                    const svgArrows = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    svgArrows.setAttribute('class', 'stack-arrows');

                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');

                    if (step.arrowType === 'call') {
                        path.setAttribute('d', 'M 20 60 Q 5 40 20 20');
                        path.setAttribute('class', 'stack-arrow-path call');
                        path.setAttribute('marker-end', 'url(#arrowhead-call)');
                    } else if (step.arrowType === 'return') {
                        path.setAttribute('d', 'M 20 20 Q 5 40 20 60');
                        path.setAttribute('class', 'stack-arrow-path return');
                        path.setAttribute('marker-end', 'url(#arrowhead-return)');
                    }

                    svgArrows.innerHTML = `
                        <defs>
                            <marker id="arrowhead-call" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                                <polygon points="0 0, 6 3, 0 6" fill="var(--accent)" />
                            </marker>
                            <marker id="arrowhead-return" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                                <polygon points="0 0, 6 3, 0 6" fill="var(--pink)" />
                            </marker>
                        </defs>
                    `;
                    svgArrows.appendChild(path);
                    sv.appendChild(svgArrows);
                }
            }
            sc.appendChild(sv); wrap.appendChild(sc);

            // STEP DESCRIPTION
            const desc = document.createElement('div'); desc.className = 'viz-card';
            desc.innerHTML = `<div class="section-label">💡 Current Operation</div><div class="step-text">${step.desc}</div>`;
            wrap.appendChild(desc);

            panel.appendChild(wrap);
        }

        // PLAYBACK
        function nextStep() { if (currentStep < steps.length - 1) { currentStep++; renderStep(); } else stopPlay(); }
        function prevStep() { if (currentStep > 0) { currentStep--; renderStep(); } }
        function goToStart() { currentStep = 0; renderStep(); }
        function goToEnd() { currentStep = steps.length - 1; renderStep(); }
        function togglePlay() { isPlaying ? stopPlay() : startPlay(); }
        function startPlay() { if (!steps.length) return; isPlaying = true; document.getElementById('playPauseBtn').textContent = '⏸'; document.getElementById('playPauseBtn').classList.add('active'); const spd = Number.parseInt(document.getElementById('speedSlider').value); playInterval = setInterval(() => { if (currentStep < steps.length - 1) { currentStep++; renderStep(); } else { stopPlay(); } }, spd); }
        function stopPlay() { isPlaying = false; document.getElementById('playPauseBtn').textContent = '▶'; document.getElementById('playPauseBtn').classList.remove('active'); if (playInterval) { clearInterval(playInterval); playInterval = null; } }
        document.getElementById('speedSlider').addEventListener('input', () => { if (isPlaying) { stopPlay(); startPlay(); } });
        document.getElementById('inputArr').addEventListener('keydown', e => { if (e.key === 'Enter') runVisualization(); });

        renderCode();
    </script>
</body>
