<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Tree Level Order Traversal | BFS Queue</title>
    <meta name="description"
        content="Interactive dry-run visualization of the Binary Tree Level Order Traversal problem using BFS and Queue tracking.">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #ffffff;
            --bg2: #f8f9fc;
            --bg3: #f1f3f8;
            --card-bg: #ffffff;
            --code-bg: #fafbfe;
            --border: #e2e5ef;
            --text: #1a1d2e;
            --text-secondary: #4a5068;
            --text-dim: #8891a8;
            --accent: #4f46e5;
            --accent-light: #ede9fe;
            --accent2: #7c3aed;
            --emerald: #059669;
            --emerald-bg: #ecfdf5;
            --orange: #ea580c;
            --orange-bg: #fff7ed;
            --pink: #db2777;
            --cyan: #0891b2;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
            --highlight-line: rgba(79, 70, 229, 0.06);
            --radius: 14px;
            --radius-sm: 10px;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg2);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* HEADER & CONTROLS */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--bg2);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all .2s;
        }

        .back-btn:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        .header .badge {
            background: var(--accent);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .header h1 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
        }

        .header .tag {
            margin-left: auto;
            font-size: 12px;
            color: var(--accent);
            background: var(--accent-light);
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .controls-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 24px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group label {
            font-size: 12px;
            color: var(--text-dim);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .6px;
        }

        .input-group input[type="text"] {
            background: var(--bg2);
            border: 1.5px solid var(--border);
            color: var(--accent);
            padding: 8px 14px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            width: 320px;
            outline: none;
            transition: border-color .2s;
        }

        .input-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.08);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            border-radius: 8px;
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
        }

        .btn-run {
            background: var(--accent);
            color: #fff;
        }

        .btn-run:hover {
            background: var(--accent2);
            box-shadow: var(--shadow-md);
        }

        .playback {
            display: flex;
            align-items: center;
            gap: 2px;
            margin-left: 8px;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 3px;
        }

        .playback button {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 14px;
            cursor: pointer;
            border-radius: 6px;
            transition: all .15s;
        }

        .playback button:hover,
        .playback button.active {
            background: var(--accent-light);
            color: var(--accent);
        }

        .speed-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 6px;
        }

        .speed-group label {
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 500;
        }

        .speed-slider {
            -webkit-appearance: none;
            width: 72px;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            outline: none;
        }

        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(79, 70, 229, 0.3);
        }

        .step-info {
            margin-left: auto;
            font-size: 13px;
            color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
        }

        .step-info span {
            color: var(--accent);
            font-weight: 600;
        }

        /* MAIN LAYOUT */
        .main {
            display: grid;
            grid-template-columns: 460px 1fr;
            height: calc(100vh - 106px);
        }

        /* CODE PANEL */
        .code-panel {
            background: var(--code-bg);
            border-right: 1px solid var(--border);
            overflow-y: auto;
        }

        .code-panel::-webkit-scrollbar {
            width: 5px;
        }

        .code-panel::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .code-title {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: rgba(250, 251, 254, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-dim);
            font-weight: 600;
        }

        .code-title .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .dot-red {
            background: #ff5f56;
        }

        .dot-yellow {
            background: #ffbd2e;
        }

        .dot-green {
            background: #27c93f;
        }

        .code-lines {
            padding: 12px 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            line-height: 1.85;
        }

        .code-line {
            display: flex;
            padding: 0 16px 0 0;
            transition: background .2s;
            position: relative;
        }

        .code-line.active {
            background: var(--highlight-line);
            border-left: 3px solid var(--accent);
        }

        .code-line.active .line-num {
            color: var(--accent);
        }

        .line-num {
            display: inline-block;
            width: 42px;
            text-align: right;
            padding-right: 16px;
            color: #c8cdd8;
            user-select: none;
            flex-shrink: 0;
            font-size: 11px;
        }

        .line-content {
            white-space: pre;
            color: var(--text);
        }

        .kw {
            color: #8b5cf6;
            font-weight: 500;
        }

        .tp {
            color: #0891b2;
        }

        .fn {
            color: #2563eb;
        }

        .str {
            color: #059669;
        }

        .num {
            color: #ea580c;
        }

        .op {
            color: #64748b;
        }

        .br {
            color: #94a3b8;
        }

        .ret {
            color: #dc2626;
            font-weight: 500;
        }

        /* VIZ PANEL */
        .viz-panel {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 24px;
            gap: 20px;
            background: var(--bg2);
        }

        .viz-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px;
            box-shadow: var(--shadow-sm);
        }

        .section-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            gap: 14px;
            padding: 40px;
        }

        .welcome-icon {
            font-size: 56px;
            margin-bottom: 4px;
        }

        .welcome h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
        }

        .welcome p {
            color: var(--text-secondary);
            font-size: 14px;
            max-width: 380px;
            line-height: 1.6;
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: fadeSlideIn .3s ease forwards;
        }

        /* TREE VIZ */
        .tree-container {
            width: 100%;
            min-height: 280px;
            position: relative;
            display: flex;
            justify-content: center;
            padding-top: 20px;
        }

        .tree-node {
            position: absolute;
            width: 40px;
            height: 40px;
            background: white;
            border: 2px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            z-index: 2;
            transition: all 0.5s ease;
            transform: translate(-50%, -50%);
        }

        .tree-node.active {
            border-color: var(--accent);
            background: var(--accent-light);
            color: var(--accent);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
            transform: translate(-50%, -50%) scale(1.1);
        }

        .tree-node.queued {
            border-color: var(--orange);
            color: var(--orange);
            background: var(--orange-bg);
        }

        .tree-node.visited {
            border-color: var(--emerald);
            color: var(--emerald);
            background: var(--emerald-bg);
        }

        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: visible;
        }

        .tree-edge {
            stroke: var(--border);
            stroke-width: 2px;
            transition: stroke 0.3s, x1 0.5s ease, y1 0.5s ease, x2 0.5s ease, y2 0.5s ease;
        }

        .tree-edge.active {
            stroke: var(--accent);
            stroke-width: 3px;
        }

        /* QUEUE VISUALIZATION */
        .queue-container {
            display: flex;
            flex-direction: row;
            gap: 10px;
            padding: 12px;
            background: var(--bg2);
            border: 1px dashed var(--border);
            border-radius: 10px;
            min-height: 60px;
            align-items: center;
            overflow-x: auto;
        }

        .queue-container::-webkit-scrollbar {
            height: 5px;
        }

        .queue-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .queue-empty {
            font-size: 13px;
            color: var(--text-dim);
            text-align: center;
            width: 100%;
            font-style: italic;
        }

        .queue-item {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            height: 44px;
            background: var(--orange-bg);
            border: 1px solid var(--orange);
            color: var(--orange);
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            border-radius: 8px;
            padding: 0 10px;
            transition: all 0.3s;
        }

        .queue-item.active-item {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15);
        }

        .queue-label {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-dim);
            margin-right: 12px;
        }

        /* RESULT LIST VISUALIZATION */
        .result-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
        }

        .result-level {
            display: flex;
            gap: 6px;
            background: var(--code-bg);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 8px;
        }

        .result-level-index {
            color: var(--text-dim);
            margin-right: 10px;
        }

        .result-val {
            background: var(--emerald-bg);
            color: var(--emerald);
            border-radius: 4px;
            padding: 2px 8px;
            font-weight: 600;
        }

        .result-curr-al {
            display: flex;
            gap: 6px;
            padding: 8px 12px;
            border: 1px dashed var(--accent);
            background: var(--accent-light);
            border-radius: 8px;
            min-height: 40px;
            align-items: center;
        }

        .result-curr-al::before {
            content: "al: ";
            color: var(--accent);
            font-weight: 600;
        }

        .step-text {
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-secondary);
        }

        .step-text .hl-accent {
            color: var(--accent);
            font-weight: 600;
        }

        .step-text .hl-emerald {
            color: var(--emerald);
            font-weight: 600;
        }

        .step-text .hl-orange {
            color: var(--orange);
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="header">
        <a href="../../index.html" class="back-btn">← Home</a>
        <span class="badge">Level Order Traversal</span>
        <h1>Binary Tree Level Order Traversal</h1>
        <span class="tag">Tree / BFS</span>
    </div>

    <div class="controls-bar">
        <div class="input-group">
            <label for="inputArr">Input (Level Order)</label>
            <input type="text" id="inputArr" value="3,9,20,null,null,15,7" placeholder="e.g. 3,9,20,null,null,15,7">
        </div>
        <button class="btn btn-run" onclick="runVisualization()">▶ Run</button>
        <div class="playback">
            <button onclick="goToStart()" title="First step">⏮</button>
            <button onclick="prevStep()" title="Previous">◀</button>
            <button id="playPauseBtn" onclick="togglePlay()" title="Play / Pause">▶</button>
            <button onclick="nextStep()" title="Next">▶</button>
            <button onclick="goToEnd()" title="Last step">⏭</button>
        </div>
        <div class="speed-group">
            <label for="speedSlider">Speed</label>
            <input type="range" class="speed-slider" id="speedSlider" min="200" max="2500" value="1000" step="100">
        </div>
        <div class="step-info">Step <span id="stepCurrent">0</span> / <span id="stepTotal">0</span></div>
    </div>

    <div class="main">
        <div class="code-panel">
            <div class="code-title"><span class="dot dot-red"></span><span class="dot dot-yellow"></span><span
                    class="dot dot-green"></span>Solution.java</div>
            <div class="code-lines" id="codeLines"></div>
        </div>
        <div class="viz-panel" id="vizPanel">
            <div class="welcome" id="welcomeState">
                <div class="welcome-icon">🌲</div>
                <h2>BFS Visualizer</h2>
                <p>Enter a comma-separated level-order array and click <strong>Run</strong> to watch the BFS traversal
                    updating the Queue and ArrayLists.</p>
            </div>
        </div>
    </div>

    <script>
        const CODE_LINES = [
            { tokens: [{ t: 'kw', v: 'class' }, { t: 'tp', v: ' Solution' }, { t: 'br', v: ' {' }] },
            { tokens: [{ t: 'kw', v: '    public' }, { t: 'tp', v: ' ArrayList&lt;ArrayList&lt;Integer&gt;&gt;' }, { t: 'fn', v: ' levelOrder' }, { t: 'br', v: '(' }, { t: 'tp', v: 'Node' }, { t: '', v: ' root' }, { t: 'br', v: ') {' }] },
            { tokens: [{ t: 'tp', v: '        Queue&lt;Node&gt;' }, { t: '', v: ' q ' }, { t: 'op', v: '=' }, { t: 'kw', v: ' new' }, { t: 'tp', v: ' LinkedList&lt;&gt;' }, { t: 'br', v: '();' }] },
            { tokens: [{ t: '', v: '        q' }, { t: 'op', v: '.' }, { t: 'fn', v: 'add' }, { t: 'br', v: '(' }, { t: '', v: 'root' }, { t: 'br', v: ');' }] },
            { tokens: [{ t: 'tp', v: '        ArrayList&lt;ArrayList&lt;Integer&gt;&gt;' }, { t: '', v: ' tl ' }, { t: 'op', v: '=' }, { t: 'kw', v: ' new' }, { t: 'tp', v: ' ArrayList&lt;&gt;' }, { t: 'br', v: '();' }] },
            { tokens: [{ t: 'kw', v: '        while' }, { t: 'br', v: '(' }, { t: 'op', v: '!' }, { t: '', v: 'q' }, { t: 'op', v: '.' }, { t: 'fn', v: 'isEmpty' }, { t: 'br', v: '()) {' }] },
            { tokens: [{ t: 'tp', v: '            int' }, { t: '', v: ' size ' }, { t: 'op', v: '=' }, { t: '', v: ' q' }, { t: 'op', v: '.' }, { t: 'fn', v: 'size' }, { t: 'br', v: '();' }] },
            { tokens: [{ t: 'tp', v: '            ArrayList&lt;Integer&gt;' }, { t: '', v: ' al ' }, { t: 'op', v: '=' }, { t: 'kw', v: ' new' }, { t: 'tp', v: ' ArrayList&lt;&gt;' }, { t: 'br', v: '();' }] },
            { tokens: [{ t: 'kw', v: '            for' }, { t: 'br', v: '(' }, { t: 'tp', v: 'int' }, { t: '', v: ' i' }, { t: 'op', v: '=' }, { t: 'num', v: '0' }, { t: 'op', v: ';' }, { t: '', v: 'i' }, { t: 'op', v: '&lt;' }, { t: '', v: 'size' }, { t: 'op', v: ';' }, { t: '', v: 'i' }, { t: 'op', v: '++' }, { t: 'br', v: '){' }] },
            { tokens: [{ t: 'tp', v: '               Node' }, { t: '', v: ' curr ' }, { t: 'op', v: '=' }, { t: '', v: ' q' }, { t: 'op', v: '.' }, { t: 'fn', v: 'poll' }, { t: 'br', v: '();' }] },
            { tokens: [{ t: '', v: '               al' }, { t: 'op', v: '.' }, { t: 'fn', v: 'add' }, { t: 'br', v: '(' }, { t: '', v: 'curr.data' }, { t: 'br', v: ');' }] },
            { tokens: [{ t: 'kw', v: '               if' }, { t: 'br', v: '(' }, { t: '', v: 'curr.left' }, { t: 'op', v: '!=' }, { t: 'kw', v: 'null' }, { t: 'br', v: ')' }, { t: '', v: ' q' }, { t: 'op', v: '.' }, { t: 'fn', v: 'add' }, { t: 'br', v: '(' }, { t: '', v: 'curr.left' }, { t: 'br', v: ');' }] },
            { tokens: [{ t: 'kw', v: '               if' }, { t: 'br', v: '(' }, { t: '', v: 'curr.right' }, { t: 'op', v: '!=' }, { t: 'kw', v: 'null' }, { t: 'br', v: ')' }, { t: '', v: ' q' }, { t: 'op', v: '.' }, { t: 'fn', v: 'add' }, { t: 'br', v: '(' }, { t: '', v: 'curr.right' }, { t: 'br', v: ');' }] },
            { tokens: [{ t: 'br', v: '            }' }] },
            { tokens: [{ t: '', v: '            tl' }, { t: 'op', v: '.' }, { t: 'fn', v: 'add' }, { t: 'br', v: '(' }, { t: '', v: 'al' }, { t: 'br', v: ');' }] },
            { tokens: [{ t: 'br', v: '        }' }] },
            { tokens: [{ t: 'ret', v: '        return' }, { t: '', v: ' tl' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'br', v: '    }' }] },
            { tokens: [{ t: 'br', v: '}' }] }
        ];

        function renderCode() {
            const c = document.getElementById('codeLines'); c.innerHTML = '';
            CODE_LINES.forEach((line, i) => {
                const div = document.createElement('div'); div.className = 'code-line'; div.id = `cl-${i}`;
                const num = document.createElement('span'); num.className = 'line-num'; num.textContent = i + 1; div.appendChild(num);
                const content = document.createElement('span'); content.className = 'line-content';
                content.innerHTML = line.tokens.length ? line.tokens.map(t => t.t ? `<span class="${t.t}">${t.v}</span>` : t.v).join('') : '&nbsp;';
                div.appendChild(content); c.appendChild(div);
            });
        }
        function highlightLine(idx) {
            document.querySelectorAll('.code-line.active').forEach(e => e.classList.remove('active'));
            if (idx !== null && idx >= 0) { const el = document.getElementById(`cl-${idx}`); if (el) { el.classList.add('active'); el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } }
        }

        function clone(obj) { return typeof structuredClone === 'function' ? structuredClone(obj) : JSON.parse(JSON.stringify(obj)); }

        // --- Tree Parsing and Graph Data Structure ---
        function buildTree(arr) {
            if (!arr.length || arr[0] === 'null' || arr[0] === '') return null;
            const root = { id: 0, val: Number.parseInt(arr[0]), left: null, right: null };
            const queue = [root];
            let i = 1; let idC = 1;
            while (i < arr.length && queue.length) {
                const curr = queue.shift();
                if (i < arr.length && arr[i] !== "null" && arr[i] !== null && arr[i] !== undefined && arr[i].trim() !== '') {
                    curr.left = { id: idC++, val: Number.parseInt(arr[i]), left: null, right: null };
                    queue.push(curr.left);
                } i++;
                if (i < arr.length && arr[i] !== "null" && arr[i] !== null && arr[i] !== undefined && arr[i].trim() !== '') {
                    curr.right = { id: idC++, val: Number.parseInt(arr[i]), left: null, right: null };
                    queue.push(curr.right);
                } i++;
            }
            return root;
        }

        function extractTreeState(root) {
            const nodes = [];
            const edges = [];

            function traverseAndPosition(node, left, right, y, depth) {
                if (!node) return;
                const x = (left + right) / 2;
                nodes.push({ id: node.id, val: node.val, x, y, depth });

                if (node.left) {
                    edges.push({ source: node.id, target: node.left.id, type: 'left' });
                    traverseAndPosition(node.left, left, x, y + 60, depth + 1);
                }
                if (node.right) {
                    edges.push({ source: node.id, target: node.right.id, type: 'right' });
                    traverseAndPosition(node.right, x, right, y + 60, depth + 1);
                }
            }

            traverseAndPosition(root, 0, 600, 30, 0); // 600 default width
            return { nodes, edges };
        }

        function generateTrace(initialRoot) {
            const steps = [];
            const treeVisualState = extractTreeState(initialRoot);

            if (!initialRoot) {
                steps.push({
                    codeLine: 1,
                    desc: `Null tree, execution stops.`,
                    queue: [],
                    tl: [],
                    al: null,
                    activeNode: -1,
                    treeVisualState,
                    visited: []
                });
                return steps;
            }

            let q = [];
            let tl = [];
            let al = null;
            let visited = [];
            let queued = [];

            steps.push({
                codeLine: 2,
                desc: `Initialize <span class="hl-orange">Queue q = new LinkedList&lt;&gt;()</span>`,
                queue: clone(q),
                tl: clone(tl),
                al: clone(al),
                activeNode: -1,
                treeVisualState,
                visited: clone(visited),
                queued: clone(queued)
            });

            q.push(initialRoot);
            queued.push(initialRoot.id);
            steps.push({
                codeLine: 3,
                desc: `Add root to queue: <span class="hl-orange">q.add(${initialRoot.val})</span>`,
                queue: clone(q),
                tl: clone(tl),
                al: clone(al),
                activeNode: -1,
                treeVisualState,
                visited: clone(visited),
                queued: clone(queued)
            });

            steps.push({
                codeLine: 4,
                desc: `Initialize <span class="hl-emerald">ArrayList&lt;ArrayList&lt;Integer&gt;&gt; tl = new ArrayList&lt;&gt;()</span>`,
                queue: clone(q),
                tl: clone(tl),
                al: clone(al),
                activeNode: -1,
                treeVisualState,
                visited: clone(visited),
                queued: clone(queued)
            });

            while (q.length > 0) {
                steps.push({
                    codeLine: 5,
                    desc: `Check <span class="hl-orange">!q.isEmpty()</span> (Queue size is ${q.length})`,
                    queue: clone(q),
                    tl: clone(tl),
                    al: clone(al),
                    activeNode: -1,
                    treeVisualState,
                    visited: clone(visited),
                    queued: clone(queued)
                });

                const size = q.length;
                steps.push({
                    codeLine: 6,
                    desc: `Get current level size: <span class="hl-accent">int size = q.size()</span> = ${size}`,
                    queue: clone(q),
                    tl: clone(tl),
                    al: clone(al),
                    activeNode: -1,
                    treeVisualState,
                    visited: clone(visited),
                    queued: clone(queued)
                });

                al = [];
                steps.push({
                    codeLine: 7,
                    desc: `Initialize current level list: <span class="hl-accent">ArrayList&lt;Integer&gt; al = new ArrayList&lt;&gt;()</span>`,
                    queue: clone(q),
                    tl: clone(tl),
                    al: clone(al),
                    activeNode: -1,
                    treeVisualState,
                    visited: clone(visited),
                    queued: clone(queued)
                });

                steps.push({
                    codeLine: 8,
                    desc: `Loop through <span class="hl-accent">size (${size})</span> elements in the queue for this level.`,
                    queue: clone(q),
                    tl: clone(tl),
                    al: clone(al),
                    activeNode: -1,
                    treeVisualState,
                    visited: clone(visited),
                    queued: clone(queued)
                });

                for (let i = 0; i < size; i++) {
                    const curr = q.shift();
                    visited.push(curr.id);
                    // remove from queued array since it's popped, but visited takes precedence in rendering
                    queued = queued.filter(id => id !== curr.id);

                    steps.push({
                        codeLine: 9,
                        desc: `Poll from queue: <span class="hl-orange">Node curr = q.poll()</span> (curr is Node ${curr.val})`,
                        queue: clone(q),
                        tl: clone(tl),
                        al: clone(al),
                        activeNode: curr.id,
                        activeInQueue: curr.val,
                        treeVisualState,
                        visited: clone(visited),
                        queued: clone(queued)
                    });

                    al.push(curr.val);
                    steps.push({
                        codeLine: 10,
                        desc: `Add node data to level list: <span class="hl-accent">al.add(${curr.val})</span>`,
                        queue: clone(q),
                        tl: clone(tl),
                        al: clone(al),
                        activeNode: curr.id,
                        treeVisualState,
                        visited: clone(visited),
                        queued: clone(queued)
                    });

                    if (curr.left !== null) {
                        q.push(curr.left);
                        queued.push(curr.left.id);
                        steps.push({
                            codeLine: 11,
                            desc: `curr.left is not null. <span class="hl-orange">q.add(${curr.left.val})</span>`,
                            queue: clone(q),
                            tl: clone(tl),
                            al: clone(al),
                            activeNode: curr.id,
                            treeVisualState,
                            visited: clone(visited),
                            queued: clone(queued)
                        });
                    }

                    if (curr.right !== null) {
                        q.push(curr.right);
                        queued.push(curr.right.id);
                        steps.push({
                            codeLine: 12,
                            desc: `curr.right is not null. <span class="hl-orange">q.add(${curr.right.val})</span>`,
                            queue: clone(q),
                            tl: clone(tl),
                            al: clone(al),
                            activeNode: curr.id,
                            treeVisualState,
                            visited: clone(visited),
                            queued: clone(queued)
                        });
                    }
                }

                tl.push(al);
                const al_copy = clone(al);
                al = null; // Clear al visually to move it inside tl
                steps.push({
                    codeLine: 14,
                    desc: `Level complete. <span class="hl-emerald">tl.add(al)</span> (Added [${al_copy.join(', ')}] to main list)`,
                    queue: clone(q),
                    tl: clone(tl),
                    al: null,
                    activeNode: -1,
                    treeVisualState,
                    visited: clone(visited),
                    queued: clone(queued)
                });
            }

            steps.push({
                codeLine: 5,
                desc: `Check <span class="hl-orange">!q.isEmpty()</span> (Queue size is 0). While loop ends.`,
                queue: clone(q),
                tl: clone(tl),
                al: clone(al),
                activeNode: -1,
                treeVisualState,
                visited: clone(visited),
                queued: clone(queued)
            });

            steps.push({
                codeLine: 16,
                desc: `<span class="hl-emerald">return tl;</span>`,
                queue: clone(q),
                tl: clone(tl),
                al: clone(al),
                activeNode: -1,
                treeVisualState,
                visited: clone(visited),
                queued: clone(queued)
            });

            steps.push({
                codeLine: null,
                desc: `Execution complete. Level order traversal results in <span class="hl-emerald">${JSON.stringify(tl)}</span>.`,
                queue: clone(q),
                tl: clone(tl),
                al: clone(al),
                activeNode: -1,
                treeVisualState,
                visited: clone(visited),
                queued: clone(queued)
            });

            return steps;
        }

        let steps = [], currentStep = 0, isPlaying = false, playInterval = null;

        function runVisualization() {
            const v = document.getElementById('inputArr').value.trim();
            const arr = v.split(',').map(s => s.trim());
            const root = buildTree(arr);
            steps = generateTrace(root);
            currentStep = 0; stopPlay();
            document.getElementById('welcomeState').style.display = 'none';
            renderStep();
        }

        function renderStep() {
            if (!steps.length) return;
            const step = steps[currentStep];
            document.getElementById('stepCurrent').textContent = currentStep + 1; document.getElementById('stepTotal').textContent = steps.length;
            highlightLine(step.codeLine);

            const panel = document.getElementById('vizPanel');
            panel.querySelectorAll('.viz-content').forEach(e => e.remove());
            const wrap = document.createElement('div'); wrap.className = 'viz-content animate-in';

            // TREE VISUALIZATION
            const tc = document.createElement('div'); tc.className = 'viz-card';
            tc.innerHTML = '<div class="section-label">🌲 Binary Tree Structure</div>';
            const tv = document.createElement('div'); tv.className = 'tree-container';

            const ts = step.treeVisualState;

            // Draw SVG EDges
            let svgHtml = '<svg>';
            if (ts && ts.edges) {
                ts.edges.forEach(e => {
                    const sourceNode = ts.nodes.find(n => n.id === e.source);
                    const targetNode = ts.nodes.find(n => n.id === e.target);
                    let extraClass = '';
                    if (step.activeNode === sourceNode.id || step.activeNode === targetNode.id) extraClass = 'active';

                    svgHtml += `<line x1="${sourceNode.x}" y1="${sourceNode.y}" x2="${targetNode.x}" y2="${targetNode.y}" class="tree-edge ${extraClass}" />`;
                });
            }
            svgHtml += '</svg>';
            tv.innerHTML += svgHtml;

            // Draw Nodes
            if (ts && ts.nodes) {
                ts.nodes.forEach(n => {
                    const isAct = step.activeNode === n.id;
                    const isVis = step.visited && step.visited.includes(n.id);
                    const isQueued = step.queued && step.queued.includes(n.id);
                    const nd = document.createElement('div');

                    let cls = `tree-node`;
                    if (isAct) cls += ` active`;
                    else if (isVis) cls += ` visited`;
                    else if (isQueued) cls += ` queued`;

                    nd.className = cls;
                    nd.style.left = `${n.x}px`; nd.style.top = `${n.y}px`;
                    nd.textContent = n.val;
                    tv.appendChild(nd);
                });
            }
            tc.appendChild(tv); wrap.appendChild(tc);

            // DATA STRUCTURES VISUALIZATION
            const dc = document.createElement('div'); dc.className = 'viz-card';
            dc.innerHTML = '<div class="section-label">📊 Data Structures</div>';

            // Queue
            const qContainer = document.createElement('div');
            qContainer.className = 'queue-container';
            const qLabel = document.createElement('div');
            qLabel.className = 'queue-label';
            qLabel.textContent = 'Queue q:';
            qContainer.appendChild(qLabel);

            if (!step.queue || step.queue.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'queue-empty';
                empty.textContent = 'Empty';
                qContainer.appendChild(empty);
            } else {
                step.queue.forEach(node => {
                    const qi = document.createElement('div');
                    qi.className = 'queue-item';
                    qi.textContent = node.val;
                    qContainer.appendChild(qi);
                });
            }
            // Temporarily show popped node slightly outside
            if (step.activeInQueue !== undefined) {
                const qi = document.createElement('div');
                qi.className = 'queue-item active-item';
                qi.textContent = step.activeInQueue;
                qi.style.marginLeft = '10px';
                qContainer.appendChild(qi);
            }
            dc.appendChild(qContainer);

            // Level List (al) & Total List (tl)
            const rl = document.createElement('div');
            rl.className = 'result-list';

            if (step.tl) {
                step.tl.forEach((arr, idx) => {
                    const lev = document.createElement('div');
                    lev.className = 'result-level';
                    lev.innerHTML = `<span class="result-level-index">Level ${idx}:</span>`;
                    arr.forEach(val => {
                        lev.innerHTML += `<span class="result-val">${val}</span>`;
                    });
                    rl.appendChild(lev);
                });
            }

            if (step.al !== null && step.al !== undefined) {
                const currAl = document.createElement('div');
                currAl.className = 'result-curr-al';
                if (step.al.length === 0) {
                    currAl.innerHTML = `<span style="color: var(--text-dim); font-size: 13px; font-style: italic;">empty</span>`;
                } else {
                    step.al.forEach(val => {
                        currAl.innerHTML += `<span class="result-val" style="background: var(--accent); color: white;">${val}</span>`;
                    });
                }
                rl.appendChild(currAl);
            }

            if (step.tl && step.tl.length > 0 || step.al !== null) {
                dc.appendChild(rl);
            }

            wrap.appendChild(dc);

            // STEP DESCRIPTION
            const desc = document.createElement('div'); desc.className = 'viz-card';
            desc.innerHTML = `<div class="section-label">💡 Current Operation</div><div class="step-text">${step.desc}</div>`;
            wrap.appendChild(desc);

            panel.appendChild(wrap);
        }

        // PLAYBACK
        function nextStep() { if (currentStep < steps.length - 1) { currentStep++; renderStep(); } else stopPlay(); }
        function prevStep() { if (currentStep > 0) { currentStep--; renderStep(); } }
        function goToStart() { currentStep = 0; renderStep(); }
        function goToEnd() { currentStep = steps.length - 1; renderStep(); }
        function togglePlay() { isPlaying ? stopPlay() : startPlay(); }
        function startPlay() { if (!steps.length) return; isPlaying = true; document.getElementById('playPauseBtn').textContent = '⏸'; document.getElementById('playPauseBtn').classList.add('active'); const spd = Number.parseInt(document.getElementById('speedSlider').value); playInterval = setInterval(() => { if (currentStep < steps.length - 1) { currentStep++; renderStep(); } else { stopPlay(); } }, spd); }
        function stopPlay() { isPlaying = false; document.getElementById('playPauseBtn').textContent = '▶'; document.getElementById('playPauseBtn').classList.remove('active'); if (playInterval) { clearInterval(playInterval); playInterval = null; } }
        document.getElementById('speedSlider').addEventListener('input', () => { if (isPlaying) { stopPlay(); startPlay(); } });
        document.getElementById('inputArr').addEventListener('keydown', e => { if (e.key === 'Enter') runVisualization(); });

        renderCode();
    </script>
</body>
