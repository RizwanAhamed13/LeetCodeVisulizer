<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Tree Level Order Traversal | BFS Queue</title>
    <meta name="description"
        content="Interactive dry-run visualization of the Binary Tree Level Order Traversal problem using BFS and Queue tracking.">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../core/engine.css">
    <style>
        /* TREE VIZ */
        .tree-container {
            width: 100%;
            min-height: 280px;
            position: relative;
            display: flex;
            justify-content: center;
            padding-top: 20px;
        }

        .tree-node {
            position: absolute;
            width: 40px;
            height: 40px;
            background: white;
            border: 2px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            z-index: 2;
            transition: all 0.5s ease;
            transform: translate(-50%, -50%);
        }

        .tree-node.active {
            border-color: var(--accent);
            background: var(--accent-light);
            color: var(--accent);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
            transform: translate(-50%, -50%) scale(1.1);
        }

        .tree-node.queued {
            border-color: var(--orange);
            color: var(--orange);
            background: var(--orange-bg);
        }

        .tree-node.visited {
            border-color: var(--emerald);
            color: var(--emerald);
            background: var(--emerald-bg);
        }

        .tree-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: visible;
        }

        .tree-edge {
            stroke: var(--border);
            stroke-width: 2px;
            transition: stroke 0.3s, x1 0.5s ease, y1 0.5s ease, x2 0.5s ease, y2 0.5s ease;
        }

        .tree-edge.active {
            stroke: var(--accent);
            stroke-width: 3px;
        }

        /* QUEUE VISUALIZATION */
        .queue-container {
            display: flex;
            flex-direction: row;
            gap: 10px;
            padding: 12px;
            background: var(--bg2);
            border: 1px dashed var(--border);
            border-radius: 10px;
            min-height: 60px;
            align-items: center;
            overflow-x: auto;
        }

        .queue-container::-webkit-scrollbar {
            height: 5px;
        }

        .queue-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .queue-empty {
            font-size: 13px;
            color: var(--text-dim);
            text-align: center;
            width: 100%;
            font-style: italic;
        }

        .queue-item {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            height: 44px;
            background: var(--orange-bg);
            border: 1px solid var(--orange);
            color: var(--orange);
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            border-radius: 8px;
            padding: 0 10px;
            transition: all 0.3s;
        }

        .queue-item.active-item {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15);
        }

        .queue-label {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-dim);
            margin-right: 12px;
        }

        /* RESULT LIST VISUALIZATION */
        .result-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
        }

        .result-level {
            display: flex;
            gap: 6px;
            background: var(--code-bg);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 8px;
        }

        .result-level-index {
            color: var(--text-dim);
            margin-right: 10px;
        }

        .result-val {
            background: var(--emerald-bg);
            color: var(--emerald);
            border-radius: 4px;
            padding: 2px 8px;
            font-weight: 600;
        }

        .result-curr-al {
            display: flex;
            gap: 6px;
            padding: 8px 12px;
            border: 1px dashed var(--accent);
            background: var(--accent-light);
            border-radius: 8px;
            min-height: 40px;
            align-items: center;
        }

        .result-curr-al::before {
            content: "al: ";
            color: var(--accent);
            font-weight: 600;
        }

        .step-text {
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-secondary);
        }

        .step-text .hl-accent {
            color: var(--accent);
            font-weight: 600;
        }

        .step-text .hl-emerald {
            color: var(--emerald);
            font-weight: 600;
        }

        .step-text .hl-orange {
            color: var(--orange);
            font-weight: 600;
        }
    </style>
</head>

<body>
    <script src="../../core/engine.js"></script>
    <script>
        const CODE_LINES = [
            { tokens: [{ t: 'kw', v: 'class' }, { t: 'tp', v: ' Solution' }, { t: 'br', v: ' {' }] },
            { tokens: [{ t: 'kw', v: '    public' }, { t: 'tp', v: ' ArrayList&lt;ArrayList&lt;Integer&gt;&gt;' }, { t: 'fn', v: ' levelOrder' }, { t: 'br', v: '(' }, { t: 'tp', v: 'Node' }, { t: '', v: ' root' }, { t: 'br', v: ') {' }] },
            { tokens: [{ t: 'tp', v: '        Queue&lt;Node&gt;' }, { t: '', v: ' q ' }, { t: 'op', v: '=' }, { t: 'kw', v: ' new' }, { t: 'tp', v: ' LinkedList&lt;&gt;' }, { t: 'br', v: '();' }] },
            { tokens: [{ t: '', v: '        q' }, { t: 'op', v: '.' }, { t: 'fn', v: 'add' }, { t: 'br', v: '(' }, { t: '', v: 'root' }, { t: 'br', v: ');' }] },
            { tokens: [{ t: 'tp', v: '        ArrayList&lt;ArrayList&lt;Integer&gt;&gt;' }, { t: '', v: ' tl ' }, { t: 'op', v: '=' }, { t: 'kw', v: ' new' }, { t: 'tp', v: ' ArrayList&lt;&gt;' }, { t: 'br', v: '();' }] },
            { tokens: [{ t: 'kw', v: '        while' }, { t: 'br', v: '(' }, { t: 'op', v: '!' }, { t: '', v: 'q' }, { t: 'op', v: '.' }, { t: 'fn', v: 'isEmpty' }, { t: 'br', v: '()) {' }] },
            { tokens: [{ t: 'tp', v: '            int' }, { t: '', v: ' size ' }, { t: 'op', v: '=' }, { t: '', v: ' q' }, { t: 'op', v: '.' }, { t: 'fn', v: 'size' }, { t: 'br', v: '();' }] },
            { tokens: [{ t: 'tp', v: '            ArrayList&lt;Integer&gt;' }, { t: '', v: ' al ' }, { t: 'op', v: '=' }, { t: 'kw', v: ' new' }, { t: 'tp', v: ' ArrayList&lt;&gt;' }, { t: 'br', v: '();' }] },
            { tokens: [{ t: 'kw', v: '            for' }, { t: 'br', v: '(' }, { t: 'tp', v: 'int' }, { t: '', v: ' i' }, { t: 'op', v: '=' }, { t: 'num', v: '0' }, { t: 'op', v: ';' }, { t: '', v: 'i' }, { t: 'op', v: '&lt;' }, { t: '', v: 'size' }, { t: 'op', v: ';' }, { t: '', v: 'i' }, { t: 'op', v: '++' }, { t: 'br', v: '){' }] },
            { tokens: [{ t: 'tp', v: '               Node' }, { t: '', v: ' curr ' }, { t: 'op', v: '=' }, { t: '', v: ' q' }, { t: 'op', v: '.' }, { t: 'fn', v: 'poll' }, { t: 'br', v: '();' }] },
            { tokens: [{ t: '', v: '               al' }, { t: 'op', v: '.' }, { t: 'fn', v: 'add' }, { t: 'br', v: '(' }, { t: '', v: 'curr.data' }, { t: 'br', v: ');' }] },
            { tokens: [{ t: 'kw', v: '               if' }, { t: 'br', v: '(' }, { t: '', v: 'curr.left' }, { t: 'op', v: '!=' }, { t: 'kw', v: 'null' }, { t: 'br', v: ')' }, { t: '', v: ' q' }, { t: 'op', v: '.' }, { t: 'fn', v: 'add' }, { t: 'br', v: '(' }, { t: '', v: 'curr.left' }, { t: 'br', v: ');' }] },
            { tokens: [{ t: 'kw', v: '               if' }, { t: 'br', v: '(' }, { t: '', v: 'curr.right' }, { t: 'op', v: '!=' }, { t: 'kw', v: 'null' }, { t: 'br', v: ')' }, { t: '', v: ' q' }, { t: 'op', v: '.' }, { t: 'fn', v: 'add' }, { t: 'br', v: '(' }, { t: '', v: 'curr.right' }, { t: 'br', v: ');' }] },
            { tokens: [{ t: 'br', v: '            }' }] },
            { tokens: [{ t: '', v: '            tl' }, { t: 'op', v: '.' }, { t: 'fn', v: 'add' }, { t: 'br', v: '(' }, { t: '', v: 'al' }, { t: 'br', v: ');' }] },
            { tokens: [{ t: 'br', v: '        }' }] },
            { tokens: [{ t: 'ret', v: '        return' }, { t: '', v: ' tl' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'br', v: '    }' }] },
            { tokens: [{ t: 'br', v: '}' }] }
        ];

        function clone(obj) { return typeof structuredClone === 'function' ? structuredClone(obj) : JSON.parse(JSON.stringify(obj)); }

        // --- Tree Parsing and Graph Data Structure ---
        function buildTree(arr) {
            if (!arr.length || arr[0] === 'null' || arr[0] === '') return null;
            const root = { id: 0, val: Number.parseInt(arr[0]), left: null, right: null };
            const queue = [root];
            let i = 1; let idC = 1;
            while (i < arr.length && queue.length) {
                const curr = queue.shift();
                if (i < arr.length && arr[i] !== "null" && arr[i] !== null && arr[i] !== undefined && arr[i].trim() !== '') {
                    curr.left = { id: idC++, val: Number.parseInt(arr[i]), left: null, right: null };
                    queue.push(curr.left);
                } i++;
                if (i < arr.length && arr[i] !== "null" && arr[i] !== null && arr[i] !== undefined && arr[i].trim() !== '') {
                    curr.right = { id: idC++, val: Number.parseInt(arr[i]), left: null, right: null };
                    queue.push(curr.right);
                } i++;
            }
            return root;
        }

        function extractTreeState(root) {
            const nodes = [];
            const edges = [];

            function traverseAndPosition(node, left, right, y, depth) {
                if (!node) return;
                const x = (left + right) / 2;
                nodes.push({ id: node.id, val: node.val, x, y, depth });

                if (node.left) {
                    edges.push({ source: node.id, target: node.left.id, type: 'left' });
                    traverseAndPosition(node.left, left, x, y + 60, depth + 1);
                }
                if (node.right) {
                    edges.push({ source: node.id, target: node.right.id, type: 'right' });
                    traverseAndPosition(node.right, x, right, y + 60, depth + 1);
                }
            }

            traverseAndPosition(root, 0, 600, 30, 0); // 600 default width
            return { nodes, edges };
        }

        function generateTrace(initialRoot) {
            const steps = [];
            const treeVisualState = extractTreeState(initialRoot);

            if (!initialRoot) {
                steps.push({
                    codeLine: 1,
                    desc: `Null tree, execution stops.`,
                    queue: [],
                    tl: [],
                    al: null,
                    activeNode: -1,
                    treeVisualState,
                    visited: []
                });
                return steps;
            }

            let q = [];
            let tl = [];
            let al = null;
            let visited = [];
            let queued = [];

            steps.push({ codeLine: 2, desc: `Initialize <span class="hl-orange">Queue q = new LinkedList&lt;&gt;()</span>`, queue: clone(q), tl: clone(tl), al: clone(al), activeNode: -1, treeVisualState, visited: clone(visited), queued: clone(queued) });

            q.push(initialRoot);
            queued.push(initialRoot.id);
            steps.push({ codeLine: 3, desc: `Add root to queue: <span class="hl-orange">q.add(${initialRoot.val})</span>`, queue: clone(q), tl: clone(tl), al: clone(al), activeNode: -1, treeVisualState, visited: clone(visited), queued: clone(queued) });

            steps.push({ codeLine: 4, desc: `Initialize <span class="hl-emerald">ArrayList&lt;ArrayList&lt;Integer&gt;&gt; tl = new ArrayList&lt;&gt;()</span>`, queue: clone(q), tl: clone(tl), al: clone(al), activeNode: -1, treeVisualState, visited: clone(visited), queued: clone(queued) });

            while (q.length > 0) {
                steps.push({ codeLine: 5, desc: `Check <span class="hl-orange">!q.isEmpty()</span> (Queue size is ${q.length})`, queue: clone(q), tl: clone(tl), al: clone(al), activeNode: -1, treeVisualState, visited: clone(visited), queued: clone(queued) });

                const size = q.length;
                steps.push({ codeLine: 6, desc: `Get current level size: <span class="hl-accent">int size = q.size()</span> = ${size}`, queue: clone(q), tl: clone(tl), al: clone(al), activeNode: -1, treeVisualState, visited: clone(visited), queued: clone(queued) });

                al = [];
                steps.push({ codeLine: 7, desc: `Initialize current level list: <span class="hl-accent">ArrayList&lt;Integer&gt; al = new ArrayList&lt;&gt;()</span>`, queue: clone(q), tl: clone(tl), al: clone(al), activeNode: -1, treeVisualState, visited: clone(visited), queued: clone(queued) });

                steps.push({ codeLine: 8, desc: `Loop through <span class="hl-accent">size (${size})</span> elements in the queue for this level.`, queue: clone(q), tl: clone(tl), al: clone(al), activeNode: -1, treeVisualState, visited: clone(visited), queued: clone(queued) });

                for (let i = 0; i < size; i++) {
                    const curr = q.shift();
                    visited.push(curr.id);
                    queued = queued.filter(id => id !== curr.id);

                    steps.push({ codeLine: 9, desc: `Poll from queue: <span class="hl-orange">Node curr = q.poll()</span> (curr is Node ${curr.val})`, queue: clone(q), tl: clone(tl), al: clone(al), activeNode: curr.id, activeInQueue: curr.val, treeVisualState, visited: clone(visited), queued: clone(queued) });

                    al.push(curr.val);
                    steps.push({ codeLine: 10, desc: `Add node data to level list: <span class="hl-accent">al.add(${curr.val})</span>`, queue: clone(q), tl: clone(tl), al: clone(al), activeNode: curr.id, treeVisualState, visited: clone(visited), queued: clone(queued) });

                    if (curr.left !== null) {
                        q.push(curr.left);
                        queued.push(curr.left.id);
                        steps.push({ codeLine: 11, desc: `curr.left is not null. <span class="hl-orange">q.add(${curr.left.val})</span>`, queue: clone(q), tl: clone(tl), al: clone(al), activeNode: curr.id, treeVisualState, visited: clone(visited), queued: clone(queued) });
                    }

                    if (curr.right !== null) {
                        q.push(curr.right);
                        queued.push(curr.right.id);
                        steps.push({ codeLine: 12, desc: `curr.right is not null. <span class="hl-orange">q.add(${curr.right.val})</span>`, queue: clone(q), tl: clone(tl), al: clone(al), activeNode: curr.id, treeVisualState, visited: clone(visited), queued: clone(queued) });
                    }
                }

                tl.push(al);
                const al_copy = clone(al);
                al = null;
                steps.push({ codeLine: 14, desc: `Level complete. <span class="hl-emerald">tl.add(al)</span> (Added [${al_copy.join(', ')}] to main list)`, queue: clone(q), tl: clone(tl), al: null, activeNode: -1, treeVisualState, visited: clone(visited), queued: clone(queued) });
            }

            steps.push({ codeLine: 5, desc: `Check <span class="hl-orange">!q.isEmpty()</span> (Queue size is 0). While loop ends.`, queue: clone(q), tl: clone(tl), al: clone(al), activeNode: -1, treeVisualState, visited: clone(visited), queued: clone(queued) });

            steps.push({ codeLine: 16, desc: `<span class="hl-emerald">return tl;</span>`, queue: clone(q), tl: clone(tl), al: clone(al), activeNode: -1, treeVisualState, visited: clone(visited), queued: clone(queued) });

            steps.push({ codeLine: null, desc: `Execution complete. Level order traversal results in <span class="hl-emerald">${JSON.stringify(tl)}</span>.`, queue: clone(q), tl: clone(tl), al: clone(al), activeNode: -1, treeVisualState, visited: clone(visited), queued: clone(queued) });

            return steps;
        }

        const engine = new VizEngine({
            title: "Binary Tree Level Order Traversal",
            badge: "Level Order Traversal",
            tag: "Tree / BFS",
            codeLines: CODE_LINES,
            inputs: [
                { id: "inputArr", label: "Input (Level Order)", default: "3,9,20,null,null,15,7", width: "220px" }
            ],
            onRun: () => {
                const v = document.getElementById('inputArr').value.trim();
                const arr = v.split(',').map(s => s.trim());
                if (!arr || arr.length === 0 || arr[0] === "") return [];
                const root = buildTree(arr);
                return generateTrace(root);
            },
            onRenderStep: (step, container, eng) => {
                // TREE VISUALIZATION
                const ts = step.treeVisualState;
                let treeHtml = `<div class="tree-container">`;
                let svgHtml = '<svg class="tree-svg" xmlns="http://www.w3.org/2000/svg">';

                if (ts && ts.edges) {
                    ts.edges.forEach(e => {
                        const sourceNode = ts.nodes.find(n => n.id === e.source);
                        const targetNode = ts.nodes.find(n => n.id === e.target);
                        let extraClass = '';
                        if (step.activeNode === sourceNode.id || step.activeNode === targetNode.id) extraClass = 'active';

                        svgHtml += `<line x1="${sourceNode.x}" y1="${sourceNode.y}" x2="${targetNode.x}" y2="${targetNode.y}" class="tree-edge ${extraClass}" />`;
                    });
                }
                svgHtml += '</svg>';
                treeHtml += svgHtml;

                if (ts && ts.nodes) {
                    ts.nodes.forEach(n => {
                        const isAct = step.activeNode === n.id;
                        const isVis = step.visited && step.visited.includes(n.id);
                        const isQueued = step.queued && step.queued.includes(n.id);
                        let cls = `tree-node`;
                        if (isAct) cls += ` active`;
                        else if (isVis) cls += ` visited`;
                        else if (isQueued) cls += ` queued`;

                        treeHtml += `<div class="${cls}" style="left:${n.x}px; top:${n.y}px;">${n.val}</div>`;
                    });
                }
                treeHtml += `</div>`;

                container.innerHTML += eng.createZoomableCard('tree_zoom', '🌲 Binary Tree Structure', treeHtml, '280px');

                // DATA STRUCTURES VISUALIZATION
                let dsHtml = ``;

                // Queue
                dsHtml += `<div class="queue-container">`;
                dsHtml += `<div class="queue-label">Queue q:</div>`;
                if (!step.queue || step.queue.length === 0) {
                    dsHtml += `<div class="queue-empty">Empty</div>`;
                } else {
                    step.queue.forEach(node => {
                        dsHtml += `<div class="queue-item">${node.val}</div>`;
                    });
                }
                if (step.activeInQueue !== undefined) {
                    dsHtml += `<div class="queue-item active-item" style="margin-left: 10px;">${step.activeInQueue}</div>`;
                }
                dsHtml += `</div>`;

                // Result List (al) & Total List (tl)
                let rlHtml = `<div class="result-list">`;
                if (step.tl) {
                    step.tl.forEach((arr, idx) => {
                        rlHtml += `<div class="result-level"><span class="result-level-index">Level ${idx}:</span>`;
                        arr.forEach(val => {
                            rlHtml += `<span class="result-val">${val}</span>`;
                        });
                        rlHtml += `</div>`;
                    });
                }
                if (step.al !== null && step.al !== undefined) {
                    rlHtml += `<div class="result-curr-al">`;
                    if (step.al.length === 0) {
                        rlHtml += `<span style="color: var(--text-dim); font-size: 13px; font-style: italic;">empty</span>`;
                    } else {
                        step.al.forEach(val => {
                            rlHtml += `<span class="result-val" style="background: var(--accent); color: white;">${val}</span>`;
                        });
                    }
                    rlHtml += `</div>`;
                }
                rlHtml += `</div>`;

                if ((step.tl && step.tl.length > 0) || step.al !== null) {
                    dsHtml += rlHtml;
                }

                container.innerHTML += eng.createSimpleCard('📊 Data Structures', dsHtml);
                container.innerHTML += eng.createSimpleCard('💡 Current Operation', `<div class="step-text">${step.desc}</div>`);
            }
        });

        engine.init();
    </script>
</body>

</html>
