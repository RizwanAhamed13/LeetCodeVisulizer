<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combination Sum | DFS Backtracking</title>
    <meta name="description"
        content="Interactive dry-run visualization of the Combination Sum problem using DFS backtracking and stack frames.">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../core/engine.css">
    <style>
        /* RESULTS DP STATE */
        .dp-state {
            background: var(--emerald-bg);
            border: 1px solid var(--emerald);
            color: var(--emerald);
            padding: 10px 16px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .dp-state span.label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--emerald);
            opacity: 0.8;
            font-family: 'Inter', sans-serif;
            margin-right: 12px;
        }

        /* TREE VIZ */
        .tree-container {
            width: 100%;
            min-height: 280px;
            position: relative;
            display: flex;
            justify-content: center;
            padding-top: 20px;
            overflow: visible;
        }

        .tree-wrapper {
            position: relative;
            min-width: 600px;
            min-height: 300px;
        }

        .tree-node {
            position: absolute;
            padding: 6px 8px;
            background: white;
            border: 2px solid var(--border);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            color: var(--text);
            z-index: 2;
            transition: all 0.5s ease;
            transform: translate(-50%, -50%);
            white-space: nowrap;
        }

        .tree-node .node-remain {
            font-size: 10px;
            color: var(--orange);
            font-family: 'Inter', sans-serif;
            margin-top: 2px;
        }

        .tree-node.active {
            border-color: var(--accent);
            background: var(--accent-light);
            color: var(--accent);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
            transform: translate(-50%, -50%) scale(1.05);
        }

        .tree-node.visited {
            border-color: var(--emerald);
            color: var(--emerald);
            background: var(--emerald-bg);
        }

        .tree-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: visible;
        }

        .tree-edge {
            stroke: var(--border);
            stroke-width: 2px;
            transition: stroke 0.3s;
        }

        .tree-edge.active {
            stroke: var(--accent);
            stroke-width: 3px;
        }

        /* STACK FRAMES */
        .stack-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            padding-left: 10px;
        }

        .stack-frame {
            display: grid;
            grid-template-columns: 80px 1fr 1fr 1fr;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg2);
            border: 1px dashed var(--border);
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            transition: all 0.3s;
        }

        .stack-frame.active {
            background: var(--accent-light);
            border: 1px solid var(--accent);
            color: var(--accent);
            box-shadow: var(--shadow-sm);
            transform: translateX(5px);
        }

        .stack-frame.returning {
            background: var(--pink-bg);
            border: 1px solid var(--pink);
            transform: translateX(-5px);
        }

        .stack-arrows {
            position: absolute;
            top: 0;
            left: -20px;
            width: 30px;
            height: 100%;
            pointer-events: none;
            overflow: visible;
        }

        .stack-arrow-path {
            fill: none;
            stroke-width: 2px;
            stroke-dasharray: 4;
            animation: dashDraw 0.4s linear forwards;
        }

        .stack-arrow-path.call {
            stroke: var(--accent);
        }

        .stack-arrow-path.return {
            stroke: var(--pink);
        }

        @keyframes dashDraw {
            from {
                stroke-dashoffset: 20;
            }

            to {
                stroke-dashoffset: 0;
            }
        }

        .frame-node {
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .frame-node::before {
            content: "Call";
            font-size: 9px;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        .frame-var {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .frame-var span.lbl {
            font-size: 9px;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .frame-var span.val {
            font-weight: 600;
            color: var(--text);
        }

        .active .frame-var span.val {
            color: var(--accent);
        }

        .active .frame-var span.lbl {
            color: rgba(79, 70, 229, 0.6);
        }

        .step-text {
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-secondary);
        }

        .step-text .hl-accent {
            color: var(--accent);
            font-weight: 600;
        }

        .step-text .hl-emerald {
            color: var(--emerald);
            font-weight: 600;
        }

        .step-text .hl-orange {
            color: var(--orange);
            font-weight: 600;
        }

        .step-text .hl-pink {
            color: var(--pink);
            font-weight: 600;
        }

        @media screen and (max-width: 800px) {
            .stack-frame {
                grid-template-columns: 60px 1fr 1fr;
            }

            .frame-var:last-child {
                display: none;
            }
        }
    </style>
</head>

<body>
    <script src="../../core/engine.js"></script>
    <script>
        const CODE_LINES = [
            { tokens: [{ t: 'kw', v: 'class' }, { t: 'tp', v: ' Solution' }, { t: 'br', v: ' {' }] },
            { tokens: [{ t: 'kw', v: '    public ' }, { t: 'tp', v: 'List&lt;List&lt;Integer&gt;&gt;' }, { t: 'fn', v: ' combinationSum' }, { t: 'br', v: '(' }, { t: 'tp', v: 'int' }, { t: 'br', v: '[]' }, { t: '', v: ' candidates, ' }, { t: 'tp', v: 'int' }, { t: '', v: ' target' }, { t: 'br', v: ') {' }] },
            { tokens: [{ t: 'tp', v: '        List&lt;List&lt;Integer&gt;&gt;' }, { t: '', v: ' result ' }, { t: 'op', v: '=' }, { t: 'kw', v: ' new ' }, { t: 'tp', v: 'ArrayList' }, { t: 'br', v: '&lt;&gt;();' }] },
            { tokens: [{ t: 'fn', v: '        backtrack' }, { t: 'br', v: '(' }, { t: '', v: 'result, ' }, { t: 'kw', v: 'new ' }, { t: 'tp', v: 'ArrayList' }, { t: 'br', v: '&lt;&gt;(), ' }, { t: '', v: 'candidates, target, ' }, { t: 'num', v: '0' }, { t: 'br', v: ');' }] },
            { tokens: [{ t: 'ret', v: '        return' }, { t: '', v: ' result;' }] },
            { tokens: [{ t: 'br', v: '    }' }] },
            { tokens: [{ t: '', v: '' }] },
            { tokens: [{ t: 'kw', v: '    private void' }, { t: 'fn', v: ' backtrack' }, { t: 'br', v: '(' }, { t: 'tp', v: 'List&lt;List&lt;Integer&gt;&gt;' }, { t: '', v: ' res, ' }, { t: 'tp', v: 'List&lt;Integer&gt;' }, { t: '', v: ' temp, ' }, { t: 'tp', v: 'int' }, { t: 'br', v: '[]' }, { t: '', v: ' cands, ' }, { t: 'tp', v: 'int' }, { t: '', v: ' remain, ' }, { t: 'tp', v: 'int' }, { t: '', v: ' start' }, { t: 'br', v: ') {' }] },
            { tokens: [{ t: 'kw', v: '        if ' }, { t: 'br', v: '(' }, { t: '', v: 'remain ' }, { t: 'op', v: '< ' }, { t: 'num', v: '0' }, { t: 'br', v: ')' }, { t: 'ret', v: ' return' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'kw', v: '        else if ' }, { t: 'br', v: '(' }, { t: '', v: 'remain ' }, { t: 'op', v: '== ' }, { t: 'num', v: '0' }, { t: 'br', v: ') {' }, { t: '', v: ' res.' }, { t: 'fn', v: 'add' }, { t: 'br', v: '(' }, { t: 'kw', v: 'new ' }, { t: 'tp', v: 'ArrayList' }, { t: 'br', v: '&lt;&gt;(' }, { t: '', v: 'temp' }, { t: 'br', v: ')); }' }] },
            { tokens: [{ t: 'kw', v: '        else {' }] },
            { tokens: [{ t: 'kw', v: '            for ' }, { t: 'br', v: '(' }, { t: 'tp', v: 'int' }, { t: '', v: ' i ' }, { t: 'op', v: '= ' }, { t: '', v: 'start; i ' }, { t: 'op', v: '< ' }, { t: '', v: 'cands.length; i' }, { t: 'op', v: '++' }, { t: 'br', v: ') {' }] },
            { tokens: [{ t: '', v: '                temp.' }, { t: 'fn', v: 'add' }, { t: 'br', v: '(' }, { t: '', v: 'cands' }, { t: 'br', v: '[' }, { t: '', v: 'i' }, { t: 'br', v: ']' }, { t: 'br', v: ');' }] },
            { tokens: [{ t: 'fn', v: '                backtrack' }, { t: 'br', v: '(' }, { t: '', v: 'res, temp, cands, remain ' }, { t: 'op', v: '- ' }, { t: '', v: 'cands' }, { t: 'br', v: '[' }, { t: '', v: 'i' }, { t: 'br', v: '], i' }, { t: 'br', v: ');' }] },
            { tokens: [{ t: '', v: '                temp.' }, { t: 'fn', v: 'remove' }, { t: 'br', v: '(' }, { t: '', v: 'temp.' }, { t: 'fn', v: 'size' }, { t: 'br', v: '()' }, { t: 'op', v: ' - ' }, { t: 'num', v: '1' }, { t: 'br', v: ');' }] },
            { tokens: [{ t: 'br', v: '            }' }] },
            { tokens: [{ t: 'br', v: '        }' }] },
            { tokens: [{ t: 'br', v: '    }' }] },
            { tokens: [{ t: 'br', v: '}' }] }
        ];

        function clone(obj) { return typeof structuredClone === 'function' ? structuredClone(obj) : JSON.parse(JSON.stringify(obj)); }

        // --- Tree Building & Layout before Simulation ---
        function buildAndLayoutTree(candidates, target) {
            const nodes = [];
            const edges = [];
            let idCounter = 1;

            // Gather all nodes and relations
            function build(parent, tempList, remain, start, valUsed) {
                const myId = idCounter++;
                const myNode = { id: myId, tempList: [...tempList], remain, start, valUsed, children: [] };

                if (parent) {
                    parent.children.push(myNode);
                    edges.push({ source: parent.id, target: myId });
                }
                nodes.push(myNode);

                if (remain < 0 || remain === 0) return myNode;

                for (let i = start; i < candidates.length; i++) {
                    const c = candidates[i];
                    tempList.push(c);
                    const childNode = build(myNode, tempList, remain - c, i, c);
                    childNode.i_value_used = i;
                    tempList.pop();
                }
                return myNode;
            }

            const root = build(null, [], target, 0, null);

            // Calculate widths dynamically for tree layout
            let nextX = 50;
            const X_SPACING = 90;
            const Y_SPACING = 70;

            function layout(node, depth) {
                if (!node.children || node.children.length === 0) {
                    node.x = nextX;
                    nextX += X_SPACING;
                } else {
                    let sumX = 0;
                    for (const child of node.children) {
                        layout(child, depth + 1);
                        sumX += child.x;
                    }
                    node.x = sumX / node.children.length;
                }
                node.y = depth * Y_SPACING + 40;
            }

            layout(root, 0);

            let maxWidth = nextX;
            return { root, nodes, edges, maxWidth };
        }

        function generateTrace(candidates, target) {
            const steps = [];
            const { root, nodes, edges, maxWidth } = buildAndLayoutTree(candidates, target);
            const treeVisualState = { nodes, edges, maxWidth };

            let callStack = [];
            let nextFrameId = 1;
            const visitedIds = new Set();
            let resultList = [];

            // Initial step
            steps.push({
                codeLine: 3,
                desc: `Call <span class="hl-accent">combinationSum([${candidates}], ${target})</span>`,
                activeNode: root.id,
                stack: [],
                visited: [],
                treeVisualState,
                resultList: clone(resultList)
            });

            function dfs(treeNode) {
                const frameId = nextFrameId++;
                visitedIds.add(treeNode.id);

                const tListStr = `[${treeNode.tempList.join(',')}]`;
                const frameState = { id: frameId, nodeId: treeNode.id, start: treeNode.start, remain: treeNode.remain, tempList: tListStr, isReturning: false, isComplete: false };
                callStack.push(frameState);

                // Add call visual
                steps.push({ codeLine: 7, desc: `Call <span class="hl-accent">backtrack(..., temp=${tListStr}, remain=${treeNode.remain}, start=${treeNode.start})</span>`, activeNode: treeNode.id, stack: clone(callStack), visited: Array.from(visitedIds), arrowType: 'call', treeVisualState, resultList: clone(resultList) });

                if (treeNode.remain < 0) {
                    steps.push({ codeLine: 8, desc: `remain (${treeNode.remain}) &lt; 0. Invalid path, <span class="hl-pink">Return</span> (Backtrack).`, activeNode: treeNode.id, stack: clone(callStack), visited: Array.from(visitedIds), treeVisualState, resultList: clone(resultList) });

                    frameState.isReturning = true;
                    frameState.isComplete = true;
                    steps.push({ codeLine: 8, desc: `<span class="hl-pink">Return</span> from backtrack.`, activeNode: treeNode.id, stack: clone(callStack), visited: Array.from(visitedIds), treeVisualState, arrowType: 'return', resultList: clone(resultList) });
                    callStack.pop();
                    return;
                }

                if (treeNode.remain === 0) {
                    resultList.push([...treeNode.tempList]);
                    steps.push({ codeLine: 9, desc: `remain == 0! Valid combination found. Add <span class="hl-emerald">${tListStr}</span> to result list.`, activeNode: treeNode.id, stack: clone(callStack), visited: Array.from(visitedIds), treeVisualState, resultList: clone(resultList) });

                    frameState.isReturning = true;
                    frameState.isComplete = true;
                    steps.push({ codeLine: 9, desc: `<span class="hl-pink">Return</span> from backtrack.`, activeNode: treeNode.id, stack: clone(callStack), visited: Array.from(visitedIds), treeVisualState, arrowType: 'return', resultList: clone(resultList) });
                    callStack.pop();
                    return;
                }

                // Loop branch
                steps.push({ codeLine: 11, desc: `For loop starting at i=${treeNode.start}. (Candidates: [${candidates}])`, activeNode: treeNode.id, stack: clone(callStack), visited: Array.from(visitedIds), treeVisualState, resultList: clone(resultList) });

                for (let idx = 0; idx < treeNode.children.length; idx++) {
                    const childNode = treeNode.children[idx];
                    const i = childNode.i_value_used;

                    steps.push({ codeLine: 12, desc: `i=${i}, candidates[i]=${candidates[i]}. temp.add(${candidates[i]})`, activeNode: treeNode.id, stack: clone(callStack), visited: Array.from(visitedIds), treeVisualState, resultList: clone(resultList) });

                    // Recursive call
                    dfs(childNode);

                    // Backtrack
                    steps.push({ codeLine: 14, desc: `Backtracking: temp.remove(${candidates[i]}) to restore state for next loop iteration.`, activeNode: treeNode.id, stack: clone(callStack), visited: Array.from(visitedIds), treeVisualState, resultList: clone(resultList) });
                }

                frameState.isReturning = true;
                frameState.isComplete = true;

                steps.push({ codeLine: 17, desc: `End of loop. <span class="hl-pink">Return</span> to caller.`, activeNode: treeNode.id, stack: clone(callStack), visited: Array.from(visitedIds), arrowType: 'return', treeVisualState, resultList: clone(resultList) });

                callStack.pop();
            }

            dfs(root);

            steps.push({ codeLine: 4, desc: `Execution complete. All combinations explored.`, activeNode: -1, stack: [], visited: Array.from(visitedIds), treeVisualState, resultList: clone(resultList) });

            return steps;
        }

        const engine = new VizEngine({
            title: "Combination Sum",
            badge: "Backtracking",
            tag: "Array / Backtracking",
            codeLines: CODE_LINES,
            inputs: [
                { id: "inputArr", label: "Candidates", default: "2,3,6,7", width: "120px" },
                { id: "inputTarget", label: "Target", default: "7", width: "60px" }
            ],
            onRun: () => {
                const cdStr = document.getElementById('inputArr').value.trim();
                const trStr = document.getElementById('inputTarget').value.trim();

                const cands = cdStr.split(',').map(s => Number.parseInt(s.trim())).filter(n => !isNaN(n));
                const target = Number.parseInt(trStr);

                if (!cands.length || isNaN(target)) {
                    alert("Please enter valid comma-separated integers for candidates and a valid target.");
                    return [];
                }

                return generateTrace(cands, target);
            },
            onRenderStep: (step, container, eng) => {
                // DP / RESULT STATE TRACKER
                if (step.resultList !== undefined) {
                    const formattedRes = step.resultList.length === 0 ? "[]" : "[ " + step.resultList.map(a => `[${a.join(',')}]`).join(', ') + " ]";
                    container.innerHTML += `<div class="dp-state"><span class="label">Result Combinations List</span><span>${formattedRes}</span></div>`;
                }

                // TREE VISUALIZATION
                const ts = step.treeVisualState;
                let treeHtml = `<div class="tree-container">`;

                let twWidth = ts && ts.maxWidth ? Math.max(600, ts.maxWidth + 100) : 600;
                let twHtml = `<div class="tree-wrapper" style="min-width: ${twWidth}px;">`;

                let svgHtml = '<svg class="tree-svg">';
                if (ts && ts.edges) {
                    ts.edges.forEach(e => {
                        const sourceNode = ts.nodes.find(n => n.id === e.source);
                        const targetNode = ts.nodes.find(n => n.id === e.target);
                        let extraClass = '';
                        if (step.activeNode === sourceNode.id || step.activeNode === targetNode.id) extraClass = 'active';

                        svgHtml += `<line x1="${sourceNode.x}" y1="${sourceNode.y}" x2="${targetNode.x}" y2="${targetNode.y}" class="tree-edge ${extraClass}" />`;
                    });
                }
                svgHtml += '</svg>';
                twHtml += svgHtml;

                if (ts && ts.nodes) {
                    ts.nodes.forEach(n => {
                        const isAct = step.activeNode === n.id;
                        const isVis = step.visited && step.visited.includes(n.id);

                        let cls = `tree-node`;
                        if (isAct) cls += ` active`;
                        else if (isVis) cls += ` visited`;

                        twHtml += `<div class="${cls}" style="left:${n.x}px; top:${n.y}px;">
                                      <span>[${n.tempList.join(',')}]</span>
                                      <span class="node-remain">rem: ${n.remain}</span>
                                   </div>`;
                    });
                }
                twHtml += `</div>`;
                treeHtml += twHtml + `</div>`;

                container.innerHTML += eng.createZoomableCard('tree_zoom', '🌲 Decision/Recursion Space', treeHtml, '280px');

                // STACK VISUALIZATION
                let stackHtml = `<div class="stack-container">`;
                if (!step.stack.length) {
                    stackHtml += '<div style="font-size: 13px; color: var(--text-dim); text-align: center; padding: 10px;">Stack is empty</div>';
                } else {
                    const reversedStack = [...step.stack].reverse();
                    reversedStack.forEach((f, idx) => {
                        const actCls = (idx === 0 && !f.isReturning) ? ' active' : '';
                        const retCls = f.isReturning ? ' returning' : '';
                        stackHtml += `
                            <div class="stack-frame${actCls}${retCls}" id="frame-${f.id}">
                                <div class="frame-node">#${f.id}</div>
                                <div class="frame-var"><span class="lbl" style="color: var(--pink);">start</span><span class="val hl-pink">${f.start}</span></div>
                                <div class="frame-var"><span class="lbl" style="color: var(--orange);">remain</span><span class="val hl-orange">${f.remain}</span></div>
                                <div class="frame-var"><span class="lbl">tempList</span><span class="val hl-accent">${f.tempList}</span></div>
                            </div>
                        `;
                    });

                    if (step.arrowType && step.stack.length > 0) {
                        stackHtml += `
                        <svg class="stack-arrows">
                            <defs>
                                <marker id="arrowhead-call" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                                    <polygon points="0 0, 6 3, 0 6" fill="var(--accent)" />
                                </marker>
                                <marker id="arrowhead-return" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                                    <polygon points="0 0, 6 3, 0 6" fill="var(--pink)" />
                                </marker>
                            </defs>`;
                        if (step.arrowType === 'call') {
                            stackHtml += `<path d="M 20 60 Q 5 40 20 20" class="stack-arrow-path call" marker-end="url(#arrowhead-call)" />`;
                        } else if (step.arrowType === 'return' && step.stack.length > 0) {
                            stackHtml += `<path d="M 20 20 Q 5 40 20 60" class="stack-arrow-path return" marker-end="url(#arrowhead-return)" />`;
                        }
                        stackHtml += `</svg>`;
                    }
                }
                stackHtml += `</div>`;

                container.innerHTML += eng.createSimpleCard('📚 DFS Call Stack', stackHtml);
                container.innerHTML += eng.createSimpleCard('💡 Current Operation', `<div class="step-text">${step.desc}</div>`);
            }
        });

        engine.init();
    </script>
</body>

</html>
