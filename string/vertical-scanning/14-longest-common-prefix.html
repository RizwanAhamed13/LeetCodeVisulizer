<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LC #14 — Longest Common Prefix | Vertical Scanning</title>
    <meta name="description"
        content="Interactive dry-run visualization of LeetCode #14 Longest Common Prefix using the Vertical Scanning technique.">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../core/engine.css">
    <style>
        /* ===== STRING GRID (Vertical Scanning) ===== */
        .grid-wrapper {
            display: flex;
            justify-content: center;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .string-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: fit-content;
        }

        .grid-header {
            display: flex;
            gap: 4px;
            padding-left: 80px;
        }

        .col-idx {
            width: 44px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
        }

        .col-idx.active-col {
            color: var(--accent);
            font-weight: 800;
        }

        .grid-row {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .row-label {
            width: 76px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 600;
            text-align: right;
            padding-right: 8px;
            flex-shrink: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .row-label.active-row {
            color: var(--accent);
            font-weight: 700;
        }

        .char-cell {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg2);
            border: 2px solid var(--border);
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
            transition: all .3s ease;
            position: relative;
        }

        .char-cell.scanning {
            border-color: var(--cyan);
            background: var(--cyan-bg);
            box-shadow: 0 0 0 3px rgba(8, 145, 178, 0.1);
        }

        .char-cell.matched {
            border-color: var(--emerald);
            background: var(--emerald-bg);
            color: var(--emerald);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
        }

        .char-cell.reference {
            border-color: var(--purple);
            background: var(--purple-bg);
            color: var(--purple);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        .char-cell.mismatch {
            border-color: var(--red);
            background: var(--red-bg);
            color: var(--red);
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }

        .char-cell.prefix {
            border-color: var(--accent);
            background: var(--accent-light);
            color: var(--accent);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .char-cell.length-exceeded {
            border-color: var(--orange);
            background: var(--orange-bg);
            color: var(--orange);
        }

        .char-cell.dim {
            opacity: 0.35;
        }

        /* ===== SCANNING ARROW ===== */
        .scan-direction {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            padding: 10px 0;
        }

        .scan-arrow {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .3px;
        }

        .scan-arrow.vertical {
            background: var(--cyan-bg);
            color: var(--cyan);
            border: 1px solid rgba(8, 145, 178, 0.2);
            transition: margin-left 0.3s ease;
        }

        .scan-arrow .arrow-icon {
            font-size: 16px;
        }

        /* Variables grid */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
        }

        .info-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
        }

        .info-card .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .8px;
            color: var(--text-dim);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .info-card .value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 700;
        }

        .info-card.cyan .value {
            color: var(--cyan);
        }

        .info-card.purple .value {
            color: var(--purple);
        }

        .info-card.orange .value {
            color: var(--orange);
        }

        .info-card.accent .value {
            color: var(--accent);
        }

        /* Result display */
        .result-prefix {
            font-family: 'JetBrains Mono', monospace;
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            padding: 16px;
            background: var(--accent-light);
            border-radius: var(--radius-sm);
            border: 1px solid rgba(79, 70, 229, 0.15);
            letter-spacing: 4px;
            color: var(--accent);
        }

        .result-prefix.empty {
            font-size: 16px;
            letter-spacing: 0;
            color: var(--text-dim);
        }

        .result-prefix .prefix-char.glow {
            text-shadow: 0 0 12px rgba(79, 70, 229, 0.4);
        }

        /* StringBuilder card */
        .sb-display {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
            min-height: 48px;
            padding: 10px;
            background: var(--bg2);
            border: 1.5px dashed var(--border);
            border-radius: var(--radius-sm);
        }

        .sb-char {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--accent-light);
            border: 2px solid var(--accent);
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            font-weight: 700;
            color: var(--accent);
            animation: popIn .3s ease forwards;
        }

        .sb-char.new {
            background: var(--emerald-bg);
            border-color: var(--emerald);
            color: var(--emerald);
        }

        .sb-empty {
            font-size: 13px;
            color: var(--text-dim);
            font-style: italic;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <script src="../../core/engine.js"></script>
    <script>
        function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

        const CODE_LINES = [
            { tokens: [{ t: 'kw', v: 'class' }, { t: 'tp', v: ' Solution' }, { t: 'br', v: ' {' }] },
            { tokens: [{ t: 'kw', v: '    public' }, { t: 'tp', v: ' String' }, { t: 'fn', v: ' longestCommonPrefix' }, { t: 'br', v: '(' }, { t: 'tp', v: 'String[]' }, { t: '', v: ' strs' }, { t: 'br', v: ') {' }] },
            { tokens: [{ t: 'tp', v: '        String' }, { t: '', v: ' index' }, { t: 'op', v: ' = ' }, { t: '', v: 'strs' }, { t: 'br', v: '[' }, { t: 'num', v: '0' }, { t: 'br', v: ']' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'tp', v: '        StringBuilder' }, { t: '', v: ' sb' }, { t: 'op', v: ' = ' }, { t: 'kw', v: 'new' }, { t: 'tp', v: ' StringBuilder' }, { t: 'br', v: '()' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'kw', v: '        for' }, { t: 'br', v: '(' }, { t: 'tp', v: 'int' }, { t: '', v: ' i' }, { t: 'op', v: '=' }, { t: 'num', v: '0' }, { t: 'op', v: ';' }, { t: '', v: 'i' }, { t: 'op', v: '<' }, { t: '', v: 'index.length()' }, { t: 'op', v: ';' }, { t: '', v: 'i++' }, { t: 'br', v: '){' }] },
            { tokens: [{ t: 'tp', v: '            char' }, { t: '', v: ' ch' }, { t: 'op', v: ' = ' }, { t: '', v: 'index.' }, { t: 'fn', v: 'charAt' }, { t: 'br', v: '(' }, { t: '', v: 'i' }, { t: 'br', v: ')' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'kw', v: '            for' }, { t: 'br', v: '(' }, { t: 'tp', v: 'String' }, { t: '', v: ' str' }, { t: 'op', v: ':' }, { t: '', v: 'strs' }, { t: 'br', v: '){' }] },
            { tokens: [{ t: 'kw', v: '                if' }, { t: 'br', v: '(' }, { t: '', v: 'i' }, { t: 'op', v: '>=' }, { t: '', v: 'str.length()' }, { t: 'op', v: '||' }, { t: '', v: 'str.' }, { t: 'fn', v: 'charAt' }, { t: 'br', v: '(' }, { t: '', v: 'i' }, { t: 'br', v: ')' }, { t: 'op', v: '!=' }, { t: '', v: 'ch' }, { t: 'br', v: ')' }] },
            { tokens: [{ t: 'ret', v: '                    return' }, { t: '', v: ' sb.' }, { t: 'fn', v: 'toString' }, { t: 'br', v: '()' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'br', v: '            }' }] },
            { tokens: [{ t: '', v: '            sb.' }, { t: 'fn', v: 'append' }, { t: 'br', v: '(' }, { t: '', v: 'ch' }, { t: 'br', v: ')' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'br', v: '        }' }] },
            { tokens: [{ t: 'tp', v: '        String' }, { t: '', v: ' ans' }, { t: 'op', v: ' = ' }, { t: '', v: 'sb.' }, { t: 'fn', v: 'toString' }, { t: 'br', v: '()' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'ret', v: '        return' }, { t: '', v: ' ans' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'br', v: '    }' }] },
            { tokens: [{ t: 'br', v: '}' }] },
        ].map(line => {
            if (line.tokens.length) line.tokens.forEach(t => t.v = esc(t.v));
            return line;
        });

        const engine = new VizEngine({
            title: "Longest Common Prefix",
            badge: "LC #14",
            tag: "Vertical Scanning",
            codeLines: CODE_LINES,
            inputs: [
                { id: "inputStr", label: "Input", default: "flower,flow,flight", width: "320px" }
            ],
            onRun: () => {
                const v = document.getElementById('inputStr').value.trim();
                const strs = v.split(',').map(s => s.trim()).filter(s => s.length > 0);
                if (!strs || strs.length === 0) { alert("Invalid inputs"); return []; }
                window.engineCache = { strs };
                return generateTrace(strs);
            },
            onRenderStep: (step, container, eng) => {
                const { strs } = window.engineCache;

                // 1. GRID 
                let gridHtml = `<div class="grid-wrapper"><div class="string-grid">`;
                const gridData = step.grid;

                // Header
                gridHtml += `<div class="grid-header">`;
                for (let c = 0; c < gridData.maxLen; c++) {
                    const activeCls = (c === gridData.activeCol) ? ' active-col' : '';
                    gridHtml += `<div class="col-idx${activeCls}">${c}</div>`;
                }
                gridHtml += `</div>`;

                // Arrow
                if (gridData.activeCol >= 0) {
                    gridHtml += `
                    <div class="scan-direction" style="padding-left: 80px;">
                        <div class="scan-arrow vertical" style="margin-left: ${gridData.activeCol * 48}px">
                            <span class="arrow-icon">↓</span> Column ${gridData.activeCol}
                        </div>
                    </div>`;
                }

                // Rows
                for (let r = 0; r < gridData.grid.length; r++) {
                    gridHtml += `<div class="grid-row">`;
                    const activeCls = (r === gridData.activeRow) ? ' active-row' : '';
                    gridHtml += `<div class="row-label${activeCls}" title="${strs[r]}">strs[${r}]</div>`;

                    for (let c = 0; c < gridData.maxLen; c++) {
                        const cellData = gridData.grid[r][c];
                        const cls = cellData.state !== 'default' ? ` ${cellData.state}` : '';
                        const chStr = cellData.ch || '·';
                        const stl = !cellData.ch ? ' style="color:var(--text-dim); font-size:12px;"' : '';
                        gridHtml += `<div class="char-cell${cls}"${stl}>${chStr}</div>`;
                    }
                    gridHtml += `</div>`;
                }
                gridHtml += `</div></div>`;

                container.innerHTML += eng.createZoomableCard('grid_container', '📐 Vertical Scanning Grid', gridHtml, '200px');

                // 2. STRINGBUILDER
                let sbHtml = '<div class="sb-display">';
                if (step.sbContent && step.sbContent.length > 0) {
                    step.sbContent.forEach((ch, idx) => {
                        const isNew = (step.newChar && idx === step.sbContent.length - 1) ? ' new' : '';
                        sbHtml += `<div class="sb-char${isNew}">${ch}</div>`;
                    });
                } else {
                    sbHtml += `<span class="sb-empty">empty</span>`;
                }
                sbHtml += '</div>';
                container.innerHTML += eng.createSimpleCard('🔤 StringBuilder (sb)', sbHtml);

                // 3. VARIABLES
                const v = step.vars || {};
                let varsHtml = `<div class="info-grid">`;
                const varConfigs = [
                    { k: 'i', l: 'i (column)', c: 'cyan' },
                    { k: 'ch', l: 'ch (ref char)', c: 'purple' },
                    { k: 'currentStr', l: 'Current String', c: 'orange' },
                    { k: 'sb', l: 'sb (prefix)', c: 'accent' },
                ];
                varConfigs.forEach(vc => {
                    const val = v[vc.k] !== undefined ? v[vc.k] : '-';
                    const displayVal = val === '' ? '""' : val;
                    const fsz = String(displayVal).length > 12 ? '13px' : '18px';
                    varsHtml += `<div class="info-card ${vc.c}"><div class="label">${vc.l}</div><div class="value" style="font-size:${fsz};">${esc(String(displayVal))}</div></div>`;
                });
                varsHtml += `</div>`;
                container.innerHTML += eng.createSimpleCard('📊 Variables', varsHtml);

                // 4. STEP DETAIL
                container.innerHTML += eng.createSimpleCard('💡 Step Detail', `<div class="step-text">${step.desc}</div>`);

                // 5. RESULT
                const prefixSoFar = step.finalResult !== undefined ? step.finalResult : (step.sbContent ? step.sbContent.join('') : '');
                let resHtml = '';
                if (prefixSoFar.length > 0) {
                    resHtml = `<div class="result-prefix">${prefixSoFar.split('').map(c => `<span class="prefix-char ${step.finalResult !== undefined ? 'glow' : ''}">${esc(c)}</span>`).join('')}</div>`;
                } else {
                    resHtml = `<div class="result-prefix empty">${step.finalResult !== undefined ? '(empty string — no common prefix)' : '(building…)'}</div>`;
                }
                const title = step.finalResult !== undefined ? '🏆 Final Result' : '🏆 Common Prefix So Far';
                container.innerHTML += eng.createSimpleCard(title, resHtml);
            }
        });

        // ===== TRACE GENERATION (Vertical Scanning) =====
        function generateTrace(strs) {
            const steps = [];
            const index = strs[0];
            const sb = [];

            steps.push({ codeLine: 2, desc: `Set <span class="hl-purple">index = strs[0] = "${esc(index)}"</span> — this is our reference string.`, vars: { i: '-', ch: '-', currentStr: '-', sb: '' }, grid: buildGrid(strs, -1, -1, [], null), sbContent: [] });
            steps.push({ codeLine: 3, desc: `Create an empty <span class="hl-cyan">StringBuilder sb</span> to build the common prefix.`, vars: { i: '-', ch: '-', currentStr: '-', sb: '' }, grid: buildGrid(strs, -1, -1, [], null), sbContent: [] });

            for (let i = 0; i < index.length; i++) {
                const ch = index.charAt(i);
                steps.push({ codeLine: 4, desc: `Outer loop: <span class="hl-cyan">i = ${i}</span>, scanning column ${i} vertically across all strings.`, vars: { i, ch: '-', currentStr: '-', sb: sb.join('') }, grid: buildGrid(strs, i, -1, sb, null), sbContent: [...sb] });
                steps.push({ codeLine: 5, desc: `Get reference character: <span class="hl-purple">ch = index.charAt(${i}) = '${esc(ch)}'</span>`, vars: { i, ch: ch, currentStr: `strs[0]="${esc(index)}"`, sb: sb.join('') }, grid: buildGrid(strs, i, 0, sb, { row: 0, col: i, state: 'reference' }), sbContent: [...sb] });

                let earlyReturn = false;
                for (let j = 0; j < strs.length; j++) {
                    const str = strs[j];
                    steps.push({ codeLine: 6, desc: `Inner loop: checking <span class="hl-cyan">str = strs[${j}] = "${esc(str)}"</span>`, vars: { i, ch: ch, currentStr: `strs[${j}]="${esc(str)}"`, sb: sb.join('') }, grid: buildGrid(strs, i, j, sb, { row: j, col: i, state: 'scanning' }), sbContent: [...sb] });

                    if (i >= str.length) {
                        steps.push({ codeLine: 7, desc: `<span class="hl-red">i = ${i} >= str.length() = ${str.length}</span> — string "${esc(str)}" is too short! Condition is true.`, vars: { i, ch: ch, currentStr: `strs[${j}]="${esc(str)}"`, sb: sb.join('') }, grid: buildGrid(strs, i, j, sb, { row: j, col: i, state: 'length-exceeded' }), sbContent: [...sb] });
                        steps.push({ codeLine: 8, desc: `<span class="hl-red">Return</span> sb.toString() = "<span class="hl-accent">${esc(sb.join(''))}</span>"`, vars: { i, ch: ch, currentStr: `strs[${j}]="${esc(str)}"`, sb: sb.join('') }, grid: buildGridFinal(strs, sb), sbContent: [...sb], finalResult: sb.join('') });
                        earlyReturn = true;
                        break;
                    } else if (str.charAt(i) !== ch) {
                        steps.push({ codeLine: 7, desc: `<span class="hl-red">str.charAt(${i}) = '${esc(str.charAt(i))}' != ch = '${esc(ch)}'</span> — mismatch! Condition is true.`, vars: { i, ch: ch, currentStr: `strs[${j}]="${esc(str)}"`, sb: sb.join('') }, grid: buildGrid(strs, i, j, sb, { row: j, col: i, state: 'mismatch' }), sbContent: [...sb] });
                        steps.push({ codeLine: 8, desc: `<span class="hl-red">Return</span> sb.toString() = "<span class="hl-accent">${esc(sb.join(''))}</span>"`, vars: { i, ch: ch, currentStr: `strs[${j}]="${esc(str)}"`, sb: sb.join('') }, grid: buildGridFinal(strs, sb), sbContent: [...sb], finalResult: sb.join('') });
                        earlyReturn = true;
                        break;
                    } else {
                        steps.push({ codeLine: 7, desc: `<span class="hl-emerald">str.charAt(${i}) = '${esc(str.charAt(i))}' == ch = '${esc(ch)}'</span> — match! ✓ Continue.`, vars: { i, ch: ch, currentStr: `strs[${j}]="${esc(str)}"`, sb: sb.join('') }, grid: buildGrid(strs, i, j, sb, { row: j, col: i, state: 'matched' }), sbContent: [...sb] });
                    }
                }

                if (earlyReturn) break;

                sb.push(ch);
                steps.push({ codeLine: 10, desc: `All strings match at column ${i}! <span class="hl-emerald">sb.append('${esc(ch)}')</span> → sb = "<span class="hl-accent">${esc(sb.join(''))}</span>"`, vars: { i, ch: ch, currentStr: '-', sb: sb.join('') }, grid: buildGrid(strs, i, -1, sb, null, true), sbContent: [...sb], newChar: ch });
            }

            if (!steps.length || steps[steps.length - 1].finalResult === undefined) {
                const ans = sb.join('');
                steps.push({ codeLine: 12, desc: `Loop complete. <span class="hl-cyan">ans = sb.toString() = "${esc(ans)}"</span>`, vars: { i: '-', ch: '-', currentStr: '-', sb: ans }, grid: buildGridFinal(strs, sb), sbContent: [...sb] });
                steps.push({ codeLine: 13, desc: `<span class="hl-accent">Return ans = "${esc(ans)}"</span>`, vars: { i: '-', ch: '-', currentStr: '-', sb: ans }, grid: buildGridFinal(strs, sb), sbContent: [...sb], finalResult: ans });
            }

            return steps;
        }

        function buildGrid(strs, activeCol, activeRow, prefix, highlight, allMatched = false) {
            const maxLen = Math.max(...strs.map(s => s.length));
            const grid = [];
            for (let r = 0; r < strs.length; r++) {
                const row = [];
                for (let c = 0; c < maxLen; c++) {
                    let state = 'default';
                    const ch = c < strs[r].length ? strs[r].charAt(c) : '';
                    if (c < prefix.length) state = 'prefix';
                    if (c === activeCol && state !== 'prefix') state = allMatched ? 'matched' : 'scanning';
                    if (highlight && highlight.row === r && highlight.col === c) state = highlight.state;
                    row.push({ ch, state });
                }
                grid.push(row);
            }
            return { grid, maxLen, activeCol, activeRow };
        }

        function buildGridFinal(strs, prefix) {
            const maxLen = Math.max(...strs.map(s => s.length));
            const grid = [];
            for (let r = 0; r < strs.length; r++) {
                const row = [];
                for (let c = 0; c < maxLen; c++) {
                    const ch = c < strs[r].length ? strs[r].charAt(c) : '';
                    const state = c < prefix.length ? 'prefix' : 'dim';
                    row.push({ ch, state });
                }
                grid.push(row);
            }
            return { grid, maxLen, activeCol: -1, activeRow: -1 };
        }

        engine.init();
    </script>
</body>

</html>
