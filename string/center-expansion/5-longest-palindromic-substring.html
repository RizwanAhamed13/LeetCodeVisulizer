<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LC #5 — Longest Palindromic Substring | Center Expansion</title>
    <meta name="description"
        content="Interactive dry-run visualization of LeetCode #5 Longest Palindromic Substring using the Center Expansion technique.">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../core/engine.css">
    <style>
        .string-container {
            padding: 10px;
            overflow-x: auto;
        }

        .index-row,
        .char-row {
            display: flex;
            gap: 4px;
            justify-content: center;
            flex-wrap: nowrap;
        }

        .index-row {
            margin-bottom: 4px;
        }

        .char-row {
            margin-bottom: 24px;
        }

        .index-cell {
            width: 44px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
            flex-shrink: 0;
        }

        .char-cell {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg2);
            border: 2px solid var(--border);
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
            transition: all .3s ease;
            position: relative;
            flex-shrink: 0;
        }

        .char-cell.pointer-i {
            border-color: var(--yellow);
            background: var(--yellow-bg);
            box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.1);
        }

        .char-cell.pointer-i::after {
            content: 'i';
            position: absolute;
            bottom: -20px;
            font-size: 10px;
            color: var(--yellow);
            font-weight: 700;
        }

        .char-cell.pointer-left {
            border-color: var(--emerald);
            background: var(--emerald-bg);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
        }

        .char-cell.pointer-left::after {
            content: 'L';
            position: absolute;
            top: -18px;
            font-size: 10px;
            color: var(--emerald);
            font-weight: 700;
        }

        .char-cell.pointer-right {
            border-color: var(--pink);
            background: var(--pink-bg);
            box-shadow: 0 0 0 3px rgba(219, 39, 119, 0.1);
        }

        .char-cell.pointer-right::after {
            content: 'R';
            position: absolute;
            top: -18px;
            font-size: 10px;
            color: var(--pink);
            font-weight: 700;
        }

        .char-cell.matched {
            background: var(--cyan-bg);
            border-color: var(--cyan);
            color: var(--cyan);
        }

        .char-cell.best-palindrome {
            background: var(--purple-bg);
            border-color: var(--purple);
            color: var(--purple);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        .char-cell.mismatch {
            border-color: var(--red);
            background: var(--red-bg);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
        }

        .info-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
        }

        .info-card .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .8px;
            color: var(--text-dim);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .info-card .value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 700;
        }

        .info-card.cyan .value {
            color: var(--cyan);
        }

        .info-card.purple .value {
            color: var(--purple);
        }

        .info-card.emerald .value {
            color: var(--emerald);
        }

        .info-card.orange .value {
            color: var(--orange);
        }

        .info-card.pink .value {
            color: var(--pink);
        }

        .info-card.yellow .value {
            color: var(--yellow);
        }

        .result-palindrome {
            font-family: 'JetBrains Mono', monospace;
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            padding: 16px;
            background: var(--purple-bg);
            border-radius: var(--radius-sm);
            border: 1px solid rgba(124, 58, 237, 0.15);
            letter-spacing: 4px;
            color: var(--purple);
        }

        .result-palindrome .pal-char.glow {
            color: var(--accent);
        }
    </style>
</head>

<body>
    <script src="../../core/engine.js"></script>
    <script>
        function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

        const CODE_LINES = [
            { tokens: [{ t: 'kw', v: 'class' }, { t: 'tp', v: ' Solution' }, { t: 'br', v: ' {' }] },
            { tokens: [{ t: 'kw', v: '    public' }, { t: 'tp', v: ' String' }, { t: 'fn', v: ' longestPalindrome' }, { t: 'br', v: '(' }, { t: 'tp', v: 'String' }, { t: '', v: ' s' }, { t: 'br', v: ') {' }] },
            { tokens: [{ t: 'kw', v: '        if' }, { t: 'br', v: ' (' }, { t: '', v: 's' }, { t: 'op', v: ' == ' }, { t: 'kw', v: 'null' }, { t: 'op', v: ' || ' }, { t: '', v: 's.length()' }, { t: 'op', v: ' < ' }, { t: 'num', v: '1' }, { t: 'br', v: ')' }, { t: 'ret', v: ' return' }, { t: 'str', v: ' ""' }, { t: 'op', v: ';' }] },
            { tokens: [] },
            { tokens: [{ t: 'tp', v: '        int' }, { t: '', v: ' start' }, { t: 'op', v: ' = ' }, { t: 'num', v: '0' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'tp', v: '        int' }, { t: '', v: ' end' }, { t: 'op', v: ' = ' }, { t: 'num', v: '0' }, { t: 'op', v: ';' }] },
            { tokens: [] },
            { tokens: [{ t: 'kw', v: '        for' }, { t: 'br', v: ' (' }, { t: 'tp', v: 'int' }, { t: '', v: ' i' }, { t: 'op', v: ' = ' }, { t: 'num', v: '0' }, { t: 'op', v: '; ' }, { t: '', v: 'i' }, { t: 'op', v: ' < ' }, { t: '', v: 's.length()' }, { t: 'op', v: '; ' }, { t: '', v: 'i++' }, { t: 'br', v: ') {' }] },
            { tokens: [] },
            { tokens: [{ t: 'tp', v: '            int' }, { t: '', v: ' len1' }, { t: 'op', v: ' = ' }, { t: 'fn', v: 'expandFromCenter' }, { t: 'br', v: '(' }, { t: '', v: 's, i, i' }, { t: 'br', v: ')' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'tp', v: '            int' }, { t: '', v: ' len2' }, { t: 'op', v: ' = ' }, { t: 'fn', v: 'expandFromCenter' }, { t: 'br', v: '(' }, { t: '', v: 's, i, i + 1' }, { t: 'br', v: ')' }, { t: 'op', v: ';' }] },
            { tokens: [] },
            { tokens: [{ t: 'tp', v: '            int' }, { t: '', v: ' len' }, { t: 'op', v: ' = ' }, { t: 'fn', v: 'Math.max' }, { t: 'br', v: '(' }, { t: '', v: 'len1, len2' }, { t: 'br', v: ')' }, { t: 'op', v: ';' }] },
            { tokens: [] },
            { tokens: [{ t: 'kw', v: '            if' }, { t: 'br', v: ' (' }, { t: '', v: 'len' }, { t: 'op', v: ' > ' }, { t: '', v: 'end - start' }, { t: 'br', v: ') {' }] },
            { tokens: [{ t: '', v: '                start' }, { t: 'op', v: ' = ' }, { t: '', v: 'i - (len - 1) / 2' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: '', v: '                end' }, { t: 'op', v: ' = ' }, { t: '', v: 'i + len / 2' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'br', v: '            }' }] },
            { tokens: [{ t: 'br', v: '        }' }] },
            { tokens: [] },
            { tokens: [{ t: 'ret', v: '        return' }, { t: '', v: ' s.substring' }, { t: 'br', v: '(' }, { t: '', v: 'start, end + 1' }, { t: 'br', v: ')' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'br', v: '    }' }] },
            { tokens: [] },
            { tokens: [{ t: 'kw', v: '    private' }, { t: 'tp', v: ' int' }, { t: 'fn', v: ' expandFromCenter' }, { t: 'br', v: '(' }, { t: 'tp', v: 'String' }, { t: '', v: ' s, ' }, { t: 'tp', v: 'int' }, { t: '', v: ' left, ' }, { t: 'tp', v: 'int' }, { t: '', v: ' right' }, { t: 'br', v: ') {' }] },
            { tokens: [] },
            { tokens: [{ t: 'kw', v: '        while' }, { t: 'br', v: ' (' }, { t: '', v: 'left' }, { t: 'op', v: ' >= ' }, { t: 'num', v: '0' }, { t: 'op', v: ' &&' }] },
            { tokens: [{ t: '', v: '               right' }, { t: 'op', v: ' < ' }, { t: '', v: 's.length()' }, { t: 'op', v: ' &&' }] },
            { tokens: [{ t: '', v: '               s.charAt(left)' }, { t: 'op', v: ' == ' }, { t: '', v: 's.charAt(right)' }, { t: 'br', v: ') {' }] },
            { tokens: [] },
            { tokens: [{ t: '', v: '            left' }, { t: 'op', v: '--' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: '', v: '            right' }, { t: 'op', v: '++' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'br', v: '        }' }] },
            { tokens: [] },
            { tokens: [{ t: 'ret', v: '        return' }, { t: '', v: ' right - left - 1' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'br', v: '    }' }] },
            { tokens: [{ t: 'br', v: '}' }] },
        ].map(line => {
            if (line.tokens.length) line.tokens.forEach(t => t.v = esc(t.v));
            return line;
        });

        const engine = new VizEngine({
            title: "Longest Palindromic Substring",
            badge: "LC #5",
            tag: "Center Expansion",
            codeLines: CODE_LINES,
            inputs: [
                { id: "inputStr", label: "Input", default: "babad", width: "220px" }
            ],
            onRun: () => {
                const s = document.getElementById('inputStr').value.trim();
                if (!s) return [];
                window.engineCache = { s };
                return generateTrace(s);
            },
            onRenderStep: (step, container, eng) => {
                const s = window.engineCache.s;

                // String render
                let strHtml = '<div class="string-container"><div class="index-row">';
                for (let i = 0; i < s.length; i++) {
                    strHtml += `<div class="index-cell">${i}</div>`;
                }
                strHtml += '</div><div class="char-row">';
                const cs = step.charStates || [];
                for (let i = 0; i < s.length; i++) {
                    let cls = "char-cell";
                    if (cs[i] && cs[i] !== 'default') cls += ` ${cs[i]}`;
                    if (step.pointerI === i && !cls.includes('pointer-left') && !cls.includes('pointer-right') && !cls.includes('best-palindrome')) {
                        cls += " pointer-i";
                    }
                    strHtml += `<div class="${cls}">${s[i]}</div>`;
                }
                strHtml += '</div></div>';

                container.innerHTML += eng.createZoomableCard('str_container', '📝 String (Zoomable)', strHtml, '140px');

                // Variables
                const v = step.vars || {};
                let varsHtml = `<div class="info-grid">`;
                const varConfigs = [
                    { k: 'i', l: 'i (center)', c: 'yellow' },
                    { k: 'left', l: 'left', c: 'emerald' },
                    { k: 'right', l: 'right', c: 'pink' },
                    { k: 'len1', l: 'len1 (odd)', c: 'cyan' },
                    { k: 'len2', l: 'len2 (even)', c: 'cyan' },
                    { k: 'len', l: 'len (max)', c: 'purple' },
                    { k: 'start', l: 'start', c: 'orange' },
                    { k: 'end', l: 'end', c: 'orange' }
                ];
                varConfigs.forEach(vc => {
                    const val = v[vc.k] !== undefined ? v[vc.k] : '-';
                    varsHtml += `<div class="info-card ${vc.c}"><div class="label">${vc.l}</div><div class="value">${val}</div></div>`;
                });
                varsHtml += `</div>`;
                container.innerHTML += eng.createSimpleCard('📊 Variables', varsHtml);

                container.innerHTML += eng.createSimpleCard('💡 Step Detail', `<div class="step-text">${step.desc}</div>`);

                const bs = step.bestStart !== undefined ? step.bestStart : 0;
                const be = step.bestEnd !== undefined ? step.bestEnd : 0;
                const bp = step.finalResult || s.substring(bs, be + 1);

                const title = step.finalResult ? '🏆 Final Result' : '🏆 Best Palindrome So Far';
                const chars = bp.split('').map(c => `<span class="pal-char ${step.finalResult ? 'glow' : ''}">${esc(c)}</span>`).join('');
                container.innerHTML += eng.createSimpleCard(title, `<div class="result-palindrome">${chars}</div>`);
            }
        });

        function generateTrace(s) {
            const steps = [];
            if (!s || s.length < 1) { steps.push({ codeLine: 2, desc: 'Empty input — return ""', vars: {}, charStates: [] }); return steps; }
            let start = 0, end = 0;
            steps.push({ codeLine: 4, desc: 'Initialize <span class="hl-cyan">start = 0</span>, <span class="hl-cyan">end = 0</span>', vars: { start: 0, end: 0, i: '-', left: '-', right: '-', len1: '-', len2: '-', len: '-' }, charStates: new Array(s.length).fill('default'), bestStart: 0, bestEnd: 0 });

            for (let i = 0; i < s.length; i++) {
                const cs = new Array(s.length).fill('default'); cs[i] = 'pointer-i';
                steps.push({ codeLine: 7, desc: `Outer loop: <span class="hl-cyan">i = ${i}</span>, center at '<span class="hl-purple">${s[i]}</span>'`, vars: { start, end, i, left: '-', right: '-', len1: '-', len2: '-', len: '-' }, charStates: cs, pointerI: i, bestStart: start, bestEnd: end });

                const odd = traceExpand(s, i, i);
                odd.steps.forEach(st => { st.vars.start = start; st.vars.end = end; st.vars.i = i; st.bestStart = start; st.bestEnd = end; steps.push(st); });
                const len1 = odd.result;
                steps.push({ codeLine: 9, desc: `Odd expansion: <span class="hl-emerald">len1 = ${len1}</span>`, vars: { start, end, i, left: '-', right: '-', len1, len2: '-', len: '-' }, charStates: odd.matched, pointerI: i, bestStart: start, bestEnd: end });

                const even = traceExpand(s, i, i + 1);
                even.steps.forEach(st => { st.vars.start = start; st.vars.end = end; st.vars.i = i; st.bestStart = start; st.bestEnd = end; steps.push(st); });
                const len2 = even.result;
                steps.push({ codeLine: 10, desc: `Even expansion: <span class="hl-emerald">len2 = ${len2}</span>`, vars: { start, end, i, left: '-', right: '-', len1, len2, len: '-' }, charStates: even.matched, pointerI: i, bestStart: start, bestEnd: end });

                const len = Math.max(len1, len2);
                steps.push({ codeLine: 12, desc: `<span class="hl-cyan">len = max(${len1}, ${len2}) = ${len}</span>`, vars: { start, end, i, left: '-', right: '-', len1, len2, len }, charStates: new Array(s.length).fill('default'), pointerI: i, bestStart: start, bestEnd: end });

                if (len > end - start) {
                    const os = start, oe = end;
                    start = i - Math.floor((len - 1) / 2);
                    end = i + Math.floor(len / 2);
                    const bs = new Array(s.length).fill('default');
                    for (let k = start; k <= end; k++) bs[k] = 'best-palindrome';
                    steps.push({ codeLine: 15, desc: `New best! <span class="hl-purple">len ${len} > ${oe - os}</span> → <span class="hl-cyan">start=${start}, end=${end}</span> → "<span class="hl-purple">${s.substring(start, end + 1)}</span>"`, vars: { start, end, i, left: '-', right: '-', len1, len2, len }, charStates: bs, pointerI: i, bestStart: start, bestEnd: end });
                } else {
                    steps.push({ codeLine: 14, desc: `No update: <span class="hl-cyan">len ${len} ≤ ${end - start}</span>`, vars: { start, end, i, left: '-', right: '-', len1, len2, len }, charStates: new Array(s.length).fill('default'), pointerI: i, bestStart: start, bestEnd: end });
                }
            }
            const fs = new Array(s.length).fill('default');
            for (let k = start; k <= end; k++) fs[k] = 'best-palindrome';
            steps.push({ codeLine: 20, desc: `Return "<span class="hl-purple">${s.substring(start, end + 1)}</span>"`, vars: { start, end }, charStates: fs, bestStart: start, bestEnd: end, finalResult: s.substring(start, end + 1) });
            return steps;
        }

        function traceExpand(s, iL, iR) {
            const steps = []; let left = iL, right = iR;
            const label = iL === iR ? 'Odd' : 'Even';
            const es = new Array(s.length).fill('default');
            if (left >= 0 && left < s.length) es[left] = 'pointer-left';
            if (right >= 0 && right < s.length) es[right] = right === left ? 'pointer-left' : 'pointer-right';
            steps.push({ codeLine: 23, desc: `${label}: <span class="hl-emerald">expandFromCenter(s, ${iL}, ${iR})</span>`, vars: { left, right, len1: '-', len2: '-', len: '-' }, charStates: es });
            let matched = new Array(s.length).fill('default');
            while (left >= 0 && right < s.length && s[left] === s[right]) {
                const st = new Array(s.length).fill('default');
                st[left] = 'pointer-left'; if (right !== left) st[right] = 'pointer-right';
                for (let k = left; k <= right; k++) if (k !== left && k !== right) st[k] = 'matched';
                matched = [...st];
                steps.push({ codeLine: 27, desc: `Match! s[${left}]='<span class="hl-emerald">${s[left]}</span>' == s[${right}]='<span class="hl-emerald">${s[right]}</span>'`, vars: { left, right, len1: '-', len2: '-', len: '-' }, charStates: st });
                left--; right++;
            }
            if (left >= 0 && right < s.length) {
                const st = [...matched]; if (left >= 0 && left < s.length) st[left] = 'mismatch'; if (right < s.length) st[right] = 'mismatch';
                steps.push({ codeLine: 27, desc: `Mismatch: s[${left}]='${s[left]}' ≠ s[${right}]='${s[right]}'`, vars: { left, right, len1: '-', len2: '-', len: '-' }, charStates: st });
            } else {
                steps.push({ codeLine: 31, desc: `Out of bounds (left=${left}, right=${right})`, vars: { left, right, len1: '-', len2: '-', len: '-' }, charStates: matched });
            }
            const res = right - left - 1;
            steps.push({ codeLine: 33, desc: `Return <span class="hl-cyan">${right} - ${left} - 1 = ${res}</span>`, vars: { left, right, len1: '-', len2: '-', len: '-' }, charStates: matched });
            return { steps, result: res, matched };
        }

        engine.init();
    </script>
</body>

</html>
