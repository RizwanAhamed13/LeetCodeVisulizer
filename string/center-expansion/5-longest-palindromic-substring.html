<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Longest Palindromic Substring</title>
    <meta name="description"
        content="Interactive visualizer for LeetCode 5: Longest Palindromic Substring (Brute Force, Better DP, Optimal Center Expansion).">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../core/engine.css">
    <style>
        .string-container {
            padding: 10px;
            overflow-x: auto;
        }

        .index-row,
        .char-row {
            display: flex;
            gap: 4px;
            justify-content: center;
            flex-wrap: nowrap;
        }

        .index-row {
            margin-bottom: 4px;
        }

        .char-row {
            margin-bottom: 24px;
        }

        .index-cell {
            width: 44px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
            flex-shrink: 0;
        }

        .char-cell {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg2);
            border: 2px solid var(--border);
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
            transition: all .3s ease;
            position: relative;
            flex-shrink: 0;
        }

        .char-cell.pointer-i {
            border-color: var(--yellow);
            background: var(--yellow-bg, #fef3c7);
        }

        .char-cell.pointer-i::after {
            content: 'i';
            position: absolute;
            bottom: -20px;
            font-size: 10px;
            color: var(--yellow);
            font-weight: 700;
        }

        .char-cell.pointer-j {
            border-color: var(--orange);
            background: var(--orange-light, #fff7ed);
        }

        .char-cell.pointer-j::after {
            content: 'j';
            position: absolute;
            bottom: -20px;
            font-size: 10px;
            color: var(--orange);
            font-weight: 700;
        }

        .char-cell.pointer-left {
            border-color: var(--emerald);
            background: var(--emerald-bg, #d1fae5);
        }

        .char-cell.pointer-left::after {
            content: 'L';
            position: absolute;
            top: -18px;
            font-size: 10px;
            color: var(--emerald);
            font-weight: 700;
        }

        .char-cell.pointer-right {
            border-color: var(--pink);
            background: var(--pink-bg, #fce7f3);
        }

        .char-cell.pointer-right::after {
            content: 'R';
            position: absolute;
            top: -18px;
            font-size: 10px;
            color: var(--pink);
            font-weight: 700;
        }

        .char-cell.matched {
            background: var(--cyan-bg, #cffafe);
            border-color: var(--cyan, #06b6d4);
            color: var(--cyan, #06b6d4);
        }

        .char-cell.best-palindrome {
            background: var(--purple-bg, #f3e8ff);
            border-color: var(--purple, #9333ea);
            color: var(--purple, #9333ea);
            box-shadow: 0 0 0 3px rgba(147, 51, 234, 0.1);
        }

        .char-cell.mismatch {
            border-color: var(--red, #ef4444);
            background: var(--red-bg, #fee2e2);
        }

        /* DB Table for Better DP */
        .dp-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            overflow-x: auto;
            padding: 10px;
        }

        .dp-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--orange);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .dp-grid {
            display: grid;
            gap: 2px;
            background: var(--border);
            padding: 2px;
            border-radius: 8px;
        }

        .dp-cell {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
        }

        .dp-cell.header {
            background: var(--bg3);
            color: var(--text-dim);
            font-size: 10px;
            font-weight: 700;
        }

        .dp-cell.true {
            background: var(--emerald-light, #d1fae5);
            color: var(--emerald);
        }

        .dp-cell.false {
            background: var(--pink-light, #fce7f3);
            color: var(--pink);
        }

        .dp-cell.active {
            border: 2px solid var(--accent);
            box-shadow: inset 0 0 0 1px var(--accent-light);
            z-index: 10;
            transform: scale(1.1);
        }

        .dp-cell.dep {
            border: 2px dashed var(--orange);
            background: var(--orange-light);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
        }

        .info-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
        }

        .info-card .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .8px;
            color: var(--text-dim);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .info-card .value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 700;
        }

        .info-card.cyan .value {
            color: var(--cyan, #06b6d4);
        }

        .info-card.purple .value {
            color: var(--purple, #9333ea);
        }

        .info-card.emerald .value {
            color: var(--emerald);
        }

        .info-card.orange .value {
            color: var(--orange);
        }

        .info-card.pink .value {
            color: var(--pink);
        }

        .info-card.yellow .value {
            color: var(--yellow, #d97706);
        }

        .result-palindrome {
            font-family: 'JetBrains Mono', monospace;
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            padding: 16px;
            background: var(--purple-bg, #f3e8ff);
            border-radius: var(--radius-sm);
            border: 1px solid rgba(147, 51, 234, 0.15);
            letter-spacing: 4px;
            color: var(--purple, #9333ea);
        }

        .result-palindrome .pal-char.glow {
            color: var(--accent);
        }

        /* General Info */
        .step-text {
            font-size: 14.5px;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .hl-accent {
            color: var(--accent);
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        .hl-orange {
            color: var(--orange, #ea580c);
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        .hl-pink {
            color: var(--pink, #db2777);
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        .hl-emerald {
            color: var(--emerald);
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        .hl-purple {
            color: var(--purple, #9333ea);
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        .hl-cyan {
            color: var(--cyan, #06b6d4);
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        .hl-yellow {
            color: var(--yellow, #d97706);
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>

            { tokens: [{ t: 'br', v: '    }' }] },
            { tokens: [{ t: 'br', v: '}' }] },
        ].map(line => {
            if (line.tokens.length) line.tokens.forEach(t => t.v = esc(t.v));
            return line;
        });

        let mode = 'optimal';

        function generateBruteTrace(s) {
            const steps = [];
            if (!s || s.length <= 1) { steps.push({ codeLine: 3, desc: 'Length <= 1. Return immediately.', vars: {}, charStates: [] }); return steps; }
            let maxLen = 1;
            let maxStr = s.substring(0, 1);

            steps.push({ codeLine: 4, desc: `Initialize <span class="hl-cyan">maxLen = 1</span>, <span class="hl-purple">maxStr = "${maxStr}"</span>`, vars: { i: '-', j: '-', maxLen, left: '-', right: '-' }, charStates: new Array(s.length).fill('default'), bp: maxStr });

            for (let i = 0; i < s.length; i++) {
                const cs = new Array(s.length).fill('default'); cs[i] = 'pointer-i';
                steps.push({ codeLine: 6, desc: `Outer loop <span class="hl-yellow">i = ${i}</span>`, vars: { i, j: '-', maxLen, left: '-', right: '-' }, charStates: cs, bp: maxStr });

                for (let j = i + maxLen; j < s.length; j++) {
                    const st = new Array(s.length).fill('default'); st[i] = 'pointer-i'; st[j] = 'pointer-j';
                    steps.push({ codeLine: 7, desc: `Inner loop <span class="hl-orange">j = ${j}</span>. Check if substring <span class="hl-purple">"${s.substring(i, j + 1)}"</span> is a palindrome.`, vars: { i, j, maxLen, left: '-', right: '-' }, charStates: st, bp: maxStr });

                    let left = i, right = j;
                    let isPal = true;

                    steps.push({ codeLine: 8, desc: `Call helper isPalindrome(s, ${left}, ${right}).`, vars: { i, j, maxLen, left, right }, charStates: [...st], bp: maxStr });

                    while (left < right) {
                        const checkSt = [...st];
                        if (left !== i && left !== j) checkSt[left] = 'pointer-left';
                        if (right !== i && right !== j) checkSt[right] = 'pointer-right';

                        if (s.charAt(left) !== s.charAt(right)) {
                            isPal = false;
                            checkSt[left] = 'mismatch'; checkSt[right] = 'mismatch';
                            steps.push({ codeLine: 19, desc: `'${s.charAt(left)}' != '${s.charAt(right)}'. Mismatch!`, vars: { i, j, maxLen, left, right }, charStates: checkSt, bp: maxStr });
                            break;
                        }

                        checkSt[left] = 'matched'; checkSt[right] = 'matched';
                        steps.push({ codeLine: 20, desc: `'${s.charAt(left)}' == '${s.charAt(right)}'. Match! Move inwards.`, vars: { i, j, maxLen, left, right }, charStates: checkSt, bp: maxStr });
                        left++;
                        right--;
                    }

                    if (isPal) {
                        const bs = [...st];
                        for (let k = i; k <= j; k++) bs[k] = 'best-palindrome';
                        steps.push({ codeLine: 22, desc: `Substring is a palindrome! return true.`, vars: { i, j, maxLen, left: '-', right: '-' }, charStates: bs, bp: maxStr });

                        let curLen = j - i + 1;
                        maxLen = curLen;
                        maxStr = s.substring(i, j + 1);
                        steps.push({ codeLine: 9, desc: `Update maxLen = ${maxLen}, maxStr = "${maxStr}"`, vars: { i, j, maxLen, left: '-', right: '-' }, charStates: bs, bp: maxStr });
                    }
                }
            }

            const fs = new Array(s.length).fill('default');
            const startIndex = s.indexOf(maxStr);
            for (let k = startIndex; k < startIndex + maxLen; k++) fs[k] = 'best-palindrome';

            steps.push({ codeLine: 14, desc: `Return "<span class="hl-purple">${maxStr}</span>"`, vars: { i: '-', j: '-', maxLen, left: '-', right: '-' }, charStates: fs, bp: maxStr, finalResult: maxStr });
            return steps;
        }

        function generateBetterTrace(s) {
            const steps = [];
            const n = s.length;
            if (n <= 1) { steps.push({ codeLine: 3, desc: 'Length <= 1. Return immediately.', vars: {}, charStates: [] }); return steps; }

            let dp = Array(n).fill(null).map(() => Array(n).fill(false));
            let maxStr = s.substring(0, 1);
            dp[0][0] = true; // Just for initial visualize if needed

            steps.push({ codeLine: 5, desc: `Initialize <span class="hl-cyan">dp table</span> of size ${n}x${n}`, vars: { diff: '-', i: '-', j: '-', maxStr }, charStates: new Array(n).fill('default'), dp, bp: maxStr });

            for (let diff = 0; diff < n; diff++) {
                steps.push({ codeLine: 7, desc: `Outer loop <span class="hl-purple">diff = ${diff}</span> (substring length = diff + 1)`, vars: { diff, i: '-', j: '-', maxStr }, charStates: new Array(n).fill('default'), dp: dp.map(r => [...r]), bp: maxStr });

                for (let i = 0, j = i + diff; j < n; i++, j++) {
                    const cs = new Array(n).fill('default'); cs[i] = 'pointer-i'; cs[j] = 'pointer-j';

                    if (diff === 0) {
                        dp[i][j] = true;
                        steps.push({ codeLine: 10, desc: `Substrings of length 1 (diff=0) are always palindromes. dp[${i}][${j}] = true`, vars: { diff, i, j, maxStr }, charStates: cs, dp: dp.map(r => [...r]), activeDp: [i, j], bp: maxStr });
                    } else if (diff === 1) {
                        dp[i][j] = s[i] === s[j];
                        steps.push({ codeLine: 12, desc: `Substrings of length 2 (diff=1). Compare '${s[i]}' and '${s[j]}'. dp[${i}][${j}] = ${dp[i][j]}`, vars: { diff, i, j, maxStr }, charStates: cs, dp: dp.map(r => [...r]), activeDp: [i, j], bp: maxStr });
                    } else {
                        dp[i][j] = (s[i] === s[j]) && dp[i + 1][j - 1];
                        steps.push({ codeLine: 14, desc: `Check ends '${s[i]}' == '${s[j]}' AND inner dp[${i + 1}][${j - 1}]. dp[${i}][${j}] = ${dp[i][j]}`, vars: { diff, i, j, maxStr }, charStates: cs, dp: dp.map(r => [...r]), activeDp: [i, j], depDp: [i + 1, j - 1], bp: maxStr });
                    }

                    if (dp[i][j] && (j - i + 1 > maxStr.length)) {
                        maxStr = s.substring(i, j + 1);
                        const bs = new Array(n).fill('default');
                        for (let k = i; k <= j; k++) bs[k] = 'best-palindrome';
                        steps.push({ codeLine: 17, desc: `New longest palindrome found: <span class="hl-cyan">"${maxStr}"</span>`, vars: { diff, i, j, maxStr }, charStates: bs, dp: dp.map(r => [...r]), bp: maxStr });
                    }
                }
            }

            const fs = new Array(n).fill('default');
            const startIndex = s.indexOf(maxStr);
            for (let k = startIndex; k < startIndex + maxStr.length; k++) fs[k] = 'best-palindrome';

            steps.push({ codeLine: 21, desc: `Return "<span class="hl-purple">${maxStr}</span>"`, vars: { diff: '-', i: '-', j: '-', maxStr }, charStates: fs, dp: dp.map(r => [...r]), bp: maxStr, finalResult: maxStr });
            return steps;
        }

        function generateOptimalTrace(s) {
            const steps = [];
            if (!s || s.length < 1) { steps.push({ codeLine: 3, desc: 'Empty input — return ""', vars: {}, charStates: [] }); return steps; }
            let start = 0, end = 0;
            steps.push({ codeLine: 4, desc: 'Initialize <span class="hl-cyan">start = 0</span>, <span class="hl-cyan">end = 0</span>', vars: { start: 0, end: 0, i: '-', left: '-', right: '-', len1: '-', len2: '-', len: '-' }, charStates: new Array(s.length).fill('default'), bp: s.substring(start, end + 1) });

            for (let i = 0; i < s.length; i++) {
                const cs = new Array(s.length).fill('default'); cs[i] = 'pointer-i';
                steps.push({ codeLine: 6, desc: `Outer loop: <span class="hl-yellow">i = ${i}</span>, center at '<span class="hl-purple">${s[i]}</span>'`, vars: { start, end, i, left: '-', right: '-', len1: '-', len2: '-', len: '-' }, charStates: cs, bp: s.substring(start, end + 1) });

                const odd = traceExpand(s, i, i);
                odd.steps.forEach(st => { st.vars.start = start; st.vars.end = end; st.vars.i = i; st.bp = s.substring(start, end + 1); steps.push(st); });
                const len1 = odd.result;
                steps.push({ codeLine: 7, desc: `Odd expansion: <span class="hl-emerald">len1 = ${len1}</span>`, vars: { start, end, i, left: '-', right: '-', len1, len2: '-', len: '-' }, charStates: odd.matched, bp: s.substring(start, end + 1) });

                const even = traceExpand(s, i, i + 1);
                even.steps.forEach(st => { st.vars.start = start; st.vars.end = end; st.vars.i = i; st.bp = s.substring(start, end + 1); steps.push(st); });
                const len2 = even.result;
                steps.push({ codeLine: 8, desc: `Even expansion: <span class="hl-emerald">len2 = ${len2}</span>`, vars: { start, end, i, left: '-', right: '-', len1, len2, len: '-' }, charStates: even.matched, bp: s.substring(start, end + 1) });

                const len = Math.max(len1, len2);
                steps.push({ codeLine: 9, desc: `<span class="hl-purple">len = max(${len1}, ${len2}) = ${len}</span>`, vars: { start, end, i, left: '-', right: '-', len1, len2, len }, charStates: new Array(s.length).fill('default'), bp: s.substring(start, end + 1) });

                if (len > end - start) {
                    const os = start, oe = end;
                    start = i - Math.floor((len - 1) / 2);
                    end = i + Math.floor(len / 2);
                    const bs = new Array(s.length).fill('default');
                    for (let k = start; k <= end; k++) bs[k] = 'best-palindrome';
                    steps.push({ codeLine: 11, desc: `New best! <span class="hl-purple">len ${len} > ${oe - os}</span> → <span class="hl-cyan">start=${start}, end=${end}</span> → "<span class="hl-purple">${s.substring(start, end + 1)}</span>"`, vars: { start, end, i, left: '-', right: '-', len1, len2, len }, charStates: bs, bp: s.substring(start, end + 1) });
                } else {
                    steps.push({ codeLine: 10, desc: `No update: <span class="hl-cyan">len ${len} ≤ ${end - start}</span>`, vars: { start, end, i, left: '-', right: '-', len1, len2, len }, charStates: new Array(s.length).fill('default'), bp: s.substring(start, end + 1) });
                }
            }
            const fs = new Array(s.length).fill('default');
            for (let k = start; k <= end; k++) fs[k] = 'best-palindrome';
            steps.push({ codeLine: 15, desc: `Return "<span class="hl-purple">${s.substring(start, end + 1)}</span>"`, vars: { start, end }, charStates: fs, bp: s.substring(start, end + 1), finalResult: s.substring(start, end + 1) });
            return steps;
        }

        function traceExpand(s, iL, iR) {
            const steps = []; let left = iL, right = iR;
            const label = iL === iR ? 'Odd' : 'Even';
            const es = new Array(s.length).fill('default');
            if (left >= 0 && left < s.length) es[left] = 'pointer-left';
            if (right >= 0 && right < s.length) es[right] = right === left ? 'pointer-left' : 'pointer-right';
            steps.push({ codeLine: 17, desc: `${label}: <span class="hl-emerald">expandFromCenter(s, ${iL}, ${iR})</span>`, vars: { left, right, len1: '-', len2: '-', len: '-' }, charStates: es });
            let matched = new Array(s.length).fill('default');
            while (left >= 0 && right < s.length && s[left] === s[right]) {
                const st = new Array(s.length).fill('default');
                st[left] = 'pointer-left'; if (right !== left) st[right] = 'pointer-right';
                for (let k = left; k <= right; k++) if (k !== left && k !== right) st[k] = 'matched';
                matched = [...st];
                steps.push({ codeLine: 18, desc: `Match! s[${left}]='<span class="hl-emerald">${s[left]}</span>' == s[${right}]='<span class="hl-emerald">${s[right]}</span>'`, vars: { left, right, len1: '-', len2: '-', len: '-' }, charStates: st });
                left--; right++;
            }
            if (left >= 0 || right < s.length) { // we usually always mismatch or go out of bounds
                const st = [...matched]; if (left >= 0 && left < s.length) st[left] = 'mismatch'; if (right >= 0 && right < s.length) st[right] = 'mismatch';
                steps.push({ codeLine: 18, desc: (left < 0 || right >= s.length) ? `Out of bounds (left=${left}, right=${right})` : `Mismatch: s[${left}]='${s[left]}' ≠ s[${right}]='${s[right]}'`, vars: { left, right, len1: '-', len2: '-', len: '-' }, charStates: st });
            }
            const res = right - left - 1;
            steps.push({ codeLine: 21, desc: `Return <span class="hl-cyan">${right} - ${left} - 1 = ${res}</span>`, vars: { left, right, len1: '-', len2: '-', len: '-' }, charStates: matched });
            return { steps, result: res, matched };
        }

        const engine = new VizEngine({
            title: "Longest Palindromic Substring",
            badge: "String / DP",
            tag: "Center Expansion",
            codeLines: CODE_OPTIMAL,
            inputs: [
                { id: "inputStr", label: "String s", default: "babad", width: "160px" }
            ],
            onRun: () => {
                let s = document.getElementById('inputStr').value.trim();
                if (!s) s = "babad";
                window.engineCache = { s };

                if (mode === 'brute') return generateBruteTrace(s);
                if (mode === 'better') return generateBetterTrace(s);
                return generateOptimalTrace(s);
            },
            onRenderStep: (step, container, eng) => {
                const s = window.engineCache.s;

                // String render
                let strHtml = '<div class="string-container"><div class="index-row">';
                for (let i = 0; i < s.length; i++) {
                    strHtml += `<div class="index-cell">${i}</div>`;
                }
                strHtml += '</div><div class="char-row">';
                const cs = step.charStates || [];
                for (let i = 0; i < s.length; i++) {
                    let cls = "char-cell";
                    if (cs[i] && cs[i] !== 'default') cls += ` ${cs[i]}`;
                    strHtml += `<div class="${cls}">${s[i]}</div>`;
                }
                strHtml += '</div></div>';

                container.innerHTML += eng.createZoomableCard('str_container', '📝 String (Zoomable)', strHtml, '140px');

                // DP Table Render if Better mode
                if (mode === 'better' && step.dp) {
                    let n = step.dp.length;
                    let dpHtml = `<div class="dp-container"><div class="dp-title">boolean[][] dp Table</div><div class="dp-grid" style="grid-template-columns: 24px repeat(${n}, 32px);">`;

                    // Empty top-left
                    dpHtml += `<div class="dp-cell" style="background:transparent; border:none;"></div>`;
                    // Column headers
                    for (let j = 0; j < n; j++) dpHtml += `<div class="dp-cell header">${j}</div>`;

                    for (let i = 0; i < n; i++) {
                        // Row header
                        dpHtml += `<div class="dp-cell header">${i}</div>`;
                        for (let j = 0; j < n; j++) {
                            let val = step.dp[i][j];
                            let cls = val === true ? 'true' : (val === false ? 'false' : '');
                            let displayVal = val === true ? 'T' : (val === false ? 'F' : '-');

                            if (step.activeDp && step.activeDp[0] === i && step.activeDp[1] === j) cls += ' active';
                            if (step.depDp && step.depDp[0] === i && step.depDp[1] === j) cls += ' dep';

                            dpHtml += `<div class="dp-cell ${cls}">${displayVal}</div>`;
                        }
                    }
                    dpHtml += `</div></div>`;
                    container.innerHTML += eng.createSimpleCard('🧮 DP Table', dpHtml);
                }


                // Variables
                const v = step.vars || {};
                let varsHtml = `<div class="info-grid">`;

                let varConfigs = [];
                if (mode === 'brute') {
                    varConfigs = [
                        { k: 'maxLen', l: 'maxLen', c: 'cyan' },
                        { k: 'i', l: 'i', c: 'yellow' },
                        { k: 'j', l: 'j', c: 'orange' },
                        { k: 'left', l: 'left', c: 'emerald' },
                        { k: 'right', l: 'right', c: 'pink' }
                    ];
                } else if (mode === 'better') {
                    varConfigs = [
                        { k: 'maxStr', l: 'maxStr', c: 'purple' },
                        { k: 'diff', l: 'diff', c: 'orange' },
                        { k: 'i', l: 'i', c: 'yellow' },
                        { k: 'j', l: 'j', c: 'pink' }
                    ];
                } else {
                    varConfigs = [
                        { k: 'len', l: 'len (max)', c: 'purple' },
                        { k: 'start', l: 'start', c: 'cyan' },
                        { k: 'end', l: 'end', c: 'cyan' },
                        { k: 'i', l: 'i (center)', c: 'yellow' },
                        { k: 'left', l: 'left', c: 'emerald' },
                        { k: 'right', l: 'right', c: 'pink' },
                        { k: 'len1', l: 'len1 (odd)', c: 'emerald' },
                        { k: 'len2', l: 'len2 (even)', c: 'emerald' }
                    ];
                }

                varConfigs.forEach(vc => {
                    if (v[vc.k] !== undefined && v[vc.k] !== '-') {
                        varsHtml += `<div class="info-card ${vc.c}"><div class="label">${vc.l}</div><div class="value">${v[vc.k]}</div></div>`;
                    }
                });
                varsHtml += `</div>`;
                container.innerHTML += eng.createSimpleCard('📊 Variables', varsHtml);

                container.innerHTML += eng.createSimpleCard('💡 Step Detail', `<div class="step-text">${step.desc}</div>`);

                const bp = step.finalResult || (step.bp || "");

                const title = step.finalResult ? '🏆 Final Result' : '🏆 Best Palindrome So Far';
                let chars = `<span style="color:var(--text-dim); font-size: 14px;">(Empty)</span>`;
                if (bp) {
                    chars = bp.split('').map(c => `<span class="pal-char ${step.finalResult ? 'glow' : ''}">${esc(c)}</span>`).join('');
                }
                container.innerHTML += eng.createSimpleCard(title, `<div class="result-palindrome">${chars}</div>`);

                eng.highlightLine(step.codeLine);
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const controlsBar = document.querySelector('.controls-bar');
            const modeToggleHTML = `
                <div class="mode-toggle">
                    <button class="mode-btn" id="btn-brute" onclick="setMode('brute')">Brute Force</button>
                    <button class="mode-btn" id="btn-better" onclick="setMode('better')">Better (Dynamic Prog)</button>
                    <button class="mode-btn active" id="btn-optimal" onclick="setMode('optimal')">Optimal (Center Expand)</button>
                </div>
            `;
            controlsBar.insertAdjacentHTML('afterbegin', modeToggleHTML);

            setTimeout(() => setMode('optimal'), 10);
        });

        window.setMode = function (m) {
            engine.stopPlay();
            mode = m;
            document.getElementById('btn-brute').classList.toggle('active', m === 'brute');
            document.getElementById('btn-better').classList.toggle('active', m === 'better');
            document.getElementById('btn-optimal').classList.toggle('active', m === 'optimal');

            engine.codeLines = m === 'brute' ? CODE_BRUTE : m === 'better' ? CODE_BETTER : CODE_OPTIMAL;
            engine._renderCodeBlock();
            engine.run();
        };

    </script>
</body>

</html>
