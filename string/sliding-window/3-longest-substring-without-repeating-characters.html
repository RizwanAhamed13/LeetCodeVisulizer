<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Longest Substring Without Repeating Characters</title>
    <meta name="description"
        content="Interactive visualizer for LeetCode 3: Longest Substring Without Repeating Characters (Brute Force & Optimal Sliding Window).">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../core/engine.css">
    <style>
        /* Variables */
        .var-box {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            padding: 10px 14px;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .var-name {
            color: var(--text-dim);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
        }

        .var-val {
            font-weight: 700;
            color: var(--accent);
        }

        .var-val.hl {
            color: var(--emerald);
            font-size: 16px;
            transition: all 0.3s;
        }

        /* Arrays */
        .array-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 40px 20px;
            position: relative;
        }

        .array-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            position: relative;
        }

        .cell {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            z-index: 2;
            transition: all 0.3s;
            position: relative;
        }

        .cell.in-window {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
        }

        .cell.dup {
            background: var(--pink-light, #fce7f3);
            border-color: var(--pink, #db2777);
            color: var(--pink);
            animation: shake 0.4s ease;
        }

        .index-label {
            position: absolute;
            bottom: -20px;
            font-size: 10px;
            color: var(--text-dim);
            width: 100%;
            text-align: center;
            left: 0;
        }

        /* Pointers */
        .ptr {
            position: absolute;
            top: -30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.4s ease;
            z-index: 10;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 11px;
        }

        .ptr.i-ptr {
            color: var(--orange, #ea580c);
        }

        .ptr.j-ptr {
            color: var(--accent);
        }

        .ptr.l-ptr {
            color: var(--orange, #ea580c);
        }

        .ptr.r-ptr {
            color: var(--accent);
        }

        .ptr-arrow {
            margin-top: 2px;
            font-size: 14px;
            line-height: 1;
        }

        /* Sliding Window Box */
        .window-box {
            position: absolute;
            height: 56px;
            top: -6px;
            border: 2px dashed var(--accent);
            border-radius: 12px;
            background: rgba(79, 70, 229, 0.05);
            transition: all 0.4s ease;
            z-index: 1;
            pointer-events: none;
        }

        /* Hash Set */
        .set-container {
            background: var(--bg2);
            border: 1px dashed var(--orange);
            padding: 20px;
            border-radius: 12px;
            min-width: 250px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .set-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--orange);
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .set-items {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: center;
        }

        .set-item {
            width: 34px;
            height: 34px;
            background: white;
            border: 2px solid var(--orange);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* General Info */
        .step-text {
            font-size: 14.5px;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .hl-accent {
            color: var(--accent);
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        .hl-orange {
            color: var(--orange, #ea580c);
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        .hl-pink {
            color: var(--pink, #db2777);
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-4px);
            }

            75% {
                transform: translateX(4px);
            }
        }
    </style>
</head>

<body>
    <script src="../../core/engine.js"></script>
    <script>
        const CODE_BRUTE = [
            { tokens: [{ t: 'kw', v: 'class ' }, { t: 'tp', v: 'Solution ' }, { t: 'br', v: '{' }] },
            { tokens: [{ t: 'kw', v: '    public ' }, { t: 'tp', v: 'int ' }, { t: 'fn', v: 'lengthOfLongestSubstring' }, { t: 'br', v: '(' }, { t: 'tp', v: 'String ' }, { t: 'v', v: 's' }, { t: 'br', v: ') {' }] },
            { tokens: [{ t: 'tp', v: '        int ' }, { t: 'v', v: 'maxLen ' }, { t: 'op', v: '= ' }, { t: 'num', v: '0' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'kw', v: '        for ' }, { t: 'br', v: '(' }, { t: 'tp', v: 'int ' }, { t: 'v', v: 'i ' }, { t: 'op', v: '= ' }, { t: 'num', v: '0' }, { t: 'op', v: '; ' }, { t: 'v', v: 'i < s.length()' }, { t: 'op', v: '; ' }, { t: 'v', v: 'i++' }, { t: 'br', v: ') {' }] },
            { tokens: [{ t: 'tp', v: '            Set<Character> ' }, { t: 'v', v: 'set ' }, { t: 'op', v: '= ' }, { t: 'kw', v: 'new ' }, { t: 'tp', v: 'HashSet<>()' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'kw', v: '            for ' }, { t: 'br', v: '(' }, { t: 'tp', v: 'int ' }, { t: 'v', v: 'j ' }, { t: 'op', v: '= ' }, { t: 'v', v: 'i' }, { t: 'op', v: '; ' }, { t: 'v', v: 'j < s.length()' }, { t: 'op', v: '; ' }, { t: 'v', v: 'j++' }, { t: 'br', v: ') {' }] },
            { tokens: [{ t: 'kw', v: '                if ' }, { t: 'br', v: '(' }, { t: 'v', v: 'set.contains(s.charAt(j))' }, { t: 'br', v: ') ' }, { t: 'kw', v: 'break' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'v', v: '                set.add(s.charAt(j));' }] },
            { tokens: [{ t: 'v', v: '                maxLen ' }, { t: 'op', v: '= ' }, { t: 'v', v: 'Math.max(maxLen, j - i + 1)' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'br', v: '            }' }] },
            { tokens: [{ t: 'br', v: '        }' }] },
            { tokens: [{ t: 'kw', v: '        return ' }, { t: 'v', v: 'maxLen' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'br', v: '    }' }] },
            { tokens: [{ t: 'br', v: '}' }] },
        ];

        const CODE_OPTIMAL = [
            { tokens: [{ t: 'kw', v: 'class ' }, { t: 'tp', v: 'Solution ' }, { t: 'br', v: '{' }] },
            { tokens: [{ t: 'kw', v: '    public ' }, { t: 'tp', v: 'int ' }, { t: 'fn', v: 'lengthOfLongestSubstring' }, { t: 'br', v: '(' }, { t: 'tp', v: 'String ' }, { t: 'v', v: 's' }, { t: 'br', v: ') {' }] },
            { tokens: [{ t: 'tp', v: '        int ' }, { t: 'v', v: 'maxLen ' }, { t: 'op', v: '= ' }, { t: 'num', v: '0' }, { t: 'op', v: ', ' }, { t: 'v', v: 'left ' }, { t: 'op', v: '= ' }, { t: 'num', v: '0' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'tp', v: '        Set<Character> ' }, { t: 'v', v: 'set ' }, { t: 'op', v: '= ' }, { t: 'kw', v: 'new ' }, { t: 'tp', v: 'HashSet<>()' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'kw', v: '        for ' }, { t: 'br', v: '(' }, { t: 'tp', v: 'int ' }, { t: 'v', v: 'right ' }, { t: 'op', v: '= ' }, { t: 'num', v: '0' }, { t: 'op', v: '; ' }, { t: 'v', v: 'right < s.length()' }, { t: 'op', v: '; ' }, { t: 'v', v: 'right++' }, { t: 'br', v: ') {' }] },
            { tokens: [{ t: 'kw', v: '            while ' }, { t: 'br', v: '(' }, { t: 'v', v: 'set.contains(s.charAt(right))' }, { t: 'br', v: ') {' }] },
            { tokens: [{ t: 'v', v: '                set.remove(s.charAt(left));' }] },
            { tokens: [{ t: 'v', v: '                left++;' }] },
            { tokens: [{ t: 'br', v: '            }' }] },
            { tokens: [{ t: 'v', v: '            set.add(s.charAt(right));' }] },
            { tokens: [{ t: 'v', v: '            maxLen ' }, { t: 'op', v: '= ' }, { t: 'v', v: 'Math.max(maxLen, right - left + 1)' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'br', v: '        }' }] },
            { tokens: [{ t: 'kw', v: '        return ' }, { t: 'v', v: 'maxLen' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'br', v: '    }' }] },
            { tokens: [{ t: 'br', v: '}' }] },
        ];

        let mode = 'optimal';

        function generateBruteTrace(s) {
            const steps = [];
            const chars = s.split('');
            let maxLen = 0;

            steps.push({ line: 2, desc: `Initialize maxLen = 0`, i: -1, j: -1, set: [], maxLen: 0, str: s });

            for (let i = 0; i < s.length; i++) {
                steps.push({ line: 4, desc: `Loop i = ${i}. Create fresh Hash Set.`, i, j: -1, set: [], maxLen, str: s });
                const currentSet = new Set();

                for (let j = i; j < s.length; j++) {
                    const ch = s[j];
                    steps.push({ line: 6, desc: `Loop j = ${j}, char = '${ch}'. Check if '${ch}' is in set.`, i, j, set: Array.from(currentSet), maxLen, str: s, isDup: currentSet.has(ch) });

                    if (currentSet.has(ch)) {
                        steps.push({ line: 6, desc: `'${ch}' is already in the set! Duplicate found. Break inner loop.`, i, j, set: Array.from(currentSet), maxLen, str: s, isDup: true });
                        break;
                    }

                    currentSet.add(ch);
                    steps.push({ line: 7, desc: `Add '${ch}' to set.`, i, j, set: Array.from(currentSet), maxLen, str: s });

                    const curLen = j - i + 1;
                    if (curLen > maxLen) {
                        maxLen = curLen;
                        steps.push({ line: 8, desc: `Update maxLen = Math.max(${maxLen - 1}, ${curLen}) = ${maxLen}`, i, j, set: Array.from(currentSet), maxLen, str: s, hlMaxLen: true });
                    } else {
                        steps.push({ line: 8, desc: `maxLen remains ${maxLen}`, i, j, set: Array.from(currentSet), maxLen, str: s });
                    }
                }
            }
            steps.push({ line: 11, desc: `Return maxLen = ${maxLen}`, i: -1, j: -1, set: [], maxLen, str: s });
            return steps;
        }

        function generateOptimalTrace(s) {
            const steps = [];
            let maxLen = 0, left = 0;
            const currentSet = new Set();

            steps.push({ line: 2, desc: `Initialize maxLen = 0, left = 0.`, L: -1, R: -1, set: [], maxLen: 0, str: s });
            steps.push({ line: 3, desc: `Initialize empty Hash Set.`, L: 0, R: -1, set: [], maxLen: 0, str: s });

            for (let right = 0; right < s.length; right++) {
                const ch = s[right];
                steps.push({ line: 5, desc: `Loop right = ${right}, char = '${ch}'. Check if '${ch}' is in set.`, L: left, R: right, set: Array.from(currentSet), maxLen, str: s, isDup: currentSet.has(ch) });

                while (currentSet.has(s[right])) {
                    const lch = s[left];
                    currentSet.delete(lch);
                    steps.push({ line: 6, desc: `Duplicate found for '${ch}'! Remove s[left] = '${lch}' from set.`, L: left, R: right, set: Array.from(currentSet), maxLen, str: s, windowShrink: true });
                    left++;
                    steps.push({ line: 7, desc: `Move left pointer to ${left}`, L: left, R: right, set: Array.from(currentSet), maxLen, str: s });
                }

                currentSet.add(ch);
                steps.push({ line: 9, desc: `Add '${ch}' to set.`, L: left, R: right, set: Array.from(currentSet), maxLen, str: s });

                const curLen = right - left + 1;
                if (curLen > maxLen) {
                    maxLen = curLen;
                    steps.push({ line: 10, desc: `Update maxLen = Math.max(${maxLen - 1}, ${curLen}) = ${maxLen}`, L: left, R: right, set: Array.from(currentSet), maxLen, str: s, hlMaxLen: true });
                } else {
                    steps.push({ line: 10, desc: `maxLen remains ${maxLen}`, L: left, R: right, set: Array.from(currentSet), maxLen, str: s });
                }
            }
            steps.push({ line: 12, desc: `Return maxLen = ${maxLen}`, L: left, R: -1, set: Array.from(currentSet), maxLen, str: s });
            return steps;
        }

        const engine = new VizEngine({
            title: "Longest Substring Without Repeating",
            badge: "Array / Hash Table",
            tag: "Sliding Window",
            codeLines: CODE_OPTIMAL,
            inputs: [
                { id: "inputStr", label: "String s", default: "abcabcbb", width: "160px" }
            ],
            onRun: () => {
                const s = document.getElementById('inputStr').value || "abcabcbb";
                return mode === 'brute' ? generateBruteTrace(s) : generateOptimalTrace(s);
            },
            onRenderStep: (step, container, eng) => {
                // Determine layout vars based on mode
                let p1 = mode === 'brute' ? step.i : step.L;
                let p2 = mode === 'brute' ? step.j : step.R;
                let p1Label = mode === 'brute' ? 'i' : 'L';
                let p2Label = mode === 'brute' ? 'j' : 'R';
                let p1Class = mode === 'brute' ? 'i-ptr' : 'l-ptr';
                let p2Class = mode === 'brute' ? 'j-ptr' : 'r-ptr';

                // DP / Vars
                let varsHtml = `<div style="display: flex; gap: 16px; flex-wrap: wrap;">`;
                varsHtml += `<div class="var-box"><span class="var-name">maxLen</span><span class="var-val${step.hlMaxLen ? ' hl' : ''}">${step.maxLen}</span></div>`;
                if (p1 >= 0) varsHtml += `<div class="var-box"><span class="var-name">${p1Label}</span><span class="var-val hl-orange">${p1}</span></div>`;
                if (p2 >= 0) varsHtml += `<div class="var-box"><span class="var-name">${p2Label}</span><span class="var-val hl-accent">${p2}</span></div>`;
                varsHtml += `</div>`;

                // Hash Set Render
                let setHtml = `<div class="set-items">`;
                if (step.set.length === 0) setHtml += `<span style="color: var(--text-dim); font-size: 13px;">(Empty)</span>`;
                step.set.forEach(c => {
                    setHtml += `<div class="set-item">${c}</div>`;
                });
                setHtml += `</div>`;

                let setPanel = `<div class="set-container"><div class="set-title">Hash Set</div>${setHtml}</div>`;

                // Array Visual
                let arrayHtml = `<div class="array-container"><div class="array-row" id="mainArray">`;
                for (let idx = 0; idx < step.str.length; idx++) {
                    const c = step.str[idx];
                    let cls = '';
                    if (p1 >= 0 && p2 >= 0 && idx >= p1 && idx <= p2) {
                        cls = ' in-window';
                        if (idx === p2 && step.isDup) cls += ' dup';
                    }
                    arrayHtml += `
                        <div class="cell${cls}" id="cell-${idx}">
                            ${c}
                            <div class="index-label">${idx}</div>
                        </div>`;
                }

                if (p1 >= 0 && step.str.length > 0) {
                    arrayHtml += `<div class="ptr ${p1Class}" id="ptr1"><div>${p1Label}</div><div class="ptr-arrow">↓</div></div>`;
                }
                if (p2 >= 0 && step.str.length > 0) {
                    arrayHtml += `<div class="ptr ${p2Class}" id="ptr2"><div>${p2Label}</div><div class="ptr-arrow">↓</div></div>`;
                }
                if (p1 >= 0 && p2 >= 0) {
                    arrayHtml += `<div class="window-box" id="winBox"></div>`;
                }

                arrayHtml += `</div></div>`;

                // Layout Structure
                container.innerHTML += eng.createSimpleCard('🔍 Execution Tracking', varsHtml + `<div style="display:flex; gap: 24px; padding-top: 20px; flex-wrap: wrap;">${setPanel}<div style="flex:1;">${arrayHtml}</div></div>`);
                container.innerHTML += eng.createSimpleCard('💡 Current Operation', `<div class="step-text">${step.desc}</div>`);

                // Map engine codeline selection
                eng.highlightLine(step.line);

                // Position Pointers using setTimeout to ensure DOM is drawn
                setTimeout(() => {
                    const getPtrLeft = (idx) => {
                        const el = document.getElementById('cell-' + idx);
                        if (!el) return 0;
                        return el.offsetLeft + (el.clientWidth / 2) - 10;
                    };

                    const ptr1 = document.getElementById('ptr1');
                    if (ptr1) { ptr1.style.left = getPtrLeft(p1) + 'px'; }

                    const ptr2 = document.getElementById('ptr2');
                    if (ptr2) {
                        // If p1 and p2 overlap, avoid text collision
                        if (p1 === p2) {
                            ptr1.style.transform = `translateY(-15px)`;
                            ptr1.innerHTML = `<div>${p1Label},${p2Label}</div><div class="ptr-arrow">↓</div>`;
                            ptr2.style.display = 'none';
                        } else {
                            ptr2.style.left = getPtrLeft(p2) + 'px';
                        }
                    }

                    const win = document.getElementById('winBox');
                    if (win && p1 >= 0 && p2 >= p1) {
                        const cellL = document.getElementById('cell-' + p1);
                        const cellR = document.getElementById('cell-' + p2);
                        if (cellL && cellR) {
                            win.style.left = (cellL.offsetLeft - 6) + 'px';
                            win.style.width = (cellR.offsetLeft - cellL.offsetLeft + cellR.clientWidth + 12) + 'px';
                        }
                    }
                }, 0);
            }
        });

        // Setup custom mode toggle
        document.addEventListener('DOMContentLoaded', () => {
            const controlsBar = document.querySelector('.controls-bar');
            const modeToggleHTML = `
                <div class="mode-toggle">
                    <button class="mode-btn" id="btn-brute" onclick="setMode('brute')">Brute Force</button>
                    <button class="mode-btn active" id="btn-optimal" onclick="setMode('optimal')">Optimal (Sliding Window)</button>
                </div>
            `;
            controlsBar.insertAdjacentHTML('afterbegin', modeToggleHTML);

            // Wait a tick for engine to mount, then run
            setTimeout(() => setMode('optimal'), 10);
        });

        window.setMode = function (m) {
            engine.stopPlay();
            mode = m;
            document.getElementById('btn-brute').classList.toggle('active', m === 'brute');
            document.getElementById('btn-optimal').classList.toggle('active', m === 'optimal');

            // Swap code panels
            engine.codeLines = m === 'brute' ? CODE_BRUTE : CODE_OPTIMAL;
            engine._renderCodeBlock();

            engine.run();
        };

    </script>
</body>

</html>
