<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LC #1 — Two Sum | Engine Example</title>
    <meta name="description"
        content="Interactive dry-run visualization of LeetCode #1 Two Sum using the Universal Engine.">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../core/engine.css">

    <!-- Specific styles for Two Sum -->
    <style>
        .array-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 10px 30px 10px;
        }

        .array-container::-webkit-scrollbar {
            height: 6px;
        }

        .array-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .array-element {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .array-index {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-dim);
        }

        .array-box {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg2);
            border: 2px solid var(--border);
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            position: relative;
            transition: all 0.3s;
        }

        .array-box.pointer-i {
            border-color: var(--yellow);
            background: var(--yellow-bg);
            box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.1);
        }

        .array-box.pointer-i::after {
            content: 'i';
            position: absolute;
            bottom: -22px;
            font-size: 11px;
            color: var(--yellow);
            font-weight: 700;
        }

        .array-box.found {
            border-color: var(--emerald);
            background: var(--emerald-bg);
            color: var(--emerald);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
        }

        .hashmap-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
        }

        .hashmap-entry {
            display: flex;
            flex-direction: column;
            background: var(--purple-bg);
            border: 1px solid rgba(124, 58, 237, 0.2);
            border-radius: 8px;
            overflow: hidden;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.3s;
        }

        .hashmap-entry.new-entry {
            animation: popIn 0.3s ease-out;
            box-shadow: 0 0 0 2px var(--purple);
        }

        .hashmap-entry.found-entry {
            background: var(--emerald-bg);
            border-color: var(--emerald);
            box-shadow: 0 0 0 2px var(--emerald);
        }

        .hm-key {
            padding: 6px;
            background: rgba(124, 58, 237, 0.1);
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--purple);
            border-bottom: 1px solid rgba(124, 58, 237, 0.2);
        }

        .hashmap-entry.found-entry .hm-key {
            background: rgba(5, 150, 105, 0.1);
            color: var(--emerald);
            border-bottom-color: rgba(5, 150, 105, 0.2);
        }

        .hm-val {
            padding: 8px;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
        }

        @keyframes popIn {
            0% {
                transform: scale(0.9);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
        }

        .info-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
        }

        .info-card .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .8px;
            color: var(--text-dim);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .info-card .value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 700;
        }

        .info-card.cyan .value {
            color: var(--cyan);
        }

        .info-card.purple .value {
            color: var(--purple);
        }

        .info-card.emerald .value {
            color: var(--emerald);
        }

        .info-card.yellow .value {
            color: var(--yellow);
        }

        .info-card.pink .value {
            color: var(--pink);
        }
    </style>
</head>

<body>
    <!-- Engine handles layout -->
    <script src="../../core/engine.js"></script>
    <script>
        // 1. Define Java Code Lines
        function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        const CODE_LINES = [
            { tokens: [{ t: 'kw', v: 'class' }, { t: 'tp', v: ' Solution' }, { t: 'br', v: ' {' }] },
            { tokens: [{ t: 'kw', v: '    public' }, { t: 'tp', v: ' int' }, { t: 'br', v: '[]' }, { t: 'fn', v: ' twoSum' }, { t: 'br', v: '(' }, { t: 'tp', v: 'int' }, { t: 'br', v: '[]' }, { t: '', v: ' nums, ' }, { t: 'tp', v: 'int' }, { t: '', v: ' target' }, { t: 'br', v: ') {' }] },
            { tokens: [{ t: 'tp', v: '        Map' }, { t: 'op', v: '<' }, { t: 'tp', v: 'Integer' }, { t: '', v: ', ' }, { t: 'tp', v: 'Integer' }, { t: 'op', v: '> ' }, { t: '', v: 'numMap' }, { t: 'op', v: ' = ' }, { t: 'kw', v: 'new' }, { t: 'tp', v: ' HashMap' }, { t: 'op', v: '<>' }, { t: 'br', v: '()' }, { t: 'op', v: ';' }] },
            { tokens: [] },
            { tokens: [{ t: 'kw', v: '        for' }, { t: 'br', v: ' (' }, { t: 'tp', v: 'int' }, { t: '', v: ' i' }, { t: 'op', v: ' = ' }, { t: 'num', v: '0' }, { t: 'op', v: '; ' }, { t: '', v: 'i' }, { t: 'op', v: ' < ' }, { t: '', v: 'nums.length' }, { t: 'op', v: '; ' }, { t: '', v: 'i++' }, { t: 'br', v: ') {' }] },
            { tokens: [{ t: 'tp', v: '            int' }, { t: '', v: ' complement' }, { t: 'op', v: ' = ' }, { t: '', v: 'target - nums[i]' }, { t: 'op', v: ';' }] },
            { tokens: [] },
            { tokens: [{ t: 'kw', v: '            if' }, { t: 'br', v: ' (' }, { t: '', v: 'numMap.containsKey(complement)' }, { t: 'br', v: ') {' }] },
            { tokens: [{ t: 'ret', v: '                return' }, { t: 'kw', v: ' new' }, { t: 'tp', v: ' int' }, { t: 'br', v: '[] {' }, { t: '', v: ' numMap.get(complement), i ' }, { t: 'br', v: '}' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'br', v: '            }' }] },
            { tokens: [] },
            { tokens: [{ t: '', v: '            numMap.put' }, { t: 'br', v: '(' }, { t: '', v: 'nums[i], i' }, { t: 'br', v: ')' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'br', v: '        }' }] },
            { tokens: [] },
            { tokens: [{ t: 'ret', v: '        return' }, { t: 'kw', v: ' new' }, { t: 'tp', v: ' int' }, { t: 'br', v: '[] {}' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'br', v: '    }' }] },
            { tokens: [{ t: 'br', v: '}' }] },
        ].map(line => {
            // Re-apply escapes since we bypassed earlier esc
            if (line.tokens.length) {
                line.tokens.forEach(t => t.v = esc(t.v));
            }
            return line;
        });

        // 2. Initialize Engine
        const engine = new VizEngine({
            title: "Two Sum",
            badge: "LC #1",
            tag: "Hash Map",
            codeLines: CODE_LINES,
            inputs: [
                { id: "inputNums", label: "Nums", default: "2, 7, 11, 15", width: "160px" },
                { id: "inputTarget", label: "Target", default: "9", width: "80px" }
            ],
            // Simulator Runner
            onRun: () => {
                const numsStr = document.getElementById('inputNums').value;
                const targetStr = document.getElementById('inputTarget').value;
                const nums = numsStr.split(',').map(n => parseInt(n.trim())).filter(n => !isNaN(n));
                const target = parseInt(targetStr.trim());
                if (nums.length === 0 || isNaN(target)) {
                    alert("Invalid inputs");
                    return [];
                }

                // Expose to globally accessible state for rendering
                window.engineCache = { nums, target };
                return generateTrace(nums, target);
            },
            // Step Renderer
            onRenderStep: (step, container, eng) => {
                const { nums, target } = window.engineCache;

                // Array UI
                let arrHtml = '<div class="array-container">';
                for (let i = 0; i < nums.length; i++) {
                    let cls = "array-box";
                    if (i === step.pointerI) cls += " pointer-i";
                    if (step.result && (i === step.result[0] || i === step.result[1])) cls += " found";
                    arrHtml += `
                        <div class="array-element">
                            <div class="array-index">${i}</div>
                            <div class="${cls}">${nums[i]}</div>
                        </div>
                    `;
                }
                arrHtml += '</div>';

                // Wrapping Array in a regular simple card
                container.innerHTML += eng.createSimpleCard('🔢 Array (nums)', arrHtml);

                // HashMap UI (Uses zoomable canvas as a feature test!)
                let mapHtml = '';
                if (Object.keys(step.mapState).length === 0) {
                    mapHtml = '<div style="font-size: 13px; color: var(--text-dim); padding: 10px;">(Empty)</div>';
                } else {
                    mapHtml += '<div class="hashmap-container">';
                    step.keysAddedState.forEach(key => {
                        let innercls = 'hashmap-entry';
                        let boxStyle = '';
                        if (step.newEntry === key) innercls += " new-entry";
                        if (step.checkComp === key) boxStyle = 'box-shadow: 0 0 0 2px var(--cyan);';
                        if (step.foundComp === key) innercls += " found-entry";
                        mapHtml += `
                            <div class="${innercls}" style="${boxStyle}">
                                <div class="hm-key">Key: ${key}</div>
                                <div class="hm-val">Idx: ${step.mapState[key]}</div>
                            </div>
                        `;
                    });
                    mapHtml += '</div>';
                }

                // Wrap Hashmap inside pan/zoom container!
                container.innerHTML += eng.createZoomableCard('hm_container', '🗂️ HashMap (Zoomable)', mapHtml, '200px');

                // Variables Grid
                const v = step.vars || {};
                let varsHtml = `
                    <div class="info-grid">
                        <div class="info-card pink"><div class="label">target</div><div class="value">${target}</div></div>
                        <div class="info-card yellow"><div class="label">i</div><div class="value">${v.i}</div></div>
                        <div class="info-card emerald"><div class="label">nums[i]</div><div class="value">${v.nums_i}</div></div>
                        <div class="info-card cyan"><div class="label">complement</div><div class="value">${v.comp}</div></div>
                    </div>
                `;
                container.innerHTML += eng.createSimpleCard('📊 Variables', varsHtml);

                // Desc
                container.innerHTML += eng.createSimpleCard('💡 Step Detail', `<div class="step-text">${step.desc}</div>`);

                // Result
                if (step.result) {
                    container.innerHTML += eng.createSimpleCard('🏆 Result Output', `<div class="state-tracker" style="color:var(--emerald); background:var(--emerald-bg); border-color:var(--emerald);"><span>Output</span><span>[${step.result.join(', ')}]</span></div>`);
                }
            }
        });

        // 3. Keep old simulator logic
        function generateTrace(nums, target) {
            const steps = [];
            const map = {};
            const keysAdded = [];

            steps.push({
                codeLine: 2, desc: 'Initialize empty <span class="hl-purple">HashMap</span>.',
                vars: { i: '-', nums_i: '-', comp: '-' }, mapState: { ...map }, keysAddedState: [...keysAdded], pointerI: -1
            });

            for (let i = 0; i < nums.length; i++) {
                steps.push({
                    codeLine: 4, desc: `Loop through array: <span class="hl-yellow">i = ${i}</span>.`,
                    vars: { i: i, nums_i: nums[i], comp: '-' }, mapState: { ...map }, keysAddedState: [...keysAdded], pointerI: i
                });

                const comp = target - nums[i];
                steps.push({
                    codeLine: 5, desc: `Calculate complement: <span class="hl-cyan">${target} - ${nums[i]} = ${comp}</span>.`,
                    vars: { i: i, nums_i: nums[i], comp: comp }, mapState: { ...map }, keysAddedState: [...keysAdded], pointerI: i
                });

                steps.push({
                    codeLine: 7, desc: `Check if map contains <span class="hl-cyan">${comp}</span>.`,
                    vars: { i: i, nums_i: nums[i], comp: comp }, mapState: { ...map }, keysAddedState: [...keysAdded], pointerI: i, checkComp: comp
                });

                if (comp in map) {
                    steps.push({
                        codeLine: 8, desc: `Found complement <span class="hl-cyan">${comp}</span>! Return [<span class="hl-emerald">${map[comp]}</span>, <span class="hl-yellow">${i}</span>].`,
                        vars: { i: i, nums_i: nums[i], comp: comp }, mapState: { ...map }, keysAddedState: [...keysAdded], pointerI: i, foundComp: comp, result: [map[comp], i]
                    });
                    return steps;
                }

                map[nums[i]] = i;
                if (!keysAdded.includes(nums[i])) keysAdded.push(nums[i]);

                steps.push({
                    codeLine: 11, desc: `Put <span class="hl-emerald">Key: ${nums[i]}</span>, <span class="hl-purple">Value: ${i}</span> into map.`,
                    vars: { i: i, nums_i: nums[i], comp: comp }, mapState: { ...map }, keysAddedState: [...keysAdded], pointerI: i, newEntry: nums[i]
                });
            }

            steps.push({
                codeLine: 14, desc: 'Loop ends. Return empty array.',
                vars: { i: '-', nums_i: '-', comp: '-' }, mapState: { ...map }, keysAddedState: [...keysAdded], pointerI: -1, result: []
            });
            return steps;
        }

        // 4. Mount!
        engine.init();
    </script>
</body>

</html>
