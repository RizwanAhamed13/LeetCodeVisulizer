<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LC #217 — Contains Duplicate | Arrays & Hashing</title>
    <meta name="description"
        content="Interactive dry-run visualization of LeetCode #217 Contains Duplicate using the Hash Set technique.">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../core/engine.css">
    <style>
        .array-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 10px 30px 10px;
        }

        .array-container::-webkit-scrollbar {
            height: 6px;
        }

        .array-container::-webkit-scrollbar-thumb {
            background: var(--border-hover);
            border-radius: 3px;
        }

        .array-element {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .array-index {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-dim);
        }

        .array-box {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg2);
            border: 2px solid var(--border);
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            position: relative;
            transition: all 0.3s;
        }

        .array-box.pointer-num {
            border-color: var(--cyan);
            background: var(--cyan-bg);
            box-shadow: 0 0 0 3px rgba(8, 145, 178, 0.1);
        }

        .array-box.pointer-num::after {
            content: 'num';
            position: absolute;
            bottom: -22px;
            font-size: 11px;
            color: var(--cyan);
            font-weight: 700;
        }

        .array-box.found {
            border-color: var(--pink);
            background: var(--pink-bg);
            color: var(--pink);
            box-shadow: 0 0 0 3px rgba(219, 39, 119, 0.1);
        }

        .hashset-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 10px;
            min-height: 60px;
        }

        .set-item {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
            background: var(--purple-bg);
            border: 2px solid rgba(124, 58, 237, 0.3);
            border-radius: 50%;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 700;
            color: var(--purple);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .set-item.new-item {
            animation: popIn 0.4s forwards;
            background: var(--emerald-bg);
            border-color: var(--emerald);
            color: var(--emerald);
        }

        .set-item.duplicate-item {
            background: var(--pink-bg);
            border-color: var(--pink);
            color: var(--pink);
            box-shadow: 0 0 0 4px rgba(219, 39, 119, 0.2);
            transform: scale(1.1);
        }

        @keyframes popIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            60% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
        }

        .info-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
        }

        .info-card .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .8px;
            color: var(--text-dim);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .info-card .value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 700;
        }

        .info-card.cyan .value {
            color: var(--cyan);
        }

        .info-card.purple .value {
            color: var(--purple);
        }

        .result-box {
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            padding: 16px;
            border-radius: var(--radius-sm);
        }

        .result-box.true {
            background: var(--pink-bg);
            border: 1px solid rgba(219, 39, 119, 0.2);
            color: var(--pink);
        }

        .result-box.false {
            background: var(--emerald-bg);
            border: 1px solid rgba(5, 150, 105, 0.2);
            color: var(--emerald);
        }
    </style>
</head>

<body>
    <script src="../../core/engine.js"></script>
    <script>
        function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

        const CODE_LINES = [
            { tokens: [{ t: 'kw', v: 'class' }, { t: 'tp', v: ' Solution' }, { t: 'br', v: ' {' }] },
            { tokens: [{ t: 'kw', v: '    public' }, { t: 'tp', v: ' boolean' }, { t: 'fn', v: ' containsDuplicate' }, { t: 'br', v: '(' }, { t: 'tp', v: 'int' }, { t: 'br', v: '[]' }, { t: '', v: ' nums' }, { t: 'br', v: ') {' }] },
            { tokens: [{ t: 'tp', v: '        Set' }, { t: 'op', v: '<' }, { t: 'tp', v: 'Integer' }, { t: 'op', v: '> ' }, { t: '', v: 'seen' }, { t: 'op', v: ' = ' }, { t: 'kw', v: 'new' }, { t: 'tp', v: ' HashSet' }, { t: 'op', v: '<>' }, { t: 'br', v: '()' }, { t: 'op', v: ';' }] },
            { tokens: [] },
            { tokens: [{ t: 'kw', v: '        for' }, { t: 'br', v: ' (' }, { t: 'tp', v: 'int' }, { t: '', v: ' num : nums' }, { t: 'br', v: ') {' }] },
            { tokens: [{ t: 'kw', v: '            if' }, { t: 'br', v: ' (' }, { t: '', v: 'seen.contains(num)' }, { t: 'br', v: ') {' }] },
            { tokens: [{ t: 'ret', v: '                return' }, { t: 'kw', v: ' true' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'br', v: '            }' }] },
            { tokens: [{ t: '', v: '            seen.add(num)' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'br', v: '        }' }] },
            { tokens: [] },
            { tokens: [{ t: 'ret', v: '        return' }, { t: 'kw', v: ' false' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'br', v: '    }' }] },
            { tokens: [{ t: 'br', v: '}' }] },
        ].map(line => {
            if (line.tokens.length) line.tokens.forEach(t => t.v = esc(t.v));
            return line;
        });

        const engine = new VizEngine({
            title: "Contains Duplicate",
            badge: "LC #217",
            tag: "Hash Set",
            codeLines: CODE_LINES,
            inputs: [
                { id: "inputNums", label: "Nums", default: "1, 2, 3, 1", width: "220px" },
            ],
            onRun: () => {
                const numsStr = document.getElementById('inputNums').value;
                const nums = numsStr.split(',').map(n => parseInt(n.trim())).filter(n => !isNaN(n));
                if (nums.length === 0) { alert("Invalid inputs"); return []; }
                window.engineCache = { nums };
                return generateTrace(nums);
            },
            onRenderStep: (step, container, eng) => {
                const { nums } = window.engineCache;

                let arrHtml = '<div class="array-container">';
                for (let i = 0; i < nums.length; i++) {
                    let cls = "array-box";
                    if (i === step.pointerI) cls += " pointer-num";
                    if (step.foundNum !== undefined && nums[i] === step.foundNum) cls += " found";
                    arrHtml += `
                        <div class="array-element">
                            <div class="array-index">${i}</div>
                            <div class="${cls}">${nums[i]}</div>
                        </div>
                    `;
                }
                arrHtml += '</div>';
                container.innerHTML += eng.createSimpleCard('🔢 Array (nums)', arrHtml);

                let setHtml = '<div class="hashset-container">';
                if (step.setState.length === 0) {
                    setHtml += '<div style="font-size: 13px; color: var(--text-dim);">({} empty)</div>';
                } else {
                    step.setState.forEach(item => {
                        let innercls = 'set-item';
                        let boxStyle = '';
                        if (step.addedNum === item) innercls += " new-item";
                        if (step.checkComp === item) boxStyle = 'box-shadow: 0 0 0 2px var(--cyan);';
                        if (step.foundNum === item) innercls += " duplicate-item";
                        setHtml += `<div class="${innercls}" style="${boxStyle}">${item}</div>`;
                    });
                }
                setHtml += '</div>';
                container.innerHTML += eng.createZoomableCard('hs_container', '🗂️ HashSet (Zoomable)', setHtml, '150px');

                const v = step.vars || {};
                let varsHtml = `
                    <div class="info-grid">
                        <div class="info-card cyan"><div class="label">num</div><div class="value">${v.num}</div></div>
                        <div class="info-card purple"><div class="label">seen.size()</div><div class="value">${step.setState.length}</div></div>
                    </div>
                `;
                container.innerHTML += eng.createSimpleCard('📊 Variables', varsHtml);

                container.innerHTML += eng.createSimpleCard('💡 Step Detail', `<div class="step-text">${step.desc}</div>`);

                if (step.result !== undefined) {
                    const resCls = step.result ? 'true' : 'false';
                    container.innerHTML += eng.createSimpleCard('🏆 Result Output', `<div class="result-box ${resCls}">return ${step.result};</div>`);
                }
            }
        });

        function generateTrace(nums) {
            const steps = [];
            let seen = [];

            steps.push({
                codeLine: 2, desc: 'Initialize empty <span class="hl-purple">HashSet</span> <code>seen</code>.',
                vars: { i: '-', num: '-' }, setState: [...seen], pointerI: -1
            });

            for (let i = 0; i < nums.length; i++) {
                let num = nums[i];
                steps.push({
                    codeLine: 4, desc: `For-each loop: get next value <span class="hl-cyan">num = ${num}</span>.`,
                    vars: { i: i, num: num }, setState: [...seen], pointerI: i
                });

                steps.push({
                    codeLine: 5, desc: `Check if <code>seen</code> contains <span class="hl-cyan">${num}</span>.`,
                    vars: { i: i, num: num }, setState: [...seen], pointerI: i, checkComp: num
                });

                if (seen.includes(num)) {
                    steps.push({
                        codeLine: 6, desc: `Duplicate found! The set already contains <span class="hl-pink">${num}</span>. Return <code>true</code>.`,
                        vars: { i: i, num: num }, setState: [...seen], pointerI: i, foundNum: num, result: true
                    });
                    return steps;
                }

                seen.push(num);
                steps.push({
                    codeLine: 8, desc: `Value not in set. Add <span class="hl-emerald">${num}</span> to <code>seen</code>.`,
                    vars: { i: i, num: num }, setState: [...seen], pointerI: i, addedNum: num
                });
            }

            steps.push({
                codeLine: 11, desc: 'Loop completes without finding any duplicated elements. Return <code>false</code>.',
                vars: { i: '-', num: '-' }, setState: [...seen], pointerI: -1, result: false
            });
            return steps;
        }

        engine.init();
    </script>
</body>

</html>
