<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LC #217 — Contains Duplicate | Arrays & Hashing</title>
    <meta name="description"
        content="Interactive dry-run visualization of LeetCode #217 Contains Duplicate using the Hash Set technique.">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #ffffff;
            --bg2: #f8f9fc;
            --bg3: #f1f3f8;
            --card-bg: #ffffff;
            --code-bg: #fafbfe;
            --border: #e2e5ef;
            --border-hover: #c5c9d8;
            --text: #1a1d2e;
            --text-secondary: #4a5068;
            --text-dim: #8891a8;
            --accent: #4f46e5;
            --accent-light: #ede9fe;
            --accent2: #7c3aed;
            --emerald: #059669;
            --emerald-bg: #ecfdf5;
            --orange: #ea580c;
            --orange-bg: #fff7ed;
            --pink: #db2777;
            --pink-bg: #fce7f3;
            --yellow: #d97706;
            --yellow-bg: #fffbeb;
            --cyan: #0891b2;
            --cyan-bg: #ecfeff;
            --purple: #7c3aed;
            --purple-bg: #f5f3ff;
            --red: #dc2626;
            --red-bg: #fef2f2;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
            --highlight-line: rgba(79, 70, 229, 0.06);
            --radius: 14px;
            --radius-sm: 10px;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg2);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--bg2);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all .2s;
            text-decoration: none;
        }

        .back-btn:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        .header .badge {
            background: var(--accent);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .header h1 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
        }

        .header .tag {
            margin-left: auto;
            font-size: 12px;
            color: var(--accent);
            background: var(--accent-light);
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        /* ===== CONTROLS BAR ===== */
        .controls-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 24px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group label {
            font-size: 12px;
            color: var(--text-dim);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .6px;
        }

        .input-group input[type="text"] {
            background: var(--bg2);
            border: 1.5px solid var(--border);
            color: var(--accent);
            padding: 8px 14px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            width: 220px;
            outline: none;
            transition: border-color .2s;
        }

        .input-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.08);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            border-radius: 8px;
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
        }

        .btn-run {
            background: var(--accent);
            color: #fff;
        }

        .btn-run:hover {
            background: var(--accent2);
            box-shadow: var(--shadow-md);
        }

        .playback {
            display: flex;
            align-items: center;
            gap: 2px;
            margin-left: 8px;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 3px;
        }

        .playback button {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 14px;
            cursor: pointer;
            border-radius: 6px;
            transition: all .15s;
        }

        .playback button:hover {
            background: var(--accent-light);
            color: var(--accent);
        }

        .playback button.active {
            background: var(--accent-light);
            color: var(--accent);
        }

        .speed-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 6px;
        }

        .speed-group label {
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 500;
        }

        .speed-slider {
            -webkit-appearance: none;
            width: 72px;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            outline: none;
        }

        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(79, 70, 229, 0.3);
        }

        .step-info {
            margin-left: auto;
            font-size: 13px;
            color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
        }

        .step-info span {
            color: var(--accent);
            font-weight: 600;
        }

        /* ===== MAIN LAYOUT ===== */
        .main {
            display: grid;
            grid-template-columns: 420px 1fr;
            height: calc(100vh - 106px);
        }

        /* ===== CODE PANEL ===== */
        .code-panel {
            background: var(--code-bg);
            border-right: 1px solid var(--border);
            overflow-y: auto;
        }

        .code-panel::-webkit-scrollbar {
            width: 5px;
        }

        .code-panel::-webkit-scrollbar-track {
            background: transparent;
        }

        .code-panel::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .code-title {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: rgba(250, 251, 254, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-dim);
            font-weight: 600;
        }

        .code-title .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .dot-red {
            background: #ff5f56;
        }

        .dot-yellow {
            background: #ffbd2e;
        }

        .dot-green {
            background: #27c93f;
        }

        .code-lines {
            padding: 12px 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            line-height: 1.85;
        }

        .code-line {
            display: flex;
            padding: 0 16px 0 0;
            transition: background .2s;
            position: relative;
        }

        .code-line.active {
            background: var(--highlight-line);
            border-left: 3px solid var(--accent);
        }

        .code-line.active .line-num {
            color: var(--accent);
        }

        .line-num {
            display: inline-block;
            width: 42px;
            text-align: right;
            padding-right: 16px;
            color: #c8cdd8;
            user-select: none;
            flex-shrink: 0;
            font-size: 11px;
        }

        .line-content {
            white-space: pre;
            color: var(--text);
        }

        /* Syntax tokens */
        .kw {
            color: #8b5cf6;
            font-weight: 500;
        }

        .tp {
            color: #0891b2;
        }

        .fn {
            color: #2563eb;
        }

        .str {
            color: #059669;
        }

        .num {
            color: #ea580c;
        }

        .cm {
            color: #a0a8c0;
            font-style: italic;
        }

        .op {
            color: #64748b;
        }

        .br {
            color: #94a3b8;
        }

        .ret {
            color: #dc2626;
            font-weight: 500;
        }

        /* ===== VIZ PANEL ===== */
        .viz-panel {
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .viz-panel::-webkit-scrollbar {
            width: 5px;
        }

        .viz-panel::-webkit-scrollbar-track {
            background: transparent;
        }

        .viz-panel::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        /* Cards */
        .viz-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px;
            box-shadow: var(--shadow-sm);
        }

        .section-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Array Display */
        .array-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 10px 30px 10px;
        }

        .array-container::-webkit-scrollbar {
            height: 6px;
        }

        .array-container::-webkit-scrollbar-thumb {
            background: var(--border-hover);
            border-radius: 3px;
        }

        .array-element {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .array-index {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-dim);
        }

        .array-box {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg2);
            border: 2px solid var(--border);
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            position: relative;
            transition: all 0.3s;
        }

        .array-box.pointer-num {
            border-color: var(--cyan);
            background: var(--cyan-bg);
            box-shadow: 0 0 0 3px rgba(8, 145, 178, 0.1);
        }

        .array-box.pointer-num::after {
            content: 'num';
            position: absolute;
            bottom: -22px;
            font-size: 11px;
            color: var(--cyan);
            font-weight: 700;
        }

        .array-box.found {
            border-color: var(--pink);
            background: var(--pink-bg);
            color: var(--pink);
            box-shadow: 0 0 0 3px rgba(219, 39, 119, 0.1);
        }

        /* HashSet Display */
        .hashset-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 10px;
            min-height: 60px;
        }

        .set-item {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
            background: var(--purple-bg);
            border: 2px solid rgba(124, 58, 237, 0.3);
            border-radius: 50%;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 700;
            color: var(--purple);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .set-item.new-item {
            animation: popIn 0.4s forwards;
            background: var(--emerald-bg);
            border-color: var(--emerald);
            color: var(--emerald);
        }

        .set-item.duplicate-item {
            background: var(--pink-bg);
            border-color: var(--pink);
            color: var(--pink);
            box-shadow: 0 0 0 4px rgba(219, 39, 119, 0.2);
            transform: scale(1.1);
        }

        /* Variables */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
        }

        .info-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
        }

        .info-card .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .8px;
            color: var(--text-dim);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .info-card .value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 700;
        }

        .info-card.cyan .value {
            color: var(--cyan);
        }

        .info-card.purple .value {
            color: var(--purple);
        }

        /* Step description */
        .step-text {
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-secondary);
        }

        .step-text .highlight-cyan {
            color: var(--cyan);
            font-weight: 600;
        }

        .step-text .highlight-purple {
            color: var(--purple);
            font-weight: 600;
        }

        .step-text .highlight-pink {
            color: var(--pink);
            font-weight: 600;
        }

        .step-text .highlight-emerald {
            color: var(--emerald);
            font-weight: 600;
        }

        /* Result display */
        .result-box {
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            padding: 16px;
            border-radius: var(--radius-sm);
        }

        .result-box.true {
            background: var(--pink-bg);
            border: 1px solid rgba(219, 39, 119, 0.2);
            color: var(--pink);
        }

        .result-box.false {
            background: var(--emerald-bg);
            border: 1px solid rgba(5, 150, 105, 0.2);
            color: var(--emerald);
        }

        /* Welcome state */
        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            gap: 14px;
            padding: 40px;
        }

        .welcome-icon {
            font-size: 56px;
            margin-bottom: 4px;
        }

        .welcome h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
        }

        .welcome p {
            color: var(--text-secondary);
            font-size: 14px;
            max-width: 380px;
            line-height: 1.6;
        }

        .welcome .shortcut {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--accent-light);
            padding: 4px 10px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--accent);
            font-weight: 600;
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes popIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            60% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .animate-in {
            animation: fadeSlideIn .3s ease forwards;
        }

        @media (max-width: 900px) {
            .main {
                grid-template-columns: 1fr;
            }

            .code-panel {
                max-height: 280px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <a href="../../index.html" class="back-btn">← Home</a>
        <span class="badge">LC #217</span>
        <h1>Contains Duplicate</h1>
        <span class="tag">Hash Set</span>
    </div>

    <div class="controls-bar">
        <div class="input-group">
            <label>Nums</label>
            <input type="text" id="inputNums" value="1, 2, 3, 1" placeholder="e.g. 1, 2, 3, 1">
        </div>
        <button class="btn btn-run" id="runBtn" onclick="runVisualization()">▶ Run</button>
        <div class="playback">
            <button onclick="goToStart()" title="First step">⏮</button>
            <button onclick="prevStep()" title="Previous">◀</button>
            <button id="playPauseBtn" onclick="togglePlay()" title="Play / Pause">▶</button>
            <button onclick="nextStep()" title="Next">▶</button>
            <button onclick="goToEnd()" title="Last step">⏭</button>
        </div>
        <div class="speed-group">
            <label>Speed</label>
            <input type="range" class="speed-slider" id="speedSlider" min="100" max="2000" value="800" step="100">
        </div>
        <div class="step-info">Step <span id="stepCurrent">0</span> / <span id="stepTotal">0</span></div>
    </div>

    <div class="main">
        <div class="code-panel">
            <div class="code-title">
                <span class="dot dot-red"></span>
                <span class="dot dot-yellow"></span>
                <span class="dot dot-green"></span>
                Solution.java
            </div>
            <div class="code-lines" id="codeLines"></div>
        </div>
        <div class="viz-panel" id="vizPanel">
            <div class="welcome" id="welcomeState">
                <div class="welcome-icon">🔄</div>
                <h2>Contains Duplicate Visualizer</h2>
                <p>Enter an array of numbers and click <strong>Run</strong> to see how a Hash Set checks for duplicates
                    in single pass!</p>
                <p>Default: <span class="shortcut">nums = [1, 2, 3, 1]</span></p>
            </div>
        </div>
    </div>

    <script>
        const CODE_LINES = [
            { tokens: [{ t: 'kw', v: 'class' }, { t: 'tp', v: ' Solution' }, { t: 'br', v: ' {' }] },
            { tokens: [{ t: 'kw', v: '    public' }, { t: 'tp', v: ' boolean' }, { t: 'fn', v: ' containsDuplicate' }, { t: 'br', v: '(' }, { t: 'tp', v: 'int' }, { t: 'br', v: '[]' }, { t: '', v: ' nums' }, { t: 'br', v: ') {' }] },
            { tokens: [{ t: 'tp', v: '        Set' }, { t: 'op', v: '<' }, { t: 'tp', v: 'Integer' }, { t: 'op', v: '> ' }, { t: '', v: 'seen' }, { t: 'op', v: ' = ' }, { t: 'kw', v: 'new' }, { t: 'tp', v: ' HashSet' }, { t: 'op', v: '<>' }, { t: 'br', v: '()' }, { t: 'op', v: ';' }] },
            { tokens: [] },
            { tokens: [{ t: 'kw', v: '        for' }, { t: 'br', v: ' (' }, { t: 'tp', v: 'int' }, { t: '', v: ' num : nums' }, { t: 'br', v: ') {' }] },
            { tokens: [{ t: 'kw', v: '            if' }, { t: 'br', v: ' (' }, { t: '', v: 'seen.contains(num)' }, { t: 'br', v: ') {' }] },
            { tokens: [{ t: 'ret', v: '                return' }, { t: 'kw', v: ' true' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'br', v: '            }' }] },
            { tokens: [{ t: '', v: '            seen.add(num)' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'br', v: '        }' }] },
            { tokens: [] },
            { tokens: [{ t: 'ret', v: '        return' }, { t: 'kw', v: ' false' }, { t: 'op', v: ';' }] },
            { tokens: [{ t: 'br', v: '    }' }] },
            { tokens: [{ t: 'br', v: '}' }] },
        ];

        function renderCode() {
            const c = document.getElementById('codeLines');
            c.innerHTML = '';
            CODE_LINES.forEach((line, i) => {
                const div = document.createElement('div');
                div.className = 'code-line';
                div.id = `cl-${i}`;
                const num = document.createElement('span');
                num.className = 'line-num';
                num.textContent = i + 1;
                div.appendChild(num);
                const content = document.createElement('span');
                content.className = 'line-content';
                if (!line.tokens.length) { content.innerHTML = '&nbsp;'; }
                else { content.innerHTML = line.tokens.map(t => t.t ? `<span class="${t.t}">${esc(t.v)}</span>` : esc(t.v)).join(''); }
                div.appendChild(content);
                c.appendChild(div);
            });
        }
        function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        function highlightLine(idx) {
            document.querySelectorAll('.code-line.active').forEach(e => e.classList.remove('active'));
            if (idx !== null && idx >= 0) {
                const el = document.getElementById(`cl-${idx}`);
                if (el) { el.classList.add('active'); el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
            }
        }

        // ===== TRACE =====
        function generateTrace(nums) {
            const steps = [];
            let seen = [];

            steps.push({
                codeLine: 2,
                desc: 'Initialize empty <span class="highlight-purple">HashSet</span> <code>seen</code>.',
                vars: { i: '-', num: '-' },
                setState: [...seen],
                pointerI: -1
            });

            for (let i = 0; i < nums.length; i++) {
                let num = nums[i];

                steps.push({
                    codeLine: 4,
                    desc: `For-each loop: get next value <span class="highlight-cyan">num = ${num}</span>.`,
                    vars: { i: i, num: num },
                    setState: [...seen],
                    pointerI: i
                });

                steps.push({
                    codeLine: 5,
                    desc: `Check if <code>seen</code> contains <span class="highlight-cyan">${num}</span>.`,
                    vars: { i: i, num: num },
                    setState: [...seen],
                    pointerI: i,
                    checkNum: num
                });

                if (seen.includes(num)) {
                    steps.push({
                        codeLine: 6,
                        desc: `Duplicate found! The set already contains <span class="highlight-pink">${num}</span>. Return <code>true</code>.`,
                        vars: { i: i, num: num },
                        setState: [...seen],
                        pointerI: i,
                        foundNum: num,
                        result: true
                    });
                    return steps;
                }

                seen.push(num);
                steps.push({
                    codeLine: 8,
                    desc: `Value not in set. Add <span class="highlight-emerald">${num}</span> to <code>seen</code>.`,
                    vars: { i: i, num: num },
                    setState: [...seen],
                    pointerI: i,
                    addedNum: num
                });
            }

            steps.push({
                codeLine: 11,
                desc: 'Loop completes without finding any duplicated elements. Return <code>false</code>.',
                vars: { i: '-', num: '-' },
                setState: [...seen],
                pointerI: -1,
                result: false
            });
            return steps;
        }

        // ===== STATE =====
        let steps = [], currentStep = 0, isPlaying = false, playInterval = null;
        let currentArray = [];

        function runVisualization() {
            const numsStr = document.getElementById('inputNums').value;
            const nums = numsStr.split(',').map(n => parseInt(n.trim())).filter(n => !isNaN(n));

            if (nums.length === 0) {
                alert('Please enter a valid list of numbers.');
                return;
            }

            currentArray = nums;
            steps = generateTrace(nums);
            currentStep = 0;
            stopPlay();
            document.getElementById('welcomeState').style.display = 'none';
            renderStep();
        }

        function renderStep() {
            if (!steps.length) return;
            const step = steps[currentStep];
            document.getElementById('stepCurrent').textContent = currentStep + 1;
            document.getElementById('stepTotal').textContent = steps.length;
            highlightLine(step.codeLine);
            renderViz(step);
        }

        function renderViz(step) {
            const panel = document.getElementById('vizPanel');
            const w = document.getElementById('welcomeState');
            if (w) w.style.display = 'none';
            panel.querySelectorAll('.viz-content').forEach(e => e.remove());

            const wrap = document.createElement('div');
            wrap.className = 'viz-content animate-in';

            // Array
            const av = document.createElement('div');
            av.className = 'viz-card';
            av.innerHTML = '<div class="section-label">🔢 Array (nums)</div>';
            const arrContainer = document.createElement('div');
            arrContainer.className = 'array-container';
            for (let i = 0; i < currentArray.length; i++) {
                const el = document.createElement('div');
                el.className = 'array-element';
                const idx = document.createElement('div');
                idx.className = 'array-index';
                idx.textContent = i;
                const box = document.createElement('div');
                box.className = 'array-box';
                box.textContent = currentArray[i];

                if (i === step.pointerI) {
                    box.classList.add('pointer-num');
                }
                if (step.foundNum !== undefined && currentArray[i] === step.foundNum) {
                    box.classList.add('found');
                }

                el.appendChild(idx);
                el.appendChild(box);
                arrContainer.appendChild(el);
            }
            av.appendChild(arrContainer);
            wrap.appendChild(av);

            // HashSet
            const mv = document.createElement('div');
            mv.className = 'viz-card';
            mv.innerHTML = '<div class="section-label">🗂️ HashSet (seen)</div>';
            const setContainer = document.createElement('div');
            setContainer.className = 'hashset-container';

            if (step.setState.length === 0) {
                setContainer.innerHTML = '<div style="font-size: 13px; color: var(--text-dim);">({} empty)</div>';
            } else {
                step.setState.forEach(item => {
                    const entry = document.createElement('div');
                    entry.className = 'set-item';
                    entry.textContent = item;

                    if (step.addedNum === item) {
                        entry.classList.add('new-item');
                    }
                    if (step.checkComp === item) {
                        // visually indicate we're checking this
                        entry.style.boxShadow = '0 0 0 2px var(--cyan)';
                    }
                    if (step.foundNum === item) {
                        entry.classList.add('duplicate-item');
                    }

                    setContainer.appendChild(entry);
                });
            }
            mv.appendChild(setContainer);
            wrap.appendChild(mv);

            // Variables
            const vars = step.vars || {};
            const ev = document.createElement('div');
            ev.className = 'viz-card';
            ev.innerHTML = '<div class="section-label">📊 Variables</div>';
            const grid = document.createElement('div'); grid.className = 'info-grid';

            grid.innerHTML = `
                <div class="info-card cyan"><div class="label">num</div><div class="value">${vars.num}</div></div>
                <div class="info-card purple"><div class="label">seen.size()</div><div class="value">${step.setState.length}</div></div>
            `;
            ev.appendChild(grid);
            wrap.appendChild(ev);

            // Step Detail
            const sd = document.createElement('div'); sd.className = 'viz-card';
            sd.innerHTML = `<div class="section-label">💡 Step Detail</div><div class="step-text">${step.desc}</div>`;
            wrap.appendChild(sd);

            // Result
            if (step.result !== undefined) {
                const rc = document.createElement('div'); rc.className = 'viz-card animate-in';
                rc.innerHTML = `<div class="section-label">🏆 Result Output</div>`;
                const pd = document.createElement('div');
                pd.className = `result-box ${step.result}`;
                pd.textContent = `return ${step.result};`;
                rc.appendChild(pd);
                wrap.appendChild(rc);
            }

            panel.appendChild(wrap);
        }

        // Playback
        function nextStep() { if (currentStep < steps.length - 1) { currentStep++; renderStep(); } else stopPlay(); }
        function prevStep() { if (currentStep > 0) { currentStep--; renderStep(); } }
        function goToStart() { currentStep = 0; renderStep(); }
        function goToEnd() { currentStep = steps.length - 1; renderStep(); }
        function togglePlay() { isPlaying ? stopPlay() : startPlay(); }
        function startPlay() { if (!steps.length) return; isPlaying = true; document.getElementById('playPauseBtn').textContent = '⏸'; document.getElementById('playPauseBtn').classList.add('active'); const spd = parseInt(document.getElementById('speedSlider').value); playInterval = setInterval(() => { if (currentStep < steps.length - 1) { currentStep++; renderStep(); } else stopPlay(); }, spd); }
        function stopPlay() { isPlaying = false; document.getElementById('playPauseBtn').textContent = '▶'; document.getElementById('playPauseBtn').classList.remove('active'); if (playInterval) { clearInterval(playInterval); playInterval = null; } }

        document.getElementById('speedSlider').addEventListener('input', () => { if (isPlaying) { stopPlay(); startPlay(); } });
        document.getElementById('inputNums').addEventListener('keydown', e => { if (e.key === 'Enter') runVisualization(); });

        // Init
        renderCode();
    </script>
</body>

</html>
