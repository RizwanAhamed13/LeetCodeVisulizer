<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizing Sliding Window | Dual Protocol Layout</title>
    <meta name="description"
        content="Interactive dry-run visualization of Go-Back-N and Selective Repeat protocols with two distinct arrays and 4 pointers.">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../core/engine.css">
    <style>
        /* ===== STEP PANEL (Will Replace Code Panel) ===== */
        .step-panel {
            overflow-y: auto;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .panel-title {
            position: sticky;
            top: 0;
            z-index: 10;
            padding: 10px 16px;
            background: rgba(250, 251, 254, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .step-item {
            padding: 14px 20px;
            border-bottom: 1px solid var(--bg3);
            cursor: pointer;
            transition: all 0.2s;
        }

        .step-item:hover {
            background: var(--bg3);
        }

        .step-item.active {
            background: var(--highlight-line);
            border-left: 3px solid var(--accent);
        }

        .step-num {
            font-size: 10px;
            font-weight: 800;
            color: var(--text-dim);
            display: block;
            margin-bottom: 4px;
        }

        .step-item.active .step-num {
            color: var(--accent);
        }

        .step-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .step-item.active .step-title {
            color: var(--text);
        }

        /* ===== TOGGLE BUTTONS ===== */
        .mode-toggle {
            display: flex;
            background: var(--bg2);
            padding: 3px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-right: 12px;
        }

        .mode-btn {
            padding: 6px 14px;
            border: none;
            background: transparent;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-dim);
            cursor: pointer;
            border-radius: 7px;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: var(--bg);
            color: var(--accent);
            box-shadow: var(--shadow-sm);
        }

        /* Arrays */
        .array-container {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 45px 20px 55px;
            position: relative;
            box-shadow: var(--shadow-sm);
        }

        .array-label {
            position: absolute;
            top: 12px;
            left: 20px;
            font-size: 10px;
            font-weight: 800;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .array-row {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .cell {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg3);
            border: 2px solid var(--border);
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-dim);
            transition: all 0.3s;
            position: relative;
        }

        .cell.sent {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
        }

        .cell.received {
            background: var(--emerald-bg);
            border-color: var(--emerald);
            color: var(--emerald);
        }

        .cell.buffered {
            border-style: dashed;
            border-color: var(--emerald);
            background: white;
            color: var(--emerald);
        }

        .window {
            position: absolute;
            height: 64px;
            top: 37px;
            border: 3px solid var(--accent);
            border-radius: 12px;
            background: rgba(79, 70, 229, 0.05);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            z-index: 5;
        }

        .window.receiver {
            border-color: var(--emerald);
            background: rgba(5, 150, 105, 0.05);
        }

        /* Pointers */
        .pointer {
            position: absolute;
            width: 2px;
            height: 25px;
            background: var(--accent);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .pointer::after {
            content: attr(data-label);
            position: absolute;
            white-space: nowrap;
            font-size: 9px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            color: white;
            background: var(--accent);
            left: 50%;
            transform: translateX(-50%);
        }

        .pointer.top {
            top: -28px;
        }

        .pointer.top::after {
            top: -16px;
        }

        .pointer.top::before {
            content: '';
            position: absolute;
            bottom: -4px;
            left: -4px;
            border-left: 5px solid transparent;
            border-right: 5px solid transparent;
            border-top: 5px solid var(--accent);
        }

        .pointer.bottom {
            bottom: -28px;
        }

        .pointer.bottom::after {
            bottom: -16px;
        }

        .pointer.bottom::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            border-left: 5px solid transparent;
            border-right: 5px solid transparent;
            border-bottom: 5px solid var(--accent);
        }

        .pointer.emerald {
            background: var(--emerald);
        }

        .pointer.emerald::after {
            background: var(--emerald);
        }

        .pointer.emerald::before {
            border-top-color: var(--emerald);
            border-bottom-color: var(--emerald);
        }

        /* Network */
        .medium {
            width: 100%;
            height: 100px;
            position: relative;
            border-radius: var(--radius);
            border: 1px dashed var(--border);
            overflow: hidden;
            margin: 10px 0;
        }

        .packet {
            position: absolute;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            z-index: 20;
            color: white;
            transition: all 0.5s;
            top: 35px;
        }

        .packet.data {
            background: var(--accent);
        }

        .packet.ack {
            background: var(--emerald);
        }

        .packet.lost {
            opacity: 0;
            transform: scale(0);
        }

        /* Explanation */
        .info-card {
            width: 100%;
            background: #fffbe6;
            padding: 24px;
            border-radius: var(--radius);
            border: 1px solid #ffe58f;
        }

        .info-title {
            font-size: 14px;
            font-weight: 700;
            color: #856404;
            margin-bottom: 8px;
        }

        .info-text {
            font-size: 14px;
            line-height: 1.6;
            color: #856404;
        }
    </style>
</head>

<body>
    <script src="../core/engine.js"></script>
    <script>
        const GBN_STEPS = [
            { title: "Setup Parameters", desc: "Window Size = 4. S_base tracks the oldest unacknowledged frame. S_next is where new transmissions happen. R_expected is the strict sequence number the receiver demands.", sBase: 0, sNext: 0, rBase: 0, rNext: 0, sState: [], rState: [], packets: [] },
            { title: "Pipelining Frames", desc: "The sender pushes multiple frames (0-3) onto the network simultaneously. This 'pipelining' prevents the network from sitting idle waiting for single ACKs.", sBase: 0, sNext: 4, rBase: 0, rNext: 0, sState: [0, 1, 2, 3], rState: [], packets: [{ v: 0, p: 0.8, t: 'data' }, { v: 1, p: 0.6, t: 'data' }, { v: 2, p: 0.4, t: 'data' }, { v: 3, p: 0.2, t: 'data' }] },
            { title: "In-Order Delivery", desc: "Frame 0 arrives safely. It matches R_expected (0). The receiver accepts it, increments R_expected, and sends back a cumulative ACK 1 (saying 'I am ready for 1').", sBase: 0, sNext: 4, rBase: 1, rNext: 1, sState: [0, 1, 2, 3], rState: [0], packets: [{ v: 1, p: 0.5, t: 'ack' }, { v: 1, p: 0.8, t: 'data' }, { v: 2, p: 0.6, t: 'data' }, { v: 3, p: 0.4, t: 'data' }] },
            { title: "Sliding The Window", desc: "ACK 1 arrives! S_base slides forward to 1. This confirmation creates space in the sender's window, allowing it to inject frame 4 into the network.", sBase: 1, sNext: 5, rBase: 1, rNext: 1, sState: [1, 2, 3, 4], rState: [0], packets: [{ v: 4, p: 0.2, t: 'data' }, { v: 2, p: 0.8, t: 'data' }] },
            { title: "Network Loss", desc: "Frame 2 gets dropped in transit. Frame 1 arrives safely, R_expected becomes 2, and ACK 2 is sent. The receiver is now strictly waiting for frame 2.", sBase: 1, sNext: 5, rBase: 2, rNext: 2, sState: [2, 3, 4], rState: [0, 1], packets: [{ v: 2, p: 0.5, t: 'data', lost: true }, { v: 3, p: 0.8, t: 'data' }, { v: 4, p: 0.6, t: 'data' }] },
            { title: "Strict Ordering Flaw", desc: "Frames 3 and 4 arrive safely, but R_expected is stuck at 2. GBN absolutely requires in-order delivery. It drops 3 and 4 entirely and stubbornly repeats ACK 2.", sBase: 1, sNext: 5, rBase: 2, rNext: 2, sState: [2, 3, 4], rState: [0, 1], packets: [{ v: 2, p: 0.4, t: 'ack' }, { v: 3, p: 1.0, t: 'data', rej: true }, { v: 4, p: 0.8, t: 'data', rej: true }] },
            { title: "Sender Timeout", desc: "The sender's timer for frame 2 expires. Because no ACK greater than 2 arrived, GBN pessimistically assumes everything from S_base onward was destroyed.", sBase: 2, sNext: 2, rBase: 2, rNext: 2, sState: [], rState: [0, 1], packets: [] },
            { title: "Go-Back-N Retransmission", desc: "The defining moment of GBN: The sender rolls S_next back to S_base (2) and retransmits the ENTIRE window (2, 3, and 4), wasting bandwidth on 3 and 4.", sBase: 2, sNext: 5, rBase: 2, rNext: 2, sState: [2, 3, 4], rState: [0, 1], packets: [{ v: 2, p: 0.1, t: 'data' }, { v: 3, p: 0.08, t: 'data' }, { v: 4, p: 0.06, t: 'data' }] },
            { title: "System Recovery", desc: "Frame 2 finally arrives! It matches R_expected. The receiver accepts it, increments R_expected, and the system restores perfect synchronization.", sBase: 2, sNext: 5, rBase: 3, rNext: 3, sState: [2, 3, 4], rState: [0, 1, 2], packets: [{ v: 3, p: 0.5, t: 'ack' }] }
        ];

        const SR_STEPS = [
            { title: "Setup Parameters", desc: "Window Size = 4. Selective Repeat (SR) uses two full windows. The receiver has its own buffer to catch out-of-order packets, breaking GBN's strict dependency.", sBase: 0, sNext: 0, rBase: 0, rNext: 0, sState: [], rState: [], packets: [] },
            { title: "Pipelining Frames", desc: "Just like GBN, the sender transmits frames 0-3 simultaneously. Both protocols rely on this burst behavior for high throughput.", sBase: 0, sNext: 4, rBase: 0, rNext: 0, sState: [0, 1, 2, 3], rState: [], packets: [{ v: 0, p: 0.8, t: 'data' }, { v: 1, p: 0.6, t: 'data' }, { v: 2, p: 0.4, t: 'data' }, { v: 3, p: 0.2, t: 'data' }] },
            { title: "Individual ACKs", desc: "Frame 0 arrives. Unlike GBN's cumulative ACKs ('ready for 1'), SR sends an individual ACK ('I received exactly 0'). R_base slides forward.", sBase: 0, sNext: 4, rBase: 1, rNext: 1, sState: [0, 1, 2, 3], rState: [0], packets: [{ v: 0, p: 0.5, t: 'ack' }, { v: 1, p: 0.8, t: 'data' }, { v: 2, p: 0.6, t: 'data' }, { v: 3, p: 0.4, t: 'data' }] },
            { title: "Network Loss", desc: "Frame 2 disappears. Frame 1 arrives safely, confirming its receipt with ACK 1, and the receiver slides R_base. Sender sees ACK 0 and sends frame 4.", sBase: 1, sNext: 5, rBase: 1, rNext: 1, sState: [1, 2, 3, 4], rState: [0], packets: [{ v: 2, p: 0.5, t: 'data', lost: true }, { v: 1, p: 1.0, t: 'data' }, { v: 3, p: 0.8, t: 'data' }, { v: 4, p: 0.6, t: 'data' }] },
            { title: "Out-of-Order Buffering", desc: "THE FIX: Frames 3 and 4 arrive. R_base is stuck at 2, but 3 and 4 fit inside the receiver's window! Receiver BUFFERS them and sends individual ACKs for 3 & 4.", sBase: 2, sNext: 5, rBase: 2, rNext: 5, sState: [2, 3, 4], rState: [0, 1, 3, 4], packets: [{ v: 3, p: 0.4, t: 'ack' }, { v: 4, p: 0.2, t: 'ack' }] },
            { title: "Sender State", desc: "Sender receives ACKs for 3 and 4 and marks them done. But S_base CANNOT slide because frame 2 is still unacknowledged entirely.", sBase: 2, sNext: 5, rBase: 2, rNext: 5, sState: [2, 3, 4], rState: [0, 1, 3, 4], packets: [] },
            { title: "Selective Timeout", desc: "The independent timer for frame 2 expires. SR behaves surgically: it ONLY resends the missing frame 2, saving network bandwidth.", sBase: 2, sNext: 5, rBase: 2, rNext: 5, sState: [2, 3, 4], rState: [0, 1, 3, 4], packets: [{ v: 2, p: 0.1, t: 'data' }] },
            { title: "Receiver Cascade", desc: "Frame 2 arrives! R_base moves to 3, but wait—3 & 4 are already buffered! The receiver delivers 2, 3, and 4 instantly, cascading R_base all the way forward to 5.", sBase: 2, sNext: 5, rBase: 5, rNext: 5, sState: [2, 3, 4], rState: [0, 1, 2, 3, 4], packets: [{ v: 2, p: 0.5, t: 'ack' }] },
            { title: "Full Synchronization", desc: "The sender receives ACK 2. Since 3 and 4 were marked done, S_base jumps directly to 5. Both sender and receiver arrays are perfectly synced.", sBase: 5, sNext: 5, rBase: 5, rNext: 5, sState: [], rState: [0, 1, 2, 3, 4], packets: [] }
        ];

        let mode = 'gbn';

        const engine = new VizEngine({
            title: "Sliding Window Protocol",
            badge: "Network",
            tag: "Protocol",
            codeLines: [],
            onRun: () => {
                return mode === 'gbn' ? GBN_STEPS : SR_STEPS;
            },
            onRenderStep: (step, container, eng) => {
                // Determine pointer offset
                const getPtrLeft = (idx, baseId) => {
                    const el = document.getElementById(baseId + Math.min(idx, 7));
                    if (!el) return 0;
                    let l = el.offsetLeft + 24;
                    if (idx > 7) l += 30; // offset if pointers go beyond array limit
                    return l;
                };

                const getWindowParams = (idx, baseId) => {
                    const el = document.getElementById(baseId + idx);
                    if (!el) return { w: 0, l: 0 };
                    return {
                        l: el.offsetLeft - 6,
                        w: 48 * 4 + 8 * 3 + 12
                    };
                };

                let arraysHtml = `<div style="display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%;">`;

                // Sender Buffer
                let sRow = `<div class="array-row" style="position: relative;">`;
                for (let i = 0; i < 8; i++) {
                    const sentClass = step.sState.includes(i) ? ' sent' : '';
                    sRow += `<div class="cell${sentClass}" id="s-c-${i}">${i}</div>`;
                }
                sRow += `</div>`;
                arraysHtml += `<div class="array-container">
                                  <div class="array-label">Sender Buffer</div>
                                  <div class="window" id="senderWindow"></div>
                                  <div class="pointer top" id="ptr-s-base" data-label="S_base"></div>
                                  <div class="pointer bottom" id="ptr-s-next" data-label="S_next"></div>
                                  ${sRow}
                               </div>`;

                // Network Medium
                let netHtml = `<div class="medium" id="networkMedium">`;
                step.packets.forEach(p => {
                    // Start absolute positioning
                    const typeClass = p.t + (p.lost ? ' lost' : '');
                    const label = (p.t === 'data' ? 'F' : 'A') + p.v + (p.rej ? ' ❌' : '');
                    // For the visualizer, we can't easily rely on left/right pixels if we don't know the exact container size at string generation time, but we can use percentage!
                    const startP = p.t === 'data' ? 5 : 95;
                    const endP = p.t === 'data' ? 95 : 5;
                    const posP = startP + (endP - startP) * p.p;
                    netHtml += `<div class="packet ${typeClass}" style="left: calc(${posP}% - 15px);">${label}</div>`;
                });
                netHtml += `</div>`;
                arraysHtml += netHtml;

                // Receiver Buffer
                let rRow = `<div class="array-row" style="position: relative;">`;
                for (let i = 0; i < 8; i++) {
                    let rClass = '';
                    if (step.rState.includes(i)) {
                        if (mode === 'sr' && i >= step.rBase) rClass = ' buffered';
                        else rClass = ' received';
                    }
                    rRow += `<div class="cell${rClass}" id="r-c-${i}">${i}</div>`;
                }
                rRow += `</div>`;

                const rNextLabel = mode === 'gbn' ? 'R_expected' : 'R_buffered_end';
                arraysHtml += `<div class="array-container">
                                  <div class="array-label">Receiver Buffer</div>
                                  <div class="window receiver" id="receiverWindow"></div>
                                  <div class="pointer top emerald" id="ptr-r-base" data-label="R_base"></div>
                                  <div class="pointer bottom emerald" id="ptr-r-next" data-label="${rNextLabel}"></div>
                                  ${rRow}
                               </div>`;

                arraysHtml += `</div>`;

                // Add the arrays visually
                container.innerHTML += eng.createZoomableCard('net_canvas', '🌐 Network Transfer Simulation', arraysHtml, '450px');

                container.innerHTML += `<div class="info-card">
                                            <div class="info-title">Mode: ${mode === 'gbn' ? 'Go-Back-N' : 'Selective Repeat'}</div>
                                            <div class="info-text">${step.desc}</div>
                                        </div>`;

                // Position pointers after appending to DOM so offsetLeft computes. We use setTimeout of 0 to ensure DOM is flushed.
                setTimeout(() => {
                    const ptrBase = document.getElementById('ptr-s-base');
                    if (ptrBase) ptrBase.style.left = getPtrLeft(step.sBase, 's-c-') + 'px';

                    const ptrNext = document.getElementById('ptr-s-next');
                    if (ptrNext) ptrNext.style.left = getPtrLeft(step.sNext, 's-c-') + 'px';

                    const rPtrBase = document.getElementById('ptr-r-base');
                    if (rPtrBase) rPtrBase.style.left = getPtrLeft(step.rBase, 'r-c-') + 'px';

                    const rPtrNext = document.getElementById('ptr-r-next');
                    if (rPtrNext) rPtrNext.style.left = getPtrLeft(step.rNext, 'r-c-') + 'px';

                    const sw = document.getElementById('senderWindow');
                    if (sw) {
                        const wp = getWindowParams(step.sBase, 's-c-');
                        sw.style.left = wp.l + 'px';
                        sw.style.width = wp.w + 'px';
                    }

                    const rw = document.getElementById('receiverWindow');
                    if (rw) {
                        const wp = getWindowParams(step.rBase, 'r-c-');
                        rw.style.left = wp.l + 'px';
                        rw.style.width = wp.w + 'px';
                    }
                }, 0);

                // Update Step List active class
                document.querySelectorAll('.step-item.active').forEach(el => el.classList.remove('active'));
                const stepEl = document.getElementById('step-el-' + eng.currentStep);
                if (stepEl) {
                    stepEl.classList.add('active');
                    stepEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }
        });

        // Initialize engine
        engine.init();

        // Dynamically override Code Pane to be a Step Panel, and inject the Mode toggles.
        document.addEventListener('DOMContentLoaded', () => {
            const controlsBar = document.querySelector('.controls-bar');

            // Insert Mode Toggle at start
            const modeToggleHTML = `
                <div class="mode-toggle">
                    <button class="mode-btn active" id="btn-gbn" onclick="setMode('gbn')">Go-Back-N</button>
                    <button class="mode-btn" id="btn-sr" onclick="setMode('sr')">Selective Repeat</button>
                </div>
            `;
            controlsBar.insertAdjacentHTML('afterbegin', modeToggleHTML);

            // Hide the default "Run" button because we will just trigger run() automatically when mode changes
            const runBtn = document.getElementById('engineRunBtn');
            if (runBtn) runBtn.style.display = 'none';

            buildStepPanel();
            engine.run(); // Initial run
        });

        function buildStepPanel() {
            const codePane = document.getElementById('engineCodePane');
            const stepsToRender = mode === 'gbn' ? GBN_STEPS : SR_STEPS;
            let listHtml = `<div class="panel-title">${mode === 'gbn' ? 'Go-Back-N' : 'Selective Repeat'} Steps</div><div id="stepList">`;

            stepsToRender.forEach((st, i) => {
                listHtml += `<div class="step-item" id="step-el-${i}" onclick="engine.goTo(${i})">
                                <span class="step-num">STEP ${i}</span>
                                <div class="step-title">${st.title}</div>
                             </div>`;
            });
            listHtml += `</div>`;
            codePane.className = 'pane step-panel';
            codePane.innerHTML = listHtml;
        }

        window.setMode = function (m) {
            engine.stopPlay();
            mode = m;
            document.getElementById('btn-gbn').classList.toggle('active', m === 'gbn');
            document.getElementById('btn-sr').classList.toggle('active', m === 'sr');
            const badge = document.querySelector('.header .badge');
            if (badge) badge.textContent = m === 'gbn' ? 'Go-Back-N' : 'Selective Repeat';

            buildStepPanel();
            engine.run();
        };

    </script>
</body>

</html>
